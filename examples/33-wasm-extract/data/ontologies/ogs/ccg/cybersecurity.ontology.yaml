$schema: https://neo4j.com/ontology-graph-spec/1.0.0/schema.json
id: cybersecurity
version: 1
name: Cybersecurity
description: Assets, vulnerabilities, alerts, incidents, threat actors, and controls for security operations centers
nodes:
  Person:
    label: Person
    description: person
    properties:
      name:
        type: STRING
        mustExist: true
      email:
        type: STRING
      role:
        type: STRING
      description:
        type: STRING
    extensions:
      neo4j:display:
        color: '#22c55e'
        caption: name
      custom:
        - type: createContextGraph:pole
          definition:
            pole_type: PERSON
            origin: base
        - type: createContextGraph:display
          definition:
            icon: user
  Organization:
    label: Organization
    description: organization
    properties:
      name:
        type: STRING
        mustExist: true
      description:
        type: STRING
      industry:
        type: STRING
    extensions:
      neo4j:display:
        color: '#3b82f6'
        caption: name
      custom:
        - type: createContextGraph:pole
          definition:
            pole_type: ORGANIZATION
            origin: base
        - type: createContextGraph:display
          definition:
            icon: building
  Location:
    label: Location
    description: location
    properties:
      name:
        type: STRING
        mustExist: true
      address:
        type: STRING
      latitude:
        type: FLOAT
      longitude:
        type: FLOAT
    extensions:
      neo4j:display:
        color: '#a855f7'
        caption: name
      custom:
        - type: createContextGraph:pole
          definition:
            pole_type: LOCATION
            origin: base
        - type: createContextGraph:display
          definition:
            icon: map-pin
  Event:
    label: Event
    description: event
    properties:
      name:
        type: STRING
        mustExist: true
      date:
        type: DATETIME
      description:
        type: STRING
    extensions:
      neo4j:display:
        color: '#f97316'
        caption: name
      custom:
        - type: createContextGraph:pole
          definition:
            pole_type: EVENT
            origin: base
        - type: createContextGraph:display
          definition:
            icon: calendar
  Object:
    label: Object
    description: object
    properties:
      name:
        type: STRING
        mustExist: true
      description:
        type: STRING
    extensions:
      neo4j:display:
        color: '#eab308'
        caption: name
      custom:
        - type: createContextGraph:pole
          definition:
            pole_type: OBJECT
            origin: base
        - type: createContextGraph:display
          definition:
            icon: box
  Asset:
    label: Asset
    description: it asset (object)
    properties:
      name:
        type: STRING
        mustExist: true
        unique: true
      asset_type:
        type: STRING
        one_of:
          - server
          - workstation
          - network_device
          - application
          - database
          - cloud_resource
          - container
          - mobile_device
          - iot
      criticality:
        type: STRING
        one_of:
          - critical
          - high
          - medium
          - low
      environment:
        type: STRING
        one_of:
          - production
          - staging
          - development
          - dr
          - sandbox
      owner_email:
        type: STRING
      ip_address:
        type: STRING
      description:
        type: STRING
    tools:
      - type: canonicalQuery
        name: asset_exposure
        description: Get an asset's open vulnerabilities and active alerts
        cypher: |
          MATCH (asset:Asset {name: $asset_name})
          OPTIONAL MATCH (v:Vulnerability)-[:AFFECTS]->(asset)
          WHERE v.status IN ['open', 'in_remediation']
          OPTIONAL MATCH (alert:Alert)-[:TARGETS]->(asset)
          WHERE alert.status IN ['new', 'triaged', 'investigating']
          OPTIONAL MATCH (c:Control)-[:PROTECTS]->(asset)
          RETURN asset, collect(DISTINCT v) AS vulnerabilities,
                 collect(DISTINCT alert) AS active_alerts,
                 collect(DISTINCT c) AS controls
        parameters:
          - name: asset_name
            type: STRING
            description: Asset name
    extensions:
      neo4j:display:
        color: '#0ea5e9'
        caption: name
      custom:
        - type: createContextGraph:pole
          definition:
            pole_type: OBJECT
            subtype: IT_ASSET
            origin: domain
        - type: createContextGraph:display
          definition:
            icon: server
            size: 25
  Vulnerability:
    label: Vulnerability
    description: vulnerability (object)
    properties:
      cve_id:
        type: STRING
        mustExist: true
        unique: true
      name:
        type: STRING
        mustExist: true
      severity:
        type: STRING
        one_of:
          - critical
          - high
          - medium
          - low
          - informational
      cvss_score:
        type: FLOAT
      status:
        type: STRING
        one_of:
          - open
          - in_remediation
          - patched
          - accepted_risk
          - false_positive
      published_date:
        type: DATE
      description:
        type: STRING
    tools:
      - type: canonicalQuery
        name: critical_vulns
        description: List critical open vulnerabilities on production assets
        cypher: |
          MATCH (v:Vulnerability)-[:AFFECTS]->(a:Asset)
          WHERE v.severity = 'critical' AND v.status IN ['open', 'in_remediation']
            AND a.environment = 'production'
          RETURN v, a
          ORDER BY v.cvss_score DESC
          LIMIT 50
      - type: canonicalQuery
        name: defaultView
        description: create-context-graph's default visualisation query
        cypher: 'MATCH (v:Vulnerability)-[r:AFFECTS]->(a:Asset {environment: ''production''}) WHERE v.severity = ''critical'' RETURN v, r, a LIMIT 100'
    extensions:
      neo4j:display:
        color: '#dc2626'
        caption: name
      custom:
        - type: createContextGraph:pole
          definition:
            pole_type: OBJECT
            subtype: VULNERABILITY
            origin: domain
        - type: createContextGraph:display
          definition:
            icon: bug
            size: 20
  Alert:
    label: Alert
    description: security alert (event)
    properties:
      alert_id:
        type: STRING
        mustExist: true
        unique: true
      name:
        type: STRING
        mustExist: true
      detection_source:
        type: STRING
        one_of:
          - siem
          - edr
          - ids
          - waf
          - cloud_native
          - manual
          - threat_intel
      severity:
        type: STRING
        one_of:
          - critical
          - high
          - medium
          - low
      status:
        type: STRING
        one_of:
          - new
          - triaged
          - investigating
          - resolved
          - false_positive
          - suppressed
      detected_at:
        type: DATETIME
        mustExist: true
      description:
        type: STRING
    tools:
      - type: canonicalQuery
        name: search_alert
        description: Search for alerts by name, severity, or status
        cypher: |
          MATCH (a:Alert)
          WHERE toLower(a.name) CONTAINS toLower($query)
             OR a.severity = $query
             OR a.status = $query
          OPTIONAL MATCH (a)-[:TARGETS]->(asset:Asset)
          RETURN a, collect(DISTINCT asset) AS assets
          ORDER BY a.detected_at DESC
          LIMIT 30
        parameters:
          - name: query
            type: STRING
            description: Alert name, severity, or status
    extensions:
      neo4j:display:
        color: '#f59e0b'
        caption: name
      custom:
        - type: createContextGraph:pole
          definition:
            pole_type: EVENT
            subtype: SECURITY_ALERT
            origin: domain
        - type: createContextGraph:display
          definition:
            icon: alert-circle
            size: 15
  Incident:
    label: Incident
    description: security incident (event)
    properties:
      incident_id:
        type: STRING
        mustExist: true
        unique: true
      name:
        type: STRING
        mustExist: true
      incident_type:
        type: STRING
        one_of:
          - malware
          - phishing
          - account_compromise
          - data_exfiltration
          - insider
          - ddos
          - ransomware
          - unauthorized_access
      severity:
        type: STRING
        one_of:
          - sev1
          - sev2
          - sev3
          - sev4
      status:
        type: STRING
        one_of:
          - open
          - contained
          - eradicated
          - recovered
          - closed
      detected_at:
        type: DATETIME
      description:
        type: STRING
    tools:
      - type: canonicalQuery
        name: incident_blast_radius
        description: Map the blast radius of an incident through asset dependencies
        cypher: |
          MATCH (i:Incident {incident_id: $incident_id})
          OPTIONAL MATCH (alert:Alert)-[:TRIGGERED]->(i)
          OPTIONAL MATCH (alert)-[:TARGETS]->(direct:Asset)
          OPTIONAL MATCH path = (direct)-[:DEPENDS_ON*1..2]-(connected:Asset)
          RETURN i, collect(DISTINCT direct) AS direct, collect(DISTINCT connected) AS connected
        parameters:
          - name: incident_id
            type: STRING
            description: Incident ID
      - type: canonicalQuery
        name: list_incidents
        description: List Incident records with optional limit
        cypher: |
          MATCH (n:Incident)
          RETURN n
          ORDER BY n.detected_at DESC
          LIMIT toInteger($limit)
        parameters:
          - name: limit
            type: STRING
            description: 'Maximum number of results to return (default: 10)'
      - type: canonicalQuery
        name: get_incident_by_id
        description: Get a specific Incident by ID with full connections
        cypher: |
          MATCH (n:Incident {incident_id: $incident_id})
          OPTIONAL MATCH (n)-[r]-(related)
          RETURN n, type(r) AS relationship, labels(related) AS related_labels, related.name AS related_name
          LIMIT 50
        parameters:
          - name: incident_id
            type: STRING
            description: The incident ID
    extensions:
      neo4j:display:
        color: '#ef4444'
        caption: name
      custom:
        - type: createContextGraph:pole
          definition:
            pole_type: EVENT
            subtype: SECURITY_INCIDENT
            origin: domain
        - type: createContextGraph:display
          definition:
            icon: shield-alert
            size: 30
  ThreatActor:
    label: ThreatActor
    description: threat actor (organization)
    properties:
      name:
        type: STRING
        mustExist: true
        unique: true
      actor_type:
        type: STRING
        one_of:
          - apt
          - cybercriminal
          - hacktivist
          - insider
          - nation_state
          - unknown
      motivation:
        type: STRING
        one_of:
          - financial
          - espionage
          - ideological
          - disruption
          - unknown
      sophistication:
        type: STRING
        one_of:
          - novice
          - intermediate
          - advanced
          - expert
      description:
        type: STRING
    tools:
      - type: canonicalQuery
        name: threat_actor_targets
        description: Find vulnerabilities used by a threat actor and assets exposed
        cypher: |
          MATCH (ta:ThreatActor)
          WHERE toLower(ta.name) CONTAINS toLower($name)
          OPTIONAL MATCH (ta)-[:USES]->(v:Vulnerability)
          OPTIONAL MATCH (v)-[:AFFECTS]->(asset:Asset)
          WHERE v.status IN ['open', 'in_remediation']
          RETURN ta, collect(DISTINCT v) AS vulnerabilities,
                 collect(DISTINCT asset) AS exposed_assets
        parameters:
          - name: name
            type: STRING
            description: Threat actor name
    extensions:
      neo4j:display:
        color: '#7c2d12'
        caption: name
      custom:
        - type: createContextGraph:pole
          definition:
            pole_type: ORGANIZATION
            subtype: THREAT_ACTOR
            origin: domain
        - type: createContextGraph:display
          definition:
            icon: skull
            size: 25
  Control:
    label: Control
    description: security control (object)
    properties:
      control_id:
        type: STRING
        mustExist: true
        unique: true
      name:
        type: STRING
        mustExist: true
      control_family:
        type: STRING
        one_of:
          - access_control
          - awareness
          - audit
          - configuration
          - identification
          - incident_response
          - maintenance
          - media
          - physical
          - planning
          - personnel
          - risk_assessment
          - security_assessment
          - system
          - communications
          - integrity
      status:
        type: STRING
        one_of:
          - implemented
          - partially_implemented
          - planned
          - not_applicable
          - failed
      framework:
        type: STRING
    extensions:
      neo4j:display:
        color: '#10b981'
        caption: name
      custom:
        - type: createContextGraph:pole
          definition:
            pole_type: OBJECT
            subtype: SECURITY_CONTROL
            origin: domain
        - type: createContextGraph:display
          definition:
            icon: lock
            size: 15
  User:
    label: User
    description: system user (person)
    properties:
      name:
        type: STRING
        mustExist: true
        unique: true
      username:
        type: STRING
        unique: true
      role:
        type: STRING
        one_of:
          - employee
          - contractor
          - admin
          - service_account
          - partner
          - vendor
      status:
        type: STRING
        one_of:
          - active
          - disabled
          - locked
          - terminated
      email:
        type: STRING
    extensions:
      neo4j:display:
        color: '#2563eb'
        caption: name
      custom:
        - type: createContextGraph:pole
          definition:
            pole_type: PERSON
            subtype: SYSTEM_USER
            origin: domain
        - type: createContextGraph:display
          definition:
            icon: user
            size: 15
relationships:
  WORKS_FOR:
    type: WORKS_FOR
    from:
      node: Person
    to:
      node: Organization
    extensions:
      custom:
        - type: createContextGraph:origin
          definition:
            origin: base
  LOCATED_AT:
    type: LOCATED_AT
    from:
      node: Organization
    to:
      node: Location
    extensions:
      custom:
        - type: createContextGraph:origin
          definition:
            origin: base
  PARTICIPATED_IN:
    type: PARTICIPATED_IN
    from:
      node: Person
    to:
      node: Event
    extensions:
      custom:
        - type: createContextGraph:origin
          definition:
            origin: base
  AFFECTS:
    type: AFFECTS
    from:
      node: Vulnerability
    to:
      node: Asset
    extensions:
      custom:
        - type: createContextGraph:origin
          definition:
            origin: domain
  TRIGGERED:
    type: TRIGGERED
    from:
      node: Alert
    to:
      node: Incident
    extensions:
      custom:
        - type: createContextGraph:origin
          definition:
            origin: domain
  TARGETS:
    type: TARGETS
    from:
      node: Alert
    to:
      node: Asset
    extensions:
      custom:
        - type: createContextGraph:origin
          definition:
            origin: domain
  ATTRIBUTED_TO:
    type: ATTRIBUTED_TO
    from:
      node: Incident
    to:
      node: ThreatActor
    extensions:
      custom:
        - type: createContextGraph:origin
          definition:
            origin: domain
  USES:
    type: USES
    from:
      node: ThreatActor
    to:
      node: Vulnerability
    extensions:
      custom:
        - type: createContextGraph:origin
          definition:
            origin: domain
  OWNS:
    type: OWNS
    from:
      node: Person
    to:
      node: Asset
    extensions:
      custom:
        - type: createContextGraph:origin
          definition:
            origin: domain
  ACCESSES:
    type: ACCESSES
    from:
      node: User
    to:
      node: Asset
    extensions:
      custom:
        - type: createContextGraph:origin
          definition:
            origin: domain
  MITIGATES:
    type: MITIGATES
    from:
      node: Control
    to:
      node: Vulnerability
    extensions:
      custom:
        - type: createContextGraph:origin
          definition:
            origin: domain
  PROTECTS:
    type: PROTECTS
    from:
      node: Control
    to:
      node: Asset
    extensions:
      custom:
        - type: createContextGraph:origin
          definition:
            origin: domain
  ASSIGNED_TO:
    type: ASSIGNED_TO
    from:
      node: Incident
    to:
      node: Person
    extensions:
      custom:
        - type: createContextGraph:origin
          definition:
            origin: domain
  REPORTED_BY:
    type: REPORTED_BY
    from:
      node: Alert
    to:
      node: User
    extensions:
      custom:
        - type: createContextGraph:origin
          definition:
            origin: domain
  DEPENDS_ON:
    type: DEPENDS_ON
    from:
      node: Asset
    to:
      node: Asset
    extensions:
      custom:
        - type: createContextGraph:origin
          definition:
            origin: domain
  BELONGS_TO:
    type: BELONGS_TO
    from:
      node: Asset
    to:
      node: Organization
    extensions:
      custom:
        - type: createContextGraph:origin
          definition:
            origin: domain
  ORIGINATES_FROM:
    type: ORIGINATES_FROM
    from:
      node: Alert
    to:
      node: Location
    extensions:
      custom:
        - type: createContextGraph:origin
          definition:
            origin: domain
extensions:
  custom:
    - type: createContextGraph:domain
      definition:
        tagline: AI-powered Security Intelligence
        emoji: 🛡️
        inherits: _base
    - type: createContextGraph:documentTemplates
      definition:
        - id: incident_report
          name: Incident Report
          description: Post-incident report with root cause and remediation
          count: 5
          prompt_template: |
            Write an incident report for {{incident.name}} ({{incident.incident_type}}, {{incident.severity}}).
            Incident commander: {{person.name}}. Affected assets: {{asset_list}}.
            Cover timeline, impact, root cause, containment, eradication, and lessons learned.
          required_entities:
            - Incident
            - Person
            - Asset
        - id: vulnerability_advisory
          name: Vulnerability Advisory
          description: Internal advisory for a newly disclosed CVE
          count: 6
          prompt_template: |
            Write an internal advisory for {{vulnerability.cve_id}} ({{vulnerability.severity}})
            affecting {{asset_list}}. Owner: {{person.name}}. Cover impact, exploitation likelihood,
            detection guidance, and remediation steps with timelines.
          required_entities:
            - Vulnerability
            - Asset
            - Person
        - id: threat_brief
          name: Threat Intelligence Brief
          description: Intel brief on a threat actor or campaign
          count: 5
          prompt_template: |
            Write a threat intel brief on {{threat_actor.name}} ({{threat_actor.actor_type}}).
            Cover known TTPs, recent activity, targets, attribution confidence, and recommended
            detections referencing CVEs they exploit.
          required_entities:
            - ThreatActor
            - Vulnerability
        - id: control_assessment
          name: Control Assessment
          description: Assessment of a security control against the framework
          count: 5
          prompt_template: |
            Write a control assessment for {{control.name}} ({{control.framework}}).
            Owner: {{person.name}}. Cover current implementation state, gaps,
            evidence, residual risk, and remediation plan.
          required_entities:
            - Control
            - Person
        - id: phishing_email
          name: Phishing Investigation Email
          description: Internal email about a suspicious phishing campaign
          count: 6
          prompt_template: |
            Write an email from {{person.name}} to the security team about a suspected
            phishing campaign targeting {{user_list}}. Reference the original alert and
            include indicators of compromise.
          required_entities:
            - Person
            - User
            - Alert
    - type: createContextGraph:decisionTraces
      definition:
        - id: alert_triage
          task: Triage alert {{alert.name}} with severity {{alert.severity}}
          steps:
            - thought: Confirm the alert against detection signal quality
              action: Check the detection source, prior false-positive rate, and alert volume
            - thought: Map the alert to affected assets and users
              action: Find assets targeted by the alert and users with recent access
            - thought: Search for correlated alerts in the same window
              action: Query alerts on the same assets in the past 24 hours
            - thought: Assign severity and ownership
              action: Compare against criticality of affected assets and on-call roster
          outcome_template: 'Triage: {{disposition}}. Owner: {{owner}}. Escalation: {{escalation}}'
        - id: patch_prioritization
          task: Prioritize patching for {{vulnerability.cve_id}}
          steps:
            - thought: Quantify exposure across the fleet
              action: Count assets affected and break down by criticality and environment
            - thought: Assess exploitability and active threat interest
              action: Find threat actors known to exploit this vulnerability
            - thought: Evaluate compensating controls
              action: Find controls that mitigate this vulnerability and check their status
            - thought: Schedule against maintenance windows
              action: Review dependencies for assets requiring patching
          outcome_template: 'Priority: {{priority}}. Window: {{window}}. Risk-accepted assets: {{risk_accept}}'
        - id: incident_containment
          task: Containment plan for {{incident.name}}
          steps:
            - thought: Identify lateral-movement risk
              action: Find assets connected to the affected asset via DEPENDS_ON or ACCESSES
            - thought: Decide between isolation and continued observation
              action: Compare business impact of isolation against attacker's known TTPs
            - thought: Coordinate user-credential responses
              action: Find users with recent access to affected assets and their privilege levels
          outcome_template: 'Action: {{action}}. Assets isolated: {{count}}. User actions: {{user_actions}}'
        - id: false_positive_review
          task: Review repeated false positives from {{alert.detection_source}}
          steps:
            - thought: Quantify the noise volume and pattern
              action: Count alerts marked false-positive over the past 30 days from this source
            - thought: Determine if a detection rule needs tuning
              action: Find common asset targets and timing patterns in the false-positives
            - thought: Evaluate downstream cost of suppression
              action: Check whether any true incidents originated from this rule historically
          outcome_template: 'Decision: {{decision}}. Tuning: {{tuning}}. Owner: {{owner}}'
    - type: createContextGraph:demoScenarios
      definition:
        - name: Triage & Response
          prompts:
            - Show me critical alerts from the last 24 hours
            - Which incidents are still in containment?
            - Who is the incident commander for our largest open ransomware incident?
        - name: Vulnerability Management
          prompts:
            - Which production assets are affected by critical CVEs?
            - Show me unpatched vulnerabilities older than 30 days
            - Which assets have the most open vulnerabilities?
        - name: Threat Intelligence
          prompts:
            - Which threat actors target our financial services assets?
            - What CVEs are actively exploited by APT groups we track?
            - Show me the attack path from a recent phishing alert to a critical asset
    - type: createContextGraph:systemPrompt
      definition: |
        You are an AI cybersecurity intelligence assistant with access to a comprehensive
        knowledge graph of assets, vulnerabilities, alerts, incidents, threat actors, and
        controls. You help SOC analysts triage alerts, prioritize patching, contain
        incidents, and assess control effectiveness.

        Your capabilities include:
        - Triaging alerts by severity, source, and affected asset criticality
        - Mapping vulnerabilities to assets and recommending patch priorities
        - Tracing incident blast radius through dependency graphs
        - Correlating alerts to known threat actor TTPs
        - Assessing control coverage against open vulnerabilities

        Always cite specific CVE IDs, alert IDs, asset names, and incident IDs. Lead with
        the highest-severity finding and surface compensating controls when severity drops.
    - type: createContextGraph:visualization
      definition:
        node_colors:
          Person: '#22c55e'
          Organization: '#3b82f6'
          Asset: '#0ea5e9'
          Vulnerability: '#dc2626'
          Alert: '#f59e0b'
          Incident: '#ef4444'
          ThreatActor: '#7c2d12'
          Control: '#10b981'
          User: '#2563eb'
        node_sizes:
          Incident: 30
          Asset: 25
          Vulnerability: 20
          Alert: 15
          ThreatActor: 25
          Control: 15
          User: 15
        default_cypher: 'MATCH (v:Vulnerability)-[r:AFFECTS]->(a:Asset {environment: ''production''}) WHERE v.severity = ''critical'' RETURN v, r, a LIMIT 100'
