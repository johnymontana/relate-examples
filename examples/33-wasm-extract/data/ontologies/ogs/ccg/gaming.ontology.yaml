$schema: https://neo4j.com/ontology-graph-spec/1.0.0/schema.json
id: gaming
version: 1
name: Gaming
description: Player management, game economy, quest tracking, and community analytics
nodes:
  Person:
    label: Person
    description: person
    properties:
      name:
        type: STRING
        mustExist: true
      email:
        type: STRING
      role:
        type: STRING
      description:
        type: STRING
    extensions:
      neo4j:display:
        color: '#22c55e'
        caption: name
      custom:
        - type: createContextGraph:pole
          definition:
            pole_type: PERSON
            origin: base
        - type: createContextGraph:display
          definition:
            icon: user
            size: 20
  Organization:
    label: Organization
    description: organization
    properties:
      name:
        type: STRING
        mustExist: true
      description:
        type: STRING
      industry:
        type: STRING
    extensions:
      neo4j:display:
        color: '#3b82f6'
        caption: name
      custom:
        - type: createContextGraph:pole
          definition:
            pole_type: ORGANIZATION
            origin: base
        - type: createContextGraph:display
          definition:
            icon: building
            size: 25
  Location:
    label: Location
    description: location
    properties:
      name:
        type: STRING
        mustExist: true
      address:
        type: STRING
      latitude:
        type: FLOAT
      longitude:
        type: FLOAT
    extensions:
      neo4j:display:
        color: '#a855f7'
        caption: name
      custom:
        - type: createContextGraph:pole
          definition:
            pole_type: LOCATION
            origin: base
        - type: createContextGraph:display
          definition:
            icon: map-pin
  Event:
    label: Event
    description: event
    properties:
      name:
        type: STRING
        mustExist: true
      date:
        type: DATETIME
      description:
        type: STRING
    extensions:
      neo4j:display:
        color: '#f97316'
        caption: name
      custom:
        - type: createContextGraph:pole
          definition:
            pole_type: EVENT
            origin: base
        - type: createContextGraph:display
          definition:
            icon: calendar
  Object:
    label: Object
    description: object
    properties:
      name:
        type: STRING
        mustExist: true
      description:
        type: STRING
    extensions:
      neo4j:display:
        color: '#eab308'
        caption: name
      custom:
        - type: createContextGraph:pole
          definition:
            pole_type: OBJECT
            origin: base
        - type: createContextGraph:display
          definition:
            icon: box
  Player:
    label: Player
    description: game user (object)
    properties:
      player_id:
        type: STRING
        mustExist: true
        unique: true
      username:
        type: STRING
        mustExist: true
        unique: true
      level:
        type: INTEGER
        mustExist: true
      join_date:
        type: DATE
      play_time_hours:
        type: FLOAT
      region:
        type: STRING
        one_of:
          - na
          - eu
          - asia
          - oceania
          - sa
          - africa
      status:
        type: STRING
        one_of:
          - active
          - inactive
          - banned
          - suspended
    tools:
      - type: canonicalQuery
        name: search_player
        description: Search for players by username, region, or status
        cypher: |
          MATCH (p:Player)
          WHERE toLower(p.username) CONTAINS toLower($query)
             OR toLower(coalesce(p.region, '')) CONTAINS toLower($query)
             OR toLower(coalesce(p.status, '')) CONTAINS toLower($query)
          OPTIONAL MATCH (p)-[:PLAYS]->(c:Character)
          OPTIONAL MATCH (p)-[:MEMBER_OF]->(g:Guild)
          RETURN p, collect(DISTINCT c.name) AS characters,
                 collect(DISTINCT g.name) AS guilds
          ORDER BY p.level DESC
          LIMIT 20
        parameters:
          - name: query
            type: STRING
            description: Player username, region, or status to search for
      - type: canonicalQuery
        name: list_players
        description: List Player records with optional limit
        cypher: |
          MATCH (n:Player)
          RETURN n
          ORDER BY n.username
          LIMIT toInteger($limit)
        parameters:
          - name: limit
            type: STRING
            description: 'Maximum number of results to return (default: 10)'
      - type: canonicalQuery
        name: get_player_by_id
        description: Get a specific Player by ID with all connections
        cypher: |
          MATCH (n:Player {player_id: $id})
          OPTIONAL MATCH (n)-[r]-(related)
          RETURN n, type(r) AS relationship, labels(related) AS related_labels, related.name AS related_name
          LIMIT 50
        parameters:
          - name: id
            type: STRING
            description: The player_id to look up
      - type: canonicalQuery
        name: get_top_players
        description: Get top players sorted by level in descending order
        cypher: |
          MATCH (n:Player)
          OPTIONAL MATCH (n)-[:PLAYS]->(c:Character)
          OPTIONAL MATCH (n)-[:MEMBER_OF]->(g:Guild)
          RETURN n, collect(DISTINCT c.name) AS characters,
                 collect(DISTINCT g.name) AS guilds
          ORDER BY n.level DESC
          LIMIT toInteger($limit)
        parameters:
          - name: limit
            type: STRING
            description: 'Maximum number of results to return (default: 10)'
      - type: canonicalQuery
        name: defaultView
        description: create-context-graph's default visualisation query
        cypher: MATCH (p:Player)-[:PLAYS]->(c:Character)-[:COMPLETED]->(q:Quest) RETURN p, c, q LIMIT 100
    extensions:
      neo4j:display:
        color: '#2563eb'
        caption: name
      custom:
        - type: createContextGraph:pole
          definition:
            pole_type: OBJECT
            subtype: GAME_USER
            origin: domain
        - type: createContextGraph:display
          definition:
            icon: gamepad
            size: 25
  Character:
    label: Character
    description: game character (object)
    properties:
      character_id:
        type: STRING
        mustExist: true
        unique: true
      name:
        type: STRING
        mustExist: true
      character_class:
        type: STRING
        one_of:
          - warrior
          - mage
          - rogue
          - healer
          - ranger
          - paladin
          - necromancer
      level:
        type: INTEGER
        mustExist: true
      experience_points:
        type: INTEGER
      health:
        type: INTEGER
      power_rating:
        type: FLOAT
    extensions:
      neo4j:display:
        color: '#7c3aed'
        caption: name
      custom:
        - type: createContextGraph:pole
          definition:
            pole_type: OBJECT
            subtype: GAME_CHARACTER
            origin: domain
        - type: createContextGraph:display
          definition:
            icon: shield
            size: 25
  Item:
    label: Item
    description: game item (object)
    properties:
      item_id:
        type: STRING
        mustExist: true
        unique: true
      name:
        type: STRING
        mustExist: true
      item_type:
        type: STRING
        one_of:
          - weapon
          - armor
          - consumable
          - material
          - cosmetic
          - mount
          - pet
      rarity:
        type: STRING
        one_of:
          - common
          - uncommon
          - rare
          - epic
          - legendary
          - mythic
      level_requirement:
        type: INTEGER
      gold_value:
        type: INTEGER
      stats_bonus:
        type: STRING
    tools:
      - type: canonicalQuery
        name: item_economy
        description: Analyze item distribution, pricing, and trade patterns
        cypher: |
          MATCH (i:Item)
          WHERE toLower(i.name) CONTAINS toLower($query)
             OR toLower(coalesce(i.rarity, '')) CONTAINS toLower($query)
             OR toLower(coalesce(i.item_type, '')) CONTAINS toLower($query)
          OPTIONAL MATCH (c:Character)-[:EQUIPPED]->(i)
          OPTIONAL MATCH (c2:Character)-[:OWNS]->(i)
          RETURN i.name AS item, i.item_type, i.rarity, i.gold_value,
                 count(DISTINCT c) AS equipped_count,
                 count(DISTINCT c2) AS owned_count
          ORDER BY i.gold_value DESC
          LIMIT 30
        parameters:
          - name: query
            type: STRING
            description: Item name, rarity, or type to search for
    extensions:
      neo4j:display:
        color: '#d97706'
        caption: name
      custom:
        - type: createContextGraph:pole
          definition:
            pole_type: OBJECT
            subtype: GAME_ITEM
            origin: domain
        - type: createContextGraph:display
          definition:
            icon: sword
            size: 15
  Quest:
    label: Quest
    description: game quest (event)
    properties:
      quest_id:
        type: STRING
        mustExist: true
        unique: true
      name:
        type: STRING
        mustExist: true
      description:
        type: STRING
      quest_type:
        type: STRING
        one_of:
          - main_story
          - side_quest
          - daily
          - weekly
          - raid
          - pvp
          - event
      difficulty:
        type: STRING
        one_of:
          - easy
          - normal
          - hard
          - heroic
          - mythic
      experience_reward:
        type: INTEGER
      gold_reward:
        type: INTEGER
    tools:
      - type: canonicalQuery
        name: quest_progress
        description: Get quest completion data for a character or across all players
        cypher: |
          MATCH (q:Quest)
          WHERE toLower(q.name) CONTAINS toLower($query)
             OR toLower(coalesce(q.quest_type, '')) CONTAINS toLower($query)
          OPTIONAL MATCH (c:Character)-[:COMPLETED]->(q)
          RETURN q.name AS quest, q.quest_type, q.difficulty,
                 count(c) AS completions,
                 avg(c.level) AS avg_completer_level
          ORDER BY completions DESC
          LIMIT 30
        parameters:
          - name: query
            type: STRING
            description: Quest name or type to look up
    extensions:
      neo4j:display:
        color: '#dc2626'
        caption: name
      custom:
        - type: createContextGraph:pole
          definition:
            pole_type: EVENT
            subtype: GAME_QUEST
            origin: domain
        - type: createContextGraph:display
          definition:
            icon: map
            size: 20
  Guild:
    label: Guild
    description: game organization (object)
    properties:
      guild_id:
        type: STRING
        mustExist: true
        unique: true
      name:
        type: STRING
        mustExist: true
        unique: true
      level:
        type: INTEGER
      member_count:
        type: INTEGER
      founded_date:
        type: DATE
      faction:
        type: STRING
        one_of:
          - alliance
          - horde
          - neutral
      rank:
        type: INTEGER
    tools:
      - type: canonicalQuery
        name: guild_stats
        description: Get detailed guild statistics and member roster
        cypher: |
          MATCH (g:Guild)
          WHERE toLower(g.name) CONTAINS toLower($query)
          OPTIONAL MATCH (p:Player)-[:MEMBER_OF]->(g)
          OPTIONAL MATCH (p)-[:PLAYS]->(c:Character)
          RETURN g, count(DISTINCT p) AS members,
                 avg(c.level) AS avg_member_level,
                 max(c.level) AS max_member_level,
                 collect(DISTINCT p.username)[0..10] AS top_members
          ORDER BY g.level DESC
        parameters:
          - name: query
            type: STRING
            description: Guild name to search for
    extensions:
      neo4j:display:
        color: '#059669'
        caption: name
      custom:
        - type: createContextGraph:pole
          definition:
            pole_type: OBJECT
            subtype: GAME_ORGANIZATION
            origin: domain
        - type: createContextGraph:display
          definition:
            icon: users
            size: 30
  Achievement:
    label: Achievement
    description: game milestone (event)
    properties:
      achievement_id:
        type: STRING
        mustExist: true
        unique: true
      name:
        type: STRING
        mustExist: true
      description:
        type: STRING
      category:
        type: STRING
        one_of:
          - combat
          - exploration
          - crafting
          - social
          - pvp
          - collection
          - story
      points:
        type: INTEGER
      rarity_pct:
        type: FLOAT
    tools:
      - type: canonicalQuery
        name: achievement_tracker
        description: Track achievement unlock rates and player progress
        cypher: |
          MATCH (a:Achievement)
          WHERE toLower(a.name) CONTAINS toLower($query)
             OR toLower(coalesce(a.category, '')) CONTAINS toLower($query)
          OPTIONAL MATCH (c:Character)-[:UNLOCKED]->(a)
          RETURN a.name AS achievement, a.category, a.points,
                 a.rarity_pct, count(c) AS unlock_count
          ORDER BY unlock_count ASC
          LIMIT 30
        parameters:
          - name: query
            type: STRING
            description: Achievement name or category to search for
    extensions:
      neo4j:display:
        color: '#f472b6'
        caption: name
      custom:
        - type: createContextGraph:pole
          definition:
            pole_type: EVENT
            subtype: GAME_MILESTONE
            origin: domain
        - type: createContextGraph:display
          definition:
            icon: trophy
            size: 15
relationships:
  WORKS_FOR:
    type: WORKS_FOR
    from:
      node: Person
    to:
      node: Organization
    extensions:
      custom:
        - type: createContextGraph:origin
          definition:
            origin: base
  LOCATED_AT:
    type: LOCATED_AT
    from:
      node: Organization
    to:
      node: Location
    extensions:
      custom:
        - type: createContextGraph:origin
          definition:
            origin: base
  PARTICIPATED_IN:
    type: PARTICIPATED_IN
    from:
      node: Person
    to:
      node: Event
    extensions:
      custom:
        - type: createContextGraph:origin
          definition:
            origin: base
  PLAYS:
    type: PLAYS
    from:
      node: Player
    to:
      node: Character
    extensions:
      custom:
        - type: createContextGraph:origin
          definition:
            origin: domain
  COMPLETED:
    type: COMPLETED
    from:
      node: Character
    to:
      node: Quest
    extensions:
      custom:
        - type: createContextGraph:origin
          definition:
            origin: domain
  EQUIPPED:
    type: EQUIPPED
    from:
      node: Character
    to:
      node: Item
    extensions:
      custom:
        - type: createContextGraph:origin
          definition:
            origin: domain
  TRADED_WITH:
    type: TRADED_WITH
    from:
      node: Player
    to:
      node: Player
    extensions:
      custom:
        - type: createContextGraph:origin
          definition:
            origin: domain
  MEMBER_OF:
    type: MEMBER_OF
    from:
      node: Player
    to:
      node: Guild
    extensions:
      custom:
        - type: createContextGraph:origin
          definition:
            origin: domain
  UNLOCKED:
    type: UNLOCKED
    from:
      node: Character
    to:
      node: Achievement
    extensions:
      custom:
        - type: createContextGraph:origin
          definition:
            origin: domain
  REWARDS:
    type: REWARDS
    from:
      node: Quest
    to:
      node: Item
    extensions:
      custom:
        - type: createContextGraph:origin
          definition:
            origin: domain
  OWNS:
    type: OWNS
    from:
      node: Character
    to:
      node: Item
    extensions:
      custom:
        - type: createContextGraph:origin
          definition:
            origin: domain
extensions:
  custom:
    - type: createContextGraph:domain
      definition:
        tagline: AI-powered Game Intelligence
        emoji: 🎮
        inherits: _base
    - type: createContextGraph:documentTemplates
      definition:
        - id: quest_log
          name: Quest Log
          description: Detailed quest storylines and completion logs
          count: 12
          prompt_template: |
            Write a quest log entry for quest "{{quest.name}}" ({{quest.quest_type}},
            {{quest.difficulty}} difficulty) completed by {{character.name}}
            (Level {{character.level}} {{character.character_class}}).
            Include narrative, objectives, challenges encountered,
            and rewards earned: {{quest.experience_reward}} XP, {{quest.gold_reward}} gold.
          required_entities:
            - Quest
            - Character
            - Item
        - id: patch_notes
          name: Patch Notes
          description: Game update and balance change documentation
          count: 6
          prompt_template: |
            Write patch notes for a game update affecting {{item.item_type}} items
            and {{quest.quest_type}} quests. Include balance changes to
            {{character.character_class}} class, new items added,
            quest adjustments, and bug fixes.
          required_entities:
            - Item
            - Quest
            - Character
            - Achievement
        - id: guild_communication
          name: Guild Communication
          description: Guild announcements, strategies, and communications
          count: 8
          prompt_template: |
            Write a guild announcement from the leaders of {{guild.name}}
            regarding upcoming raid on quest "{{quest.name}}" ({{quest.difficulty}}).
            Include strategy discussion, role assignments for {{character.character_class}}
            classes, required gear level, and scheduling details.
          required_entities:
            - Guild
            - Quest
            - Character
            - Player
        - id: player_report
          name: Player Report
          description: Player behavior reports and moderation documentation
          count: 6
          prompt_template: |
            Write a player behavior report for {{player.username}} ({{player.player_id}}).
            Account status: {{player.status}}. Play time: {{player.play_time_hours}} hours.
            Include activity summary, trade history, reported incidents,
            and moderation recommendation.
          required_entities:
            - Player
            - Character
            - Guild
        - id: balance_analysis
          name: Balance Analysis
          description: Game economy and class balance analysis reports
          count: 6
          prompt_template: |
            Write a game balance analysis for the {{character.character_class}} class.
            Include win rates, popular item builds, quest completion rates
            by difficulty, and comparison with other classes.
            Item economy impact: {{item.rarity}} tier pricing trends.
          required_entities:
            - Character
            - Item
            - Quest
            - Achievement
    - type: createContextGraph:decisionTraces
      definition:
        - id: balance_adjustment
          task: Evaluate whether {{character.character_class}} class needs balance adjustment
          steps:
            - thought: Analyze class performance metrics across content types
              action: Query quest completion rates and PvP win rates by class
            - thought: Compare item utilization and build diversity
              action: Check equipped items and popular builds per class
            - thought: Assess player sentiment and community feedback
              action: Review player reports and achievement unlock rates
            - thought: Model impact of proposed adjustments
              action: Simulate stat changes and estimate new performance ranges
          outcome_template: 'Balance decision: {{decision}} — {{rationale}}'
        - id: economy_intervention
          task: Determine if gold inflation requires market intervention
          steps:
            - thought: Analyze gold supply trends and sink effectiveness
              action: Query gold rewards, trade volumes, and gold drains
            - thought: Check item pricing trends on the player market
              action: Review trade history for price inflation signals
            - thought: Evaluate impact on new vs veteran player experience
              action: Compare purchasing power across player level brackets
          outcome_template: 'Economy action: {{action}} with expected impact {{impact}}'
        - id: event_design
          task: Design a limited-time event for player engagement boost
          steps:
            - thought: Identify current engagement weak points and player dropoff
              action: Query player activity trends and inactive account rates
            - thought: Review success metrics from previous events
              action: Analyze past event quests, participation, and retention impact
            - thought: Select appropriate rewards and difficulty tuning
              action: Check item rarity distribution and achievement unlock gaps
          outcome_template: 'Event design: {{event}} targeting {{audience}} with {{rewards}}'
        - id: loot_distribution
          task: Determine fair loot distribution for {{item.name}} ({{item.rarity}}) after raid quest {{quest.name}}
          steps:
            - thought: Identify all characters who participated in the quest
              action: Query characters who completed the quest and their class/level
            - thought: Check each character's existing inventory for the item or similar items
              action: Query OWNS and EQUIPPED relationships for participating characters against the item type
            - thought: Evaluate contribution and need based on class and level
              action: Compare character power ratings, levels, and class-appropriate item synergies
            - thought: Apply guild loot rules if participants are guild members
              action: Check guild membership of participating players and guild rank/policies
          outcome_template: 'Loot awarded to: {{character.name}}. Method: {{method}}. Rationale: {{rationale}}'
        - id: quest_difficulty_scaling
          task: Adjust difficulty scaling for quest {{quest.name}} ({{quest.difficulty}}) based on completion data
          steps:
            - thought: Analyze completion rates across player level brackets
              action: Query characters who completed the quest grouped by level range and class
            - thought: Identify classes that over-perform or under-perform on this quest
              action: Compare completion rates and attempt counts by character class
            - thought: Evaluate reward-to-difficulty ratio against similar quests
              action: Compare experience and gold rewards with other quests of the same difficulty tier
            - thought: Recommend specific tuning adjustments
              action: Check achievement unlock rates for quest-related achievements to gauge difficulty perception
          outcome_template: 'Scaling adjustment: {{adjustment}}. Target completion rate: {{target_pct}}%. Changes: {{changes}}'
        - id: player_matchmaking
          task: Create balanced matchmaking for PvP event involving {{player.username}} in {{player.region}} region
          steps:
            - thought: Assess the player's character roster and power ratings
              action: Query characters played by the player, their levels, classes, and power ratings
            - thought: Find potential opponents with similar skill profiles
              action: Search active players in the same region with characters of comparable level and power rating
            - thought: Balance team composition for class diversity
              action: Check character class distribution among matched players to ensure varied matchups
          outcome_template: 'Match created: {{match_id}}. Players: {{player_count}}. Balance score: {{balance_score}}'
        - id: guild_conflict_resolution
          task: Resolve resource conflict between {{guild.name}} and a rival guild over quest {{quest.name}}
          steps:
            - thought: Assess both guilds' current standings and member activity
              action: Query guild levels, member counts, ranks, and recent quest completions
            - thought: Review trade history between guild members for existing relationships
              action: Check TRADED_WITH relationships between players of the two guilds
            - thought: Evaluate quest participation and contribution from each guild
              action: Count characters from each guild who completed or attempted the contested quest
            - thought: Propose resolution based on fairness metrics
              action: Compare guild ranks, member engagement levels, and historical quest completion data
          outcome_template: 'Resolution: {{resolution}}. Primary access: {{guild.name}}. Terms: {{terms}}'
        - id: economy_balancing
          task: Rebalance gold economy around {{item.item_type}} items in the {{item.rarity}} tier
          steps:
            - thought: Analyze current gold value distribution for items in this tier
              action: Query all items of the specified type and rarity, check gold values and ownership counts
            - thought: Measure gold generation vs gold sinks for active players
              action: Compare quest gold rewards with item gold values and trade volumes
            - thought: Identify items that are significantly over- or under-valued
              action: Find items with high owned count but low gold value, or low owned count with high value
            - thought: Model impact of proposed price adjustments on player progression
              action: Check level requirements and equipped counts to gauge impact on different player brackets
          outcome_template: 'Adjustments: {{item_count}} items repriced. Gold sink change: {{sink_change}}%. Impact: {{impact}}'
        - id: achievement_validation
          task: Validate integrity of achievement {{achievement.name}} unlock patterns
          steps:
            - thought: Analyze unlock distribution across player segments
              action: Query characters who unlocked the achievement, grouped by level, class, and guild membership
            - thought: Check for anomalous unlock patterns suggesting exploits
              action: Identify clusters of unlocks in short time windows or from low-level characters
            - thought: Cross-reference with quest completion prerequisites
              action: Verify that characters who unlocked the achievement also completed required quests
          outcome_template: 'Validation: {{status}}. Anomalous unlocks: {{anomaly_count}}. Action: {{action}}'
    - type: createContextGraph:demoScenarios
      definition:
        - name: Player Analytics
          prompts:
            - Show me the most active players in the NA region by play time
            - Which players have traded with banned accounts?
            - What is the level distribution across all active players?
        - name: Game Economy
          prompts:
            - What are the most traded legendary items this week?
            - Show me the gold flow for guild Iron Brotherhood
            - Which quests generate the most gold per hour?
        - name: Content & Balance
          prompts:
            - What is the completion rate for mythic difficulty quests by class?
            - Which achievements have the lowest unlock rate?
            - Compare win rates between warrior and mage in PvP quests
    - type: createContextGraph:systemPrompt
      definition: |
        You are an AI game intelligence assistant with access to a comprehensive
        knowledge graph of player data, game content, economy, and community
        structures. You help game designers, community managers, and analysts
        understand player behavior, balance game systems, and manage the game
        economy.

        Your capabilities include:
        - Searching and analyzing player profiles, characters, and guilds
        - Tracking quest completion rates and achievement unlock patterns
        - Monitoring the in-game economy and item trading patterns
        - Analyzing class balance and combat performance metrics
        - Identifying player behavior patterns and engagement trends

        Always provide accurate, data-driven responses. When making game design
        recommendations, cite specific metrics, player data, and economic indicators
        from the knowledge graph.
    - type: createContextGraph:visualization
      definition:
        node_colors:
          Person: '#22c55e'
          Organization: '#3b82f6'
          Player: '#2563eb'
          Character: '#7c3aed'
          Item: '#d97706'
          Quest: '#dc2626'
          Guild: '#059669'
          Achievement: '#f472b6'
        node_sizes:
          Person: 20
          Organization: 25
          Player: 25
          Character: 25
          Item: 15
          Quest: 20
          Guild: 30
          Achievement: 15
        default_cypher: MATCH (p:Player)-[:PLAYS]->(c:Character)-[:COMPLETED]->(q:Quest) RETURN p, c, q LIMIT 100
