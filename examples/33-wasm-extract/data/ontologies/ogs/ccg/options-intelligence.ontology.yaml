      definition:
        node_colors:
          Person: '#22c55e'
          Organization: '#3b82f6'
          Underlying: '#0ea5e9'
          OptionsContract: '#f59e0b'
          ExposureLevel: '#8b5cf6'
          Regime: '#dc2626'
          KeyLevel: '#10b981'
          Trade: '#06b6d4'
          MarketEvent: '#ef4444'
          Strategy: '#7c3aed'
        node_sizes:
          Underlying: 30
          Regime: 25
          KeyLevel: 20
          ExposureLevel: 15
          OptionsContract: 15
          Trade: 20
          MarketEvent: 25
          Strategy: 20
          Person: 25
