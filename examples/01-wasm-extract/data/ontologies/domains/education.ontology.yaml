extensions:
  custom:
    relate-examples:
      family: domains
      industry: Education
      card:
        title: Education
        description: Follow students, courses and assessments through to the learning outcomes a failure leaves unmet and the progression it blocks.
      source:
        derived_from: create-context-graph's education.yaml at 707b168 (Apache-2.0, data/ontologies/ccg/)
        changed: >-
          The POLE+O base and the pole extension are gone; Organization became Department and Programme,
          Student and Instructor stand on their own, and LearningOutcome is new; the Enrollment kind became
          the TAKES and ENROLLED_ON links; Course, Term, Assessment and Submission keep their meaning with
          new descriptions and properties. OFFERED_IN became TAUGHT_IN, Assessment's PART_OF became
          COMPONENT_OF and GRADED_BY became MARKED_BY; FAILED, DIRECTS, MEMBER_OF, OFFERED_BY, ASSESSES and
          Course's PART_OF (to Programme) are new; BELONGS_TO, HELD_AT and ATTENDED (to the base's
          Organization, Location and Event) were dropped; TEACHES, ADVISES, PREREQUISITE_OF, SUBMITTED_BY and
          SUBMITTED_FOR were kept, and every link was given a cardinality. The tools were written anew for an
          extracted graph.
