    aliases: [is required for, must be passed before, leads on to]
    from: {node: Course}
    to: {node: Course}
    extensions:
      custom:
        relate-examples: {phrase: is a prerequisite for}
  courseTaughtInTerm:
    type: TAUGHT_IN
    description: >-
