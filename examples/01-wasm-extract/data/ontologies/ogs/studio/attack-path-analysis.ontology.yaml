schema: https://neo4j.com/docs/ontology-graph-spec/1.1.0/schema.json
version: '1'
id: attack-path-analysis
name: Attack Path Analysis
description: Relates internet-facing endpoints, compute instances, vulnerabilities, workload identities, IAM policies, cloud services and business applications so that multi-hop routes from an external foothold to a high-value asset can be traversed as paths rather than inferred from separate inventories. Answers which exposed hosts carry an exploitable vulnerability, where an attacker could move laterally from there, which crown-jewel applications and sensitive cloud data those routes terminate at, which intermediate hosts most routes depend on, and how much a single compromised identity would reach.
nodes:
  Endpoint:
    label: Endpoint
    properties:
      endpointId:
        type: STRING
        key: true
        description: Unique identifier for the internet-facing entry point. Expected to be stable across scans of the external attack surface. e.g. `EP-001`.
      dnsName:
        type: STRING
        must_exist: true
        description: 'Public DNS name an external attacker resolves to reach this entry point. Not unique across endpoints: the same name exposed on two ports is two endpoints. e.g. `shop.northwind.example`.'
      port:
        type: INTEGER
        must_exist: true
        description: TCP port on which this entry point accepts connections from the public internet. One port per endpoint, not a range and not a list. e.g. `443`.
      protocol:
        type: STRING
        description: Application-layer protocol served on that port, as a lowercase identifier. Expected to be one of `https`, `http`, `ssh`, `smtp`, `postgres`, `mysql`. e.g. `https`.
    extensions:
      display:
        x: -330
        'y': 0
        colour: '#0891b2'
      custom:
        relate-examples:
          ask: a public DNS name with dots, such as www.example.com or vpn.example.org
        tools:
          - type: canonicalQuery
            name: exposed-hosts-carrying-an-exploited-vulnerability
            question: Exposed hosts carrying an exploited vulnerability
            description: Returns compute instances that are reachable from the public internet through an endpoint and carry a CVE that is listed in the CISA Known Exploited Vulnerabilities catalogue at or above a CVSS v3.1 base score threshold. These are the candidate footholds every other query in this file starts from.
            cypher: |-
              MATCH (e:Endpoint)-[:RESOLVES_TO]->(i:ComputeInstance)-[f:HAS_VULNERABILITY]->(v:CVE)
              WHERE v.knownExploited = true
                AND v.cvssScore >= $minCvss
              RETURN i.instanceId     AS instanceId,
                     i.hostname       AS hostname,
                     i.environment    AS environment,
                     i.networkSegment AS networkSegment,
                     collect(DISTINCT e.dnsName + ':' + toString(e.port)) AS exposedOn,
                     v.cveId          AS cveId,
                     v.cvssScore      AS cvssScore,
                     v.epssScore      AS epssScore,
                     v.severity       AS severity,
                     f.detectedOn     AS lastConfirmed
              ORDER BY cvssScore DESC, epssScore DESC, instanceId
            parameters:
              - name: minCvss
                type: FLOAT
                description: Minimum CVSS v3.1 base score, 0.0 to 10.0. Start at 9.0, the lower bound of the CRITICAL band, and lower it if the result is too small to be interesting. The query already restricts to observed-in-the-wild exploitation, so the score is a second filter on an already narrow set and 7.0 is often a reasonable widening.
                example: 9.4
            category: query
            teaches: 'The starting point for triage, and deliberately not a conclusion. A host appearing here is exposed and carries a vulnerability known to be exploited; whether that matters depends on where the host can go next, which this query does not ask. Read the environment column before escalating: an exploitable host outside production is only material if a path leads from it into production, which the crown-jewel and kill-chain queries below test directly. EPSS is a likelihood and CVSS a severity — a low CVSS with a high EPSS is a weak flaw actively being used, and belongs in the queue.'
            returns: 'One row per exposed instance and qualifying CVE: instance identifier, hostname, environment, network segment, the public names and ports it is exposed on, the CVE identifier with its CVSS and EPSS scores, and the date a scan last confirmed the finding.'
            prerequisites: None beyond the imported reference ontology.
            tags:
              - exposure
              - foothold
              - vulnerability
              - kev
              - triage
            upstream:
              file: QUERIES.md
              heading: Exposed hosts carrying an exploited vulnerability
              sample: 'Bundled sample data only: $minCvss = 9.0 returns 5 rows over 4 instances, led by staging-web-01 (CVE-2024-3400, 10.0), a staging host that leads nowhere, then vpn-gateway-01, build-runner-01 (two CVEs) and legacy-portal-01 (CVE-2023-4966, 9.4).'
          - type: canonicalQuery
            name: node-key-constraints
            question: Node-key constraints
            cypher: |-
              CREATE CONSTRAINT endpoint_key IF NOT EXISTS
              FOR (e:Endpoint) REQUIRE e.endpointId IS NODE KEY
            parameters: []
            category: setup
            requires:
              - write
            upstream:
              file: QUERIES.md
              heading: Node-key constraints
              sample: ''
          - type: canonicalQuery
            name: node-key-constraints-2
            question: Node-key constraints
            cypher: |-
              CREATE CONSTRAINT compute_instance_key IF NOT EXISTS
              FOR (i:ComputeInstance) REQUIRE i.instanceId IS NODE KEY
            parameters: []
            category: setup
            requires:
              - write
            upstream:
              file: QUERIES.md
              heading: Node-key constraints
              sample: ''
          - type: canonicalQuery
            name: node-key-constraints-3
            question: Node-key constraints
            cypher: |-
              CREATE CONSTRAINT cve_key IF NOT EXISTS
              FOR (v:CVE) REQUIRE v.cveId IS NODE KEY
            parameters: []
            category: setup
            requires:
              - write
            upstream:
              file: QUERIES.md
              heading: Node-key constraints
              sample: ''
          - type: canonicalQuery
            name: node-key-constraints-4
            question: Node-key constraints
            cypher: |-
              CREATE CONSTRAINT application_key IF NOT EXISTS
              FOR (a:Application) REQUIRE a.applicationId IS NODE KEY
            parameters: []
            category: setup
            requires:
              - write
            upstream:
              file: QUERIES.md
              heading: Node-key constraints
              sample: ''
          - type: canonicalQuery
            name: node-key-constraints-5
            question: Node-key constraints
            cypher: |-
              CREATE CONSTRAINT identity_key IF NOT EXISTS
              FOR (n:Identity) REQUIRE n.identityId IS NODE KEY
            parameters: []
            category: setup
            requires:
              - write
            upstream:
              file: QUERIES.md
              heading: Node-key constraints
              sample: ''
          - type: canonicalQuery
            name: node-key-constraints-6
            question: Node-key constraints
            cypher: |-
              CREATE CONSTRAINT iam_policy_key IF NOT EXISTS
              FOR (p:IAMPolicy) REQUIRE p.policyId IS NODE KEY
            parameters: []
            category: setup
            requires:
              - write
            upstream:
              file: QUERIES.md
              heading: Node-key constraints
              sample: ''
          - type: canonicalQuery
            name: node-key-constraints-7
            question: Node-key constraints
            cypher: |-
              CREATE CONSTRAINT cloud_service_key IF NOT EXISTS
              FOR (s:CloudService) REQUIRE s.serviceId IS NODE KEY
            parameters: []
            category: setup
            requires:
              - write
            upstream:
              file: QUERIES.md
              heading: Node-key constraints
              sample: ''
    description: 'A network entry point reachable from the public internet: one listening service, identified by the public DNS name and port an unauthenticated attacker would connect to. An endpoint is the outermost step of an attack path and carries no vulnerability of its own; the exposure it creates belongs to the compute instances it resolves to.'
  ComputeInstance:
    label: ComputeInstance
    properties:
      instanceId:
        type: STRING
        key: true
        description: Unique identifier for the compute instance. Expected to be the cloud or CMDB instance identifier, stable for the life of the host. e.g. `CI-001`.
        pattern: ^CI-[0-9]{3}$
      hostname:
        type: STRING
        must_exist: true
        description: 'Operational hostname of the instance, for human recognition in results. Not an identifier: expected to be unique in practice but not relied on as one. e.g. `edge-proxy-01`.'
      environment:
        type: STRING
        must_exist: true
        description: 'Deployment environment the instance belongs to, as a lowercase identifier. Expected to be one of `production`, `staging`, `development`. Governs how seriously an exposure on the host should be read: an exploitable host in a non-production environment is only material if a path leads from it into production. e.g. `production`.'
      networkSegment:
        type: STRING
        description: Label of the network zone or subnet the instance sits in, at the granularity segmentation rules are written at. A free-form label rather than a closed set, since segment naming is site-specific. Two instances sharing a segment are not implied to reach each other — reachability is stated only by CAN_REACH. e.g. `dmz`.
    extensions:
      display:
        x: -200
        'y': 0
        colour: '#2563eb'
      custom:
        relate-examples:
          ask: a server or virtual machine named by its hostname, words and a number joined by hyphens, such as app-billing-02, web-portal-01 or db-ledger-01
          proper: true
        tools:
          - type: canonicalQuery
            name: lateral-reachability-from-a-compromised-host
            question: Lateral reachability from a compromised host
            description: Returns every compute instance reachable from one named instance by following CAN_REACH in its permitted direction, with the fewest hops to each, the applications each reached host runs, and the workload identity an attacker would inherit on landing there.
            cypher: |-
              MATCH (origin:ComputeInstance {instanceId: $instanceId})
              MATCH (reached:ComputeInstance)
              WHERE reached <> origin
              MATCH path = shortestPath((origin)-[:CAN_REACH*1..8]->(reached))
              WHERE length(path) <= $maxLateralHops
              WITH reached, length(path) AS hops
              OPTIONAL MATCH (reached)-[:RUNS]->(app:Application)
              OPTIONAL MATCH (reached)-[:RUNS_AS]->(identity:Identity)
              RETURN hops,
                     reached.instanceId     AS instanceId,
                     reached.hostname       AS hostname,
                     reached.networkSegment AS networkSegment,
                     reached.environment    AS environment,
                     collect(DISTINCT app.name + ' (' + app.tier + ')') AS applications,
                     collect(DISTINCT identity.name) AS inheritableIdentities
              ORDER BY hops ASC, hostname
            parameters:
              - name: instanceId
                type: STRING
                description: 'The instance to treat as compromised. No default applies: this is a selector, taken from the foothold query''s output or from an incident ticket.'
                example: CI-007
              - name: maxLateralHops
                type: INTEGER
                description: Maximum CAN_REACH hops to follow. Start at 4 and raise one hop at a time, watching the result size; the reachable set grows with the out-degree at each depth. The pattern's literal ceiling is 8.
                example: 4
            category: query
            teaches: 'Use during live response to answer what a confirmed compromise puts at risk, and during design review to test whether a segment boundary does what it is supposed to. The hop count is the shortest route, so it is the optimistic reading from the defender''s point of view — a host at four hops may also be reachable by several shorter-lived routes that closing one rule will not remove. The identities column is where network analysis stops being enough: an inherited identity reaches whatever its policies allow with no further lateral movement, so feed any identity returned here into the blast-radius query rather than assuming the damage ends at the host.'
            returns: 'One row per reachable instance, ordered by hop distance: the hop count, instance identifier, hostname, network segment, the applications it runs with their tiers, and the identities inheritable there. The origin instance is not returned.'
            prerequisites: None beyond the imported reference ontology.
            tags:
              - lateral-movement
              - blast-radius
              - incident-response
              - segmentation
            upstream:
              file: QUERIES.md
              heading: Lateral reachability from a compromised host
              sample: 'Bundled sample data only: $instanceId = ''CI-007'' (legacy-portal-01), $maxLateralHops = 4 returns 10 instances at 1 to 3 hops, starting with app-crm-01 and build-runner-01 (inheritable role-ci-deployer) at 1 hop.'
    description: 'A host an attacker can execute code on: a virtual machine, bare-metal server or container host. The unit of lateral movement in this reference ontology — every hop of an internal attack path is one compute instance to the next. Vulnerabilities are carried here, not on the applications the host runs.'
    aliases:
      - Host
      - Server
  CVE:
    label: CVE
    properties:
      cveId:
        type: STRING
        key: true
        description: CVE identifier as published by the CVE Program, in `CVE-YYYY-NNNN` form. e.g. `CVE-2023-4966`.
        pattern: ^CVE-[0-9]{4}-[0-9]{4,7}$
      cvssScore:
        type: FLOAT
        must_exist: true
        extensions:
          custom:
            relate-examples:
              extract: true
              ask: the CVSS base score of the vulnerability, a number from 0.0 to 10.0 such as 9.8, written after CVSS or in a CVSS column
        description: CVSS v3.1 base score, 0.0 to 10.0. Severity of the vulnerability in isolation, with no account taken of this estate's exposure, compensating controls or asset value — the context the graph supplies separately. Not a temporal or environmental score. e.g. `9.4`.
      severity:
        type: STRING
        extensions:
          custom:
            relate-examples:
              extract: true
              ask: the severity rating of the vulnerability on the CVSS scale, written as critical, high, medium or low
        description: Qualitative severity band derived from the CVSS v3.1 base score, upper case. Expected to be one of `NONE`, `LOW`, `MEDIUM`, `HIGH`, `CRITICAL` — the CVSS v3.1 qualitative rating scale. Redundant with cvssScore and carried for readability in results. e.g. `CRITICAL`.
        one_of:
          - NONE
          - LOW
          - MEDIUM
          - HIGH
          - CRITICAL
      epssScore:
        type: FLOAT
        extensions:
          custom:
            relate-examples:
              extract: true
              ask: the EPSS probability that the vulnerability is exploited in the next 30 days, a number from 0 to 1 such as 0.97, written after EPSS or in an EPSS column
        description: 'EPSS probability, 0.0 to 1.0, that the vulnerability will be exploited in the wild within the next 30 days. A likelihood, not a severity: a high EPSS on a low CVSS flaw means a weak vulnerability that is actually being used. Expected to be refreshed daily from the EPSS feed in a live deployment. e.g. `0.97`.'
      knownExploited:
        type: BOOLEAN
        must_exist: true
        description: True when the vulnerability appears in the CISA Known Exploited Vulnerabilities catalogue, meaning exploitation has been observed in the wild rather than merely predicted. The strongest single signal for prioritising a foothold. e.g. `true`.
        reference: https://www.cisa.gov/known-exploited-vulnerabilities-catalog
      publishedDate:
        type: ZONED DATETIME
        description: Date the vulnerability record was first published. First publication, not last modification, and not the date the flaw was introduced or discovered. Carried as an ISO 8601 zoned datetime because local CSV imports do not support a bare date; the time is always midnight UTC and carries no meaning beyond the calendar date. e.g. `2023-10-10T00:00:00Z`.
    extensions:
      display:
        x: -200
        'y': -130
        colour: '#dc2626'
      custom:
        relate-examples:
          ask: a vulnerability identifier of the form CVE-year-number, such as CVE-2021-44228
          proper: true
          propose: true
    description: A published software vulnerability record, identified by its CVE identifier, together with the severity and exploitation signals used to judge it. Describes the flaw in isolation; whether the flaw matters in this estate is what the surrounding paths establish.
    aliases:
      - Vulnerability
  Application:
    label: Application
    properties:
      applicationId:
        type: STRING
        key: true
        description: Unique identifier for the application in the application portfolio or CMDB. e.g. `APP-001`.
      name:
        type: STRING
        must_exist: true
        description: Business name of the application, for recognition in results. e.g. `Payment Ledger`.
      tier:
        type: STRING
        must_exist: true
        description: 'Business criticality tier. Expected to be one of `P0`, `P1`, `P2`, `P3`, where the number ascends as criticality descends: `P0` is the most critical — the crown jewels whose compromise is materially damaging — and `P3` the least. Assigned by the business, not derived from the graph. e.g. `P0`.'
      businessUnit:
        type: STRING
        description: Business unit accountable for the application, used to route a finding to an owner. A free-form label rather than a closed set. e.g. `Finance`.
    extensions:
      display:
        x: 60
        'y': 130
        colour: '#d97706'
      custom:
        relate-examples:
          ask: a business application or service named in capitalised words, such as Expense Portal, Payroll or Claims Processing Service
          proper: true
        tools:
          - type: canonicalQuery
            name: attack-paths-from-an-exposed-foothold-to-a-crown-jewel-application
            question: Attack paths from an exposed foothold to a crown-jewel application
            description: For every exposed instance carrying an exploited vulnerability, returns the shortest directed CAN_REACH route to an instance running an application in the given criticality tier. A zero-hop result means the exposed host runs the crown jewel itself.
            cypher: |-
              MATCH (e:Endpoint)-[:RESOLVES_TO]->(entry:ComputeInstance)-[:HAS_VULNERABILITY]->(v:CVE)
              WHERE v.knownExploited = true
                AND v.cvssScore >= $minCvss
              MATCH (host:ComputeInstance)-[:RUNS]->(target:Application {tier: $crownJewelTier})
              MATCH path = shortestPath((entry)-[:CAN_REACH*0..8]->(host))
              WHERE length(path) <= $maxLateralHops
              RETURN e.dnsName        AS exposedVia,
                     entry.instanceId AS footholdInstanceId,
                     entry.hostname   AS footholdHost,
                     v.cveId          AS footholdCve,
                     v.cvssScore      AS footholdCvss,
                     target.name      AS crownJewel,
                     target.tier      AS tier,
                     target.businessUnit AS businessUnit,
                     host.hostname    AS crownJewelHost,
                     length(path)     AS lateralHops,
                     [n IN nodes(path) | n.hostname] AS route
              ORDER BY lateralHops ASC, footholdCvss DESC, crownJewel
            parameters:
              - name: minCvss
                type: FLOAT
                description: Minimum CVSS v3.1 base score for the foothold vulnerability. Start at 9.0, as in the foothold query.
                example: 9.4
              - name: crownJewelTier
                type: STRING
                description: Criticality tier that counts as a crown jewel. Start at 'P0', the most critical band in this reference ontology's encoding; substitute the top band of whatever scheme the portfolio uses.
                example: P0
              - name: maxLateralHops
                type: INTEGER
                description: Maximum CAN_REACH hops between foothold and crown-jewel host. Start at 4 and raise one hop at a time. Each extra hop multiplies the routes considered by the out-degree of the hosts at that depth, so both cost and result size climb sharply; stop at the point where the output is no longer reviewable by hand. The pattern's literal ceiling is 8.
                example: 4
            category: query
            teaches: 'The core kill-chain query, and the one whose output is worth taking to an owner: it names an exposure, a target that matters to the business, and the specific hosts in between. CAN_REACH is directed, so a returned route is traversable in the direction shown and says nothing about the reverse. It asserts network permission and an exploitable entry point, not that an attacker holds credentials for each hop — treat the route as the maximum an attacker could attempt, not as a completed intrusion. A foothold with several qualifying CVEs produces a row per CVE, which is what tells you which flaw to fix to break the path. Compare the result with the crown-jewel exposure summary: a crown jewel absent from this result is not necessarily safe, only unreached within the current bound and threshold.'
            returns: 'One row per foothold, foothold CVE and crown jewel: the public name the foothold is exposed on, the foothold host and its CVE, the crown-jewel application with its tier and host, the number of lateral hops, and the route as a list of hostnames.'
            prerequisites: None beyond the imported reference ontology. The Application.tier index in SETUP.md improves the anchor lookup.
            tags:
              - kill-chain
              - lateral-movement
              - crown-jewel
              - path
              - prioritisation
            upstream:
              file: QUERIES.md
              heading: Attack paths from an exposed foothold to a crown-jewel application
              sample: 'Bundled sample data only: $minCvss = 9.0, $crownJewelTier = ''P0'', $maxLateralHops = 4 returns 8 rows from the three production footholds to Card Tokenization Service and Payment Ledger, led by build-runner-01 to app-payments-01 at 1 hop. HR Records never appears.'
          - type: canonicalQuery
            name: choke-points-on-crown-jewel-attack-paths
            question: Choke points on crown-jewel attack paths
            description: 'Enumerates the bounded CAN_REACH routes from every exposed, exploitable foothold to every crown-jewel host, then counts how many of those routes pass through each intermediate host. Footholds and crown-jewel hosts are excluded from the count: only hosts strictly in between can be a choke point.'
            cypher: |-
              MATCH (e:Endpoint)-[:RESOLVES_TO]->(entry:ComputeInstance)-[:HAS_VULNERABILITY]->(v:CVE)
              WHERE v.knownExploited = true
                AND v.cvssScore >= $minCvss
              WITH DISTINCT entry
              MATCH (host:ComputeInstance)-[:RUNS]->(target:Application {tier: $crownJewelTier})
              MATCH path = (entry)-[:CAN_REACH*1..6]->(host)
              WHERE length(path) <= $maxLateralHops
              WITH path, target
              UNWIND nodes(path)[1..-1] AS chokePoint
              WITH chokePoint,
                   count(DISTINCT path) AS pathsThrough,
                   collect(DISTINCT target.name) AS gatesAccessTo
              WHERE pathsThrough >= $minPathsThrough
              RETURN chokePoint.instanceId     AS instanceId,
                     chokePoint.hostname       AS hostname,
                     chokePoint.networkSegment AS networkSegment,
                     pathsThrough,
                     gatesAccessTo
              ORDER BY pathsThrough DESC, hostname
            parameters:
              - name: minCvss
                type: FLOAT
                description: Minimum CVSS v3.1 base score for the foothold vulnerability. Start at 9.0, as in the foothold query.
                example: 9.4
              - name: crownJewelTier
                type: STRING
                description: Criticality tier that counts as a crown jewel. Start at 'P0'.
                example: P0
              - name: maxLateralHops
                type: INTEGER
                description: 'Maximum route length considered. Start at 3 here, one lower than elsewhere: this query enumerates every route rather than the shortest one, so the work grows far faster with the bound. Raise it one hop at a time and stop as soon as the query slows noticeably. The pattern''s literal ceiling is 6.'
                example: 3
              - name: minPathsThrough
                type: INTEGER
                description: 'Minimum number of distinct routes a host must carry to be reported. Start at 2: a host on exactly one route is not a choke point, it is simply on the route. Raise it until the result names a handful of hosts whose re-segmentation could actually be justified.'
                example: 2
            category: query
            teaches: 'Answers where to spend a segmentation budget. A host carrying many routes is a single change that removes many paths at once, which is usually cheaper than patching every foothold feeding it. Two cautions. First, route counts are a popularity measure over the routes this query enumerated, not a centrality measure over the estate — they shift with the bound and the threshold, so compare hosts within one run and not across runs. Second, this is the one query here whose cost is combinatorial rather than linear in the bound; on a large estate prefer a betweenness-centrality computation over a CAN_REACH projection in Graph Data Science, which answers the same question without enumerating routes. That is a deliberate omission from this package rather than an oversight: it would add a plugin dependency, and this query covers the use case without one.'
            returns: 'One row per intermediate host meeting the threshold, busiest first: instance identifier, hostname, network segment, the number of distinct crown-jewel routes through it, and the crown jewels those routes lead to.'
            prerequisites: None beyond the imported reference ontology.
            tags:
              - choke-point
              - segmentation
              - remediation
              - prioritisation
            upstream:
              file: QUERIES.md
              heading: Choke points on crown-jewel attack paths
              sample: 'Bundled sample data only: $minCvss = 9.0, $crownJewelTier = ''P0'', $maxLateralHops = 3, $minPathsThrough = 2 returns 3 rows: bastion-01 and build-runner-01 with 4 routes each, then app-payments-01 with 3.'
          - type: canonicalQuery
            name: crown-jewel-exposure-summary
            question: Crown-jewel exposure summary
            description: Lists every application in the given criticality tier alongside how many exposed, exploitable footholds reach it within the hop bound and the fewest hops any of them needs. Crown jewels that no qualifying foothold reaches are returned with a count of zero rather than omitted.
            cypher: |-
              MATCH (e:Endpoint)-[:RESOLVES_TO]->(entry:ComputeInstance)-[:HAS_VULNERABILITY]->(v:CVE)
              WHERE v.knownExploited = true
                AND v.cvssScore >= $minCvss
              MATCH (host:ComputeInstance)-[:RUNS]->(exposed:Application {tier: $crownJewelTier})
              MATCH path = shortestPath((entry)-[:CAN_REACH*0..8]->(host))
              WHERE length(path) <= $maxLateralHops
              WITH exposed, entry, min(length(path)) AS hops
              WITH exposed,
                   count(DISTINCT entry) AS reachableFromFootholds,
                   min(hops) AS fewestLateralHops,
                   collect(DISTINCT entry.hostname) AS footholdHosts
              WITH collect({
                     app:       exposed,
                     footholds: reachableFromFootholds,
                     hops:      fewestLateralHops,
                     hosts:     footholdHosts
                   }) AS exposure
              MATCH (target:Application {tier: $crownJewelTier})
              WITH target, [entry IN exposure WHERE entry.app = target][0] AS hit
              RETURN target.applicationId AS applicationId,
                     target.name          AS crownJewel,
                     target.businessUnit  AS businessUnit,
                     coalesce(hit.footholds, 0) AS reachableFromFootholds,
                     hit.hops             AS fewestLateralHops,
                     coalesce(hit.hosts, []) AS footholdHosts
              ORDER BY reachableFromFootholds DESC, fewestLateralHops ASC, crownJewel
            parameters:
              - name: minCvss
                type: FLOAT
                description: Minimum CVSS v3.1 base score for a foothold to count. Start at 9.0, as in the foothold query.
                example: 9.4
              - name: crownJewelTier
                type: STRING
                description: Criticality tier to summarise. Start at 'P0'.
                example: P0
              - name: maxLateralHops
                type: INTEGER
                description: Maximum CAN_REACH hops from foothold to crown-jewel host. Start at 4. The pattern's literal ceiling is 8.
                example: 4
            category: query
            teaches: 'The reporting view over the path queries, and the honest counterpart to them: it shows the crown jewels no route reaches as well as the ones it does, which a path query cannot do because unreached targets simply produce no rows. A zero is a statement about this threshold and this bound, not a clean bill of health — re-run with a lower minCvss or a higher maxLateralHops before describing anything as isolated, and remember that a crown jewel unreachable across the network may still be exposed through an IAM grant, which the blast-radius query is what tests. Use the hop count as a rough ranking only; one hop from a trivially exploitable foothold is worse than three from a hard one, and this summary does not weigh that.'
            returns: 'One row per crown-jewel application, most exposed first: application identifier, name, owning business unit, the count of distinct footholds reaching it, the fewest lateral hops required, and the foothold hostnames. Unreached crown jewels return a count of zero, a null hop count and an empty list.'
            prerequisites: None beyond the imported reference ontology. The Application.tier index in SETUP.md improves the anchor lookup.
            tags:
              - reporting
              - crown-jewel
              - coverage
              - exposure
              - prioritisation
            upstream:
              file: QUERIES.md
              heading: Crown-jewel exposure summary
              sample: 'Bundled sample data only: $minCvss = 9.0, $crownJewelTier = ''P0'', $maxLateralHops = 4 returns 3 rows: Card Tokenization Service reached by 3 footholds at 1 hop, Payment Ledger by 3 at 2 hops, and HR Records by 0, with a null hop count and an empty host list.'
    description: 'A deployed business application, owned by a business unit and ranked by criticality. The business end of an attack path: what makes a route worth caring about is the tier of the application it terminates at, not the number of hops it took.'
  Identity:
    label: Identity
    properties:
      identityId:
        type: STRING
        key: true
        description: Unique identifier for the IAM principal, expected to be the identity provider's own principal or role identifier. e.g. `ID-001`.
        pattern: ^ID-[0-9]{3}$
      name:
        type: STRING
        must_exist: true
        description: Principal name of the identity as it appears in the identity provider. e.g. `svc-edge-proxy`.
      identityType:
        type: STRING
        description: Kind of principal, as a lowercase identifier. Expected to be one of `service` (a workload credential bound to a host), `role` (an assumable set of permissions) or `human` (an interactive user account). e.g. `service`.
    extensions:
      display:
        x: -70
        'y': 0
        colour: '#7c3aed'
      custom:
        relate-examples:
          ask: a service account or IAM role a host runs as, such as svc-reporting or role-data-reader
        tools:
          - type: canonicalQuery
            name: blast-radius-of-a-compromised-identity
            question: Blast radius of a compromised identity
            description: Returns every cloud service and business application one identity can act on through the policies it holds, with the highest permission level any of those policies grants and the policies responsible.
            cypher: |-
              MATCH (identity:Identity {identityId: $identityId})-[:ASSUMES]->(policy:IAMPolicy)
              MATCH (policy)-[:HAS_ACCESS_TO]->(resource)
              WHERE resource:CloudService OR resource:Application
              WITH identity, resource,
                   collect(DISTINCT policy.name) AS grantedByPolicies,
                   min(CASE policy.permissionLevel
                         WHEN 'admin' THEN 0
                         WHEN 'write' THEN 1
                         ELSE 2 END) AS highestGrantRank,
                   CASE resource.dataClassification
                     WHEN 'restricted'   THEN 0
                     WHEN 'confidential' THEN 1
                     WHEN 'internal'     THEN 2
                     WHEN 'public'       THEN 3
                     ELSE 9 END AS sensitivityRank
              RETURN identity.name               AS identityName,
                     head(labels(resource))      AS resourceKind,
                     resource.name               AS resourceName,
                     resource.dataClassification AS dataClassification,
                     resource.tier               AS applicationTier,
                     CASE highestGrantRank
                       WHEN 0 THEN 'admin'
                       WHEN 1 THEN 'write'
                       ELSE 'read' END           AS highestGrant,
                     grantedByPolicies
              ORDER BY sensitivityRank ASC, highestGrantRank ASC, resourceName
            parameters:
              - name: identityId
                type: STRING
                description: 'The identity to treat as compromised. No default applies: this is a selector, taken from the reachability query''s inheritable-identities column or from the identity provider.'
                example: ID-006
            category: query
            teaches: 'This is the query that reframes a host compromise as a data exposure. Nothing here depends on network reachability: an identity reaches everything its policies allow, wherever the resources sit, so a tightly segmented estate can still have a wide blast radius. permissionLevel states the highest action a policy permits on any resource it covers, so an ''admin'' row means the policy allows at least one administrative action somewhere in its scope, not that every action on this resource is administrative — read it as an upper bound and confirm against the policy document before reporting it. Comparing two identities'' results is usually more informative than either alone, since it shows which credential is the over-privileged one.'
            returns: 'One row per reachable resource, most sensitive first: the identity name, whether the resource is a cloud service or an application, its name, its data classification or criticality tier as applicable, the highest permission level granted, and the policies granting it.'
            prerequisites: None beyond the imported reference ontology.
            tags:
              - blast-radius
              - identity
              - iam
              - exfiltration
              - least-privilege
            upstream:
              file: QUERIES.md
              heading: Blast radius of a compromised identity
              sample: 'Bundled sample data only: $identityId = ''ID-006'' (role-ci-deployer) returns 12 rows: 6 cloud services led by customer-pii-db (restricted, admin), then 6 applications.'
    description: 'An IAM principal whose permissions an attacker inherits on compromising something: the workload identity a compute instance''s processes run as, or a role that can be assumed. The pivot from network compromise to data access — permissions reached through an identity need no further lateral movement.'
  IAMPolicy:
    label: IAMPolicy
    properties:
      policyId:
        type: STRING
        key: true
        description: Unique identifier for the permission grant in the identity provider. e.g. `POL-001`.
      name:
        type: STRING
        must_exist: true
        description: Policy name as it appears in the identity provider. e.g. `edge-logs-write`.
      permissionLevel:
        type: STRING
        description: Coarse level of access the policy grants, as a lowercase identifier. Expected to be one of `read`, `write`, `admin`. States the highest action the policy permits on any resource it grants access to, not the typical or intended one — a policy allowing one administrative action is `admin`. e.g. `write`.
    extensions:
      display:
        x: 60
        'y': 0
        colour: '#059669'
      custom:
        relate-examples:
          ask: an IAM permission policy held by a role, such as audit-logs-read, billing-admin or s3-write-all
    description: A named permission grant that an identity holds, standing between the identity and the resources it can act on. Modelled as its own node rather than collapsed into the identity because one policy is typically attached to many identities, which makes an over-permissive policy a single point that many attack paths pass through.
  CloudService:
    label: CloudService
    properties:
      serviceId:
        type: STRING
        key: true
        description: Unique identifier for the cloud resource, expected to be its provider resource identifier. e.g. `CS-004`.
      name:
        type: STRING
        must_exist: true
        description: Resource name of the cloud service as it appears in the provider console. e.g. `payment-card-vault`.
      serviceType:
        type: STRING
        description: Kind of cloud resource, as a lowercase hyphenated identifier. Expected to be one of `object-store`, `relational-database`, `secret-store`, `message-queue`. e.g. `secret-store`.
      dataClassification:
        type: STRING
        must_exist: true
        description: Sensitivity of the data the resource holds, as a lowercase identifier. Expected to be one of `public`, `internal`, `confidential`, `restricted`, in ascending order of sensitivity, so `restricted` is the most sensitive. Assigned by data governance, not derived from the graph. e.g. `restricted`.
    extensions:
      display:
        x: 190
        'y': 0
        colour: '#db2777'
      custom:
        relate-examples:
          ask: a cloud storage bucket, managed database, secret vault or message queue, named in lower case, such as invoice-archive or ledger-db
        tools:
          - type: canonicalQuery
            name: full-kill-chain-from-the-internet-to-sensitive-cloud-data
            question: Full kill chain from the internet to sensitive cloud data
            description: 'Joins the network and identity halves of the reference ontology into one route: from a public endpoint, to an exposed host carrying an exploited vulnerability, across CAN_REACH to a pivot host, to the workload identity that host runs as, through that identity''s policies, to a cloud service in one of the given data classifications.'
            cypher: |-
              MATCH (e:Endpoint)-[:RESOLVES_TO]->(entry:ComputeInstance)-[:HAS_VULNERABILITY]->(v:CVE)
              WHERE v.knownExploited = true
                AND v.cvssScore >= $minCvss
              MATCH path = shortestPath((entry)-[:CAN_REACH*0..8]->(pivot:ComputeInstance))
              WHERE length(path) <= $maxLateralHops
              MATCH (pivot)-[:RUNS_AS]->(identity:Identity)-[:ASSUMES]->(policy:IAMPolicy)
              MATCH (policy)-[:HAS_ACCESS_TO]->(svc:CloudService)
              WHERE svc.dataClassification IN $classifications
              RETURN e.dnsName        AS exposedVia,
                     entry.hostname   AS entryHost,
                     v.cveId          AS entryCve,
                     length(path)     AS lateralHops,
                     [n IN nodes(path) | n.hostname] AS lateralRoute,
                     pivot.hostname   AS pivotHost,
                     identity.name    AS inheritedIdentity,
                     policy.name      AS viaPolicy,
                     policy.permissionLevel AS permissionLevel,
                     svc.name         AS targetResource,
                     svc.serviceType  AS resourceType,
                     svc.dataClassification AS dataClassification
              ORDER BY lateralHops ASC, entryHost, targetResource
            parameters:
              - name: minCvss
                type: FLOAT
                description: Minimum CVSS v3.1 base score for the entry vulnerability. Start at 9.0, as in the foothold query.
                example: 9.4
              - name: maxLateralHops
                type: INTEGER
                description: Maximum CAN_REACH hops between the entry host and the pivot host. Start at 4 and raise one hop at a time. The pattern's literal ceiling is 8.
                example: 4
              - name: classifications
                type: STRING
                description: List of data classifications that count as sensitive. Start at ['restricted'], the most sensitive band in this reference ontology's encoding, which keeps the result to chains ending somewhere reportable. Widen to ['restricted','confidential'] when the question is what an attacker could see at all rather than what would trigger a disclosure obligation.
                example:
                  - restricted
            category: query
            teaches: 'The most complete statement the reference ontology can make, and the one to lead with when explaining why connected data is worth the trouble: no single inventory holds all four of exposure, vulnerability, network permission and IAM grant, so this chain is invisible to each of them separately. A zero-hop result is the worst case — the exposed host itself runs as an identity that reaches sensitive data, with no lateral movement required. Expect several rows per entry host where more than one pivot or policy reaches the same resource; aggregate on the target resource when the question is what is exposed rather than how many ways. Breaking any single link breaks the chain, which is what makes the route more actionable than its endpoints: the cheapest fix is often the policy, not the patch.'
            returns: 'One row per complete chain: the public name and entry host, the entry CVE, the hop count and route to the pivot host, the identity inherited there, the policy granting access, its permission level, and the target resource with its type and classification.'
            prerequisites: None beyond the imported reference ontology.
            tags:
              - kill-chain
              - exfiltration
              - identity
              - cloud
              - end-to-end
            upstream:
              file: QUERIES.md
              heading: Full kill chain from the internet to sensitive cloud data
              sample: 'Bundled sample data only: $minCvss = 9.0, $maxLateralHops = 4, $classifications = [''restricted''] returns 44 rows from 3 entry hosts to payment-card-vault, customer-pii-db and db-backups, 6 of them zero-hop from build-runner-01 as role-ci-deployer. hr-records-db never appears.'
    description: A managed cloud resource holding or moving data — an object store, database, secret store or message queue — reachable through IAM permissions rather than through the network path. The exfiltration end of an attack path, and the reason an identity's blast radius matters independently of what the network topology allows.
relationships:
  resolvesTo:
    type: RESOLVES_TO
    from:
      node: Endpoint
      min_count: 1
    to:
      node: ComputeInstance
    extensions:
      custom:
        relate-examples:
          phrase: resolves to
    description: Resolves an internet-facing entry point to the compute instance that serves it, making that instance directly reachable from outside the estate. Each endpoint resolves to at least one instance, and to several where traffic is load balanced; an instance may serve many endpoints, or none at all if it is purely internal.
  hasVulnerability:
    type: HAS_VULNERABILITY
    from:
      node: ComputeInstance
    to:
      node: CVE
    properties:
      detectedOn:
        type: ZONED DATETIME
        must_exist: true
        description: Date on which a scan last confirmed the vulnerability still present on this instance. Last confirmation rather than first detection, so a recent date means the finding is current and an old one means the instance has not been rescanned. Distinct from the CVE's own publication date. Carried as an ISO 8601 zoned datetime because local CSV imports do not support a bare date; the time is always midnight UTC and carries no meaning beyond the calendar date. e.g. `2026-08-14T00:00:00Z`.
    extensions:
      custom:
        relate-examples:
          phrase: is vulnerable to
    description: Records that a vulnerability scan confirmed the named CVE present on this compute instance. Presence only — it asserts nothing about whether the flaw is reachable or exploitable in context, which is what the surrounding path establishes. An instance may carry many CVE records, or none; one CVE may affect many instances.
  canReach:
    type: CAN_REACH
    from:
      node: ComputeInstance
    to:
      node: ComputeInstance
    properties:
      port:
        type: INTEGER
        must_exist: true
        description: 'TCP port on the target instance that the source is permitted to connect to. One port per relationship, not a range: a rule opening several ports between the same pair is several rows. e.g. `443`.'
      protocol:
        type: STRING
        description: Application-layer protocol permitted on that port, as a lowercase identifier drawn from the same set as an endpoint's protocol. Expected to be one of `https`, `http`, `ssh`, `smtp`, `postgres`, `mysql`. e.g. `https`.
    extensions:
      custom:
        relate-examples:
          phrase: can reach
    description: 'States that the source compute instance is permitted to open a network connection to the target instance on the stated port, as allowed by firewall rules, security groups and routing. Directed and asymmetric: a DMZ host reaching an application server does not imply the reverse, and mutual reachability is two separate rows. It is a claim about network permission only — not that an attacker holds credentials, nor that a working exploit exists on the target. An instance may reach many instances, or none; an instance may be reachable from many, or none.'
  runs:
    type: RUNS
    from:
      node: ComputeInstance
    to:
      node: Application
    extensions:
      custom:
        relate-examples:
          phrase: hosts
    description: Places a business application on the compute instance that hosts it, so that compromise of the host is compromise of the application. An instance may run many applications, or none if it is infrastructure; an application may run on many instances where it is horizontally scaled, or on none if it is not yet deployed.
  runsAs:
    type: RUNS_AS
    from:
      node: ComputeInstance
      max_count: 1
    to:
      node: Identity
    extensions:
      custom:
        relate-examples:
          phrase: runs as
    description: Names the workload identity the instance's processes execute as, and therefore the permissions an attacker inherits the moment they run code on the host. Each instance runs as at most one workload identity; an identity may be shared by many instances, or be held by none if it is only ever assumed interactively.
  assumes:
    type: ASSUMES
    from:
      node: Identity
    to:
      node: IAMPolicy
    extensions:
      custom:
        relate-examples:
          phrase: holds
    description: Attaches a permission grant to the identity that holds it, so that everything the policy allows is available to whoever controls the identity. An identity may hold many policies, or none; a policy may be attached to many identities, which is what makes a single over-permissive policy a shared choke point.
  policyAccessesService:
    type: HAS_ACCESS_TO
    from:
      node: IAMPolicy
    to:
      node: CloudService
    extensions:
      custom:
        relate-examples:
          phrase: grants access to
    description: 'Grants the policy access to a cloud resource, at the level the policy''s permissionLevel states. This is the data-exfiltration hop: it needs no network path, so any identity holding the policy reaches the resource regardless of where it sits in the network. One policy may grant access to many resources, or to none if it only grants application access; one resource may be granted by many policies.'
  policyAccessesApplication:
    type: HAS_ACCESS_TO
    from:
      node: IAMPolicy
    to:
      node: Application
    extensions:
      custom:
        relate-examples:
          phrase: grants access to
    description: 'Grants the policy administrative or operational access to a business application through its control plane, at the level the policy''s permissionLevel states. Distinct from the grant to a cloud resource: this reaches an application without compromising the host that runs it, so a crown-jewel application can be exposed by a policy alone with no lateral movement involved. One policy may grant access to many applications, or to none; one application may be granted by many policies, or by none.'
