schema: https://neo4j.com/docs/ontology-graph-spec/1.1.0/schema.json
version: '1'
id: loans-and-mortgages
name: Loans and Mortgages
description: 'A pragmatic reading of the FIBO Loans (LOAN) domain for consumer lending in the US: applicants and their applications, the products applied for, funded loans with their lenders, servicers, originating officers and payment histories, and the residential properties and appraisals that secure mortgages and home equity lending. Answers portfolio, delinquency and origination-quality questions, combined loan-to-value across stacked liens, rapid re-appraisal of collateral, and how far one borrower''s default reaches through the loans they co-borrow or guarantee. Adapted from FIBO (Financial Industry Business Ontology), LOAN domain, https://github.com/edmcouncil/fibo, Copyright (c) 2015-2026 EDM Council, Inc. and Copyright (c) 2015-2025 Object Management Group, Inc., used under the MIT License (https://opensource.org/licenses/MIT). A simplification for demonstration, not FIBO itself, and not endorsed by the EDM Council.'
nodes:
  Person:
    label: Person
    properties:
      personId:
        type: STRING
        key: true
        description: Unique identifier for the person across the portfolio. Identity is expected to be resolved before import, so one real person is one node. e.g. `P-0002`.
      name:
        type: STRING
        description: The person's full name as recorded on their applications. e.g. `Patricia Hughes`.
    extensions:
      display:
        x: -90
        'y': 30
        colour: '#2563eb'
      custom:
        relate-examples:
          ask: a customer who borrows on, applies for or guarantees a loan, named by full name, such as Brandon Wagner or Michael Lee; not a loan officer or other staff of a lender
          proper: true
        tools:
          - type: canonicalQuery
            name: person-s-lending-network
            question: Person's lending network
            description: 'Draws one person''s position across the portfolio: their applications, the loans they borrow on or guarantee, the property and servicer behind each of those loans, and the other people on the same loans.'
            cypher: |-
              MATCH path = (:Person {personId: $personId})-[:APPLIED_FOR|BORROWER_ON|GUARANTEES]->()
              RETURN path
              UNION
              MATCH path = (:Person {personId: $personId})-[:BORROWER_ON|GUARANTEES]->(:Loan)-[:SECURED_BY|SERVICED_BY]->()
              RETURN path
              UNION
              MATCH path = (p:Person {personId: $personId})-[:BORROWER_ON|GUARANTEES]->(:Loan)<-[:BORROWER_ON|GUARANTEES]-(other:Person)
              WHERE other <> p
              RETURN path
            parameters:
              - name: personId
                type: STRING
                description: Person.personId of the person to draw.
                example: P-0739
            category: picture
            teaches: 'Visual, not tabular. The third part is what turns a single customer view into a connected-party view: a co-borrower or guarantor reached here is exposed to the same loan. A person on many loans draws a busy picture; read Total exposure per person first to see how many open loans they touch.'
            returns: 'Paths for Browser or Bloom to draw, one per row: Person → LoanApplication or Loan; Person → Loan → Property or FinancialInstitution; and Person → Loan ← Person for each other borrower or guarantor. UNION removes duplicates.'
            prerequisites: None beyond the imported reference ontology.
            tags:
              - visualisation
              - person
              - borrower
              - guarantor
              - network
            upstream:
              file: QUERIES.md
              heading: Person's lending network
              sample: 'Bundled sample data only: $personId = ''P-0739'' (Michael Lee) returns 11 paths — 2 applications, 3 loans (primary borrower on L-00736, co-borrower on L-00737, guarantor of L-00738), 4 property or servicer paths, and 2 other people: Michael Cox and Nathan Jensen.'
          - type: canonicalQuery
            name: total-exposure-per-person
            question: Total exposure per person
            description: 'Ranks people by everything they are liable for across the portfolio: the currentBalance of every open loan they borrow on (as primary borrower or co-borrower) plus every open loan they guarantee.'
            cypher: |-
              MATCH (p:Person)-[r:BORROWER_ON|GUARANTEES]->(l:Loan)
              WHERE l.status <> 'paid in full'
              WITH p, count(DISTINCT l) AS openLoans,
                   sum(CASE WHEN type(r) = 'BORROWER_ON' THEN l.currentBalance ELSE 0 END) AS borrowedBalance,
                   sum(CASE WHEN type(r) = 'GUARANTEES' THEN l.currentBalance ELSE 0 END) AS guaranteedBalance
              RETURN p.personId AS personId, p.name AS name, openLoans,
                     round(borrowedBalance, 2) AS borrowedBalance, round(guaranteedBalance, 2) AS guaranteedBalance,
                     round(borrowedBalance + guaranteedBalance, 2) AS totalExposure
              ORDER BY totalExposure DESC
              LIMIT $limit
            parameters:
              - name: limit
                type: INTEGER
                description: Number of people to return. Integer. Start at 20, a list a reviewer can read in one pass.
                example: 10
            category: query
            teaches: 'Co-borrowers are jointly and severally liable, so each is charged the full balance, and a guarantee is taken to cover the full balance; summing totalExposure across people therefore double counts shared loans by design. Single-loan borrowers of a large mortgage rank high too: read openLoans and guaranteedBalance to find the people whose exposure only appears once loans are connected.'
            returns: 'Up to limit rows: personId, name, openLoans, borrowedBalance, guaranteedBalance and totalExposure (US dollars), ordered by totalExposure descending.'
            prerequisites: None beyond the imported reference ontology.
            tags:
              - exposure
              - connected-party
              - borrower
              - guarantor
            upstream:
              file: QUERIES.md
              heading: Total exposure per person
              sample: 'Bundled sample data only: $limit = 10 returns 10 rows, led by Jeremy Howard (P-0754): 6 open loans, borrowed 1360920.79, guaranteed 80853.44, total 1441774.23.'
          - type: canonicalQuery
            name: node-key-constraints
            question: Node-key constraints
            cypher: |-
              CREATE CONSTRAINT person_personId_key IF NOT EXISTS FOR (n:Person) REQUIRE n.personId IS NODE KEY;
              CREATE CONSTRAINT loanApplication_applicationId_key IF NOT EXISTS FOR (n:LoanApplication) REQUIRE n.applicationId IS NODE KEY;
              CREATE CONSTRAINT loanProduct_productId_key IF NOT EXISTS FOR (n:LoanProduct) REQUIRE n.productId IS NODE KEY;
              CREATE CONSTRAINT loan_loanId_key IF NOT EXISTS FOR (n:Loan) REQUIRE n.loanId IS NODE KEY;
              CREATE CONSTRAINT property_propertyId_key IF NOT EXISTS FOR (n:Property) REQUIRE n.propertyId IS NODE KEY;
              CREATE CONSTRAINT appraisal_appraisalId_key IF NOT EXISTS FOR (n:Appraisal) REQUIRE n.appraisalId IS NODE KEY;
              CREATE CONSTRAINT payment_paymentId_key IF NOT EXISTS FOR (n:Payment) REQUIRE n.paymentId IS NODE KEY;
              CREATE CONSTRAINT financialInstitution_institutionId_key IF NOT EXISTS FOR (n:FinancialInstitution) REQUIRE n.institutionId IS NODE KEY;
              CREATE CONSTRAINT loanOfficer_officerId_key IF NOT EXISTS FOR (n:LoanOfficer) REQUIRE n.officerId IS NODE KEY;
            parameters: []
            category: setup
            requires:
              - write
            upstream:
              file: QUERIES.md
              heading: Node-key constraints
              sample: ''
    description: A natural person who applies for, borrows on, or guarantees loans. Borrower, co-borrower, applicant and guarantor are roles a person plays, carried by relationships rather than by separate labels, so one person's whole position across the portfolio is a single node.
    aliases:
      - Individual
      - Party
      - Customer
  LoanApplication:
    label: LoanApplication
    properties:
      applicationId:
        type: STRING
        key: true
        description: Unique identifier for the application. e.g. `A-00002`.
        pattern: ^A-[0-9]{5}$
      applicationDate:
        type: ZONED DATETIME
        must_exist: true
        description: Calendar date the application was signed and submitted, as an ISO 8601 zoned datetime at midnight UTC; only the calendar date carries meaning. e.g. `2024-10-04T00:00:00Z`.
      requestedAmount:
        type: FLOAT
        description: Amount the applicants asked to borrow, in US dollars. For an originated loan the principal may differ slightly from the request. e.g. `311800.00`.
      loanPurpose:
        type: STRING
        description: What the borrowed funds are for, using FIBO's mortgage loan purposes plus `personal expenditure` for consumer loans that are not secured on real property. e.g. `loan refinancing`.
        one_of:
          - real property purchase
          - loan refinancing
          - home improvement
          - dwelling construction
          - business or commercial
          - mortgage modification
          - personal expenditure
      occupancy:
        type: STRING
        description: How the applicants intend to use the property securing the loan (FIBO property usage). Empty for applications with no property, such as unsecured personal loans. e.g. `primary residence`.
        one_of:
          - primary residence
          - second home
          - investment
      creditScore:
        type: INTEGER
        extensions:
          custom:
            relate-examples:
              extract: true
              ask: the applicant's credit score when the application was made, a number on the 300 to 850 scale such as 663
        description: FICO-style credit score of the primary applicant at the time of application, on the 300-850 scale; higher is lower risk. A point-in-time value, not a current score. e.g. `742`.
      monthlyIncome:
        type: FLOAT
        description: Gross monthly qualifying income of all applicants combined, in US dollars, as relied on for the credit decision (FIBO all borrowers' monthly income). e.g. `7910.00`.
      dtiRatio:
        type: FLOAT
        description: 'Debt-to-income (DTI) ratio at application: all applicants'' monthly debt payments, including the proposed loan, as a percentage of their gross monthly income. A percentage, so 36.5 means 36.5%. e.g. `36.50`.'
        aliases:
          - Debt-to-income ratio
          - DTI
          - Total debt expense ratio
        reference: https://spec.edmcouncil.org/fibo/ontology/LOAN/LoansGeneral/LoanApplications/TotalDebtExpenseRatio
      disposition:
        type: STRING
        must_exist: true
        description: The action taken on the application, using the HMDA disposition categories (also called action taken). Only `loan originated` leads to a loan. e.g. `loan originated`.
        aliases:
          - Action taken
        reference: https://spec.edmcouncil.org/fibo/ontology/LOAN/RealEstateLoans/HomeMortgageDisclosureActCoveredMortgages/HMDA-Disposition
        one_of:
          - loan originated
          - application approved but not accepted
          - application denied
          - application withdrawn
          - file closed for incompleteness
          - loan purchased by your institution
          - preapproval request denied
          - preapproval request approved but not accepted
      dispositionDate:
        type: ZONED DATETIME
        description: Calendar date the disposition was made, as an ISO 8601 zoned datetime at midnight UTC; only the calendar date carries meaning. For an originated loan it is the origination (closing) date. e.g. `2024-12-05T00:00:00Z`.
      denialReason:
        type: STRING
        description: Primary reason for a denial, using FIBO's denial reasons plus HMDA's `debt-to-income ratio` and `other`. One reason per application; empty unless the disposition is a denial. e.g. `debt-to-income ratio`.
        one_of:
          - debt-to-income ratio
          - insufficient credit history
          - insufficient income
          - insufficient cash
          - insufficient employment history
          - insufficient collateral value
          - unverifiable information
          - credit application incomplete
          - mortgage insurance denied
          - other
    extensions:
      display:
        x: -90
        'y': -75
        colour: '#d97706'
      custom:
        relate-examples:
          ask: an application to borrow, written as the word application and its number, such as application A-00716; the request and its decision, not the loan it became
          proper: true
        tools:
          - type: canonicalQuery
            name: application-outcomes-by-product
            question: Application outcomes by product
            description: 'Counts applications by product and HMDA disposition: how many became loans, were denied, were withdrawn, or ended another way, and the pull-through rate.'
            cypher: |-
              MATCH (a:LoanApplication)-[:FOR_PRODUCT]->(prod:LoanProduct)
              WITH prod, count(a) AS applications,
                   sum(CASE WHEN a.disposition = 'loan originated' THEN 1 ELSE 0 END) AS originated,
                   sum(CASE WHEN a.disposition IN ['application denied', 'preapproval request denied'] THEN 1 ELSE 0 END) AS denied,
                   sum(CASE WHEN a.disposition = 'application withdrawn' THEN 1 ELSE 0 END) AS withdrawn
              RETURN prod.name AS product, applications, originated, denied, withdrawn,
                     applications - originated - denied - withdrawn AS otherOutcomes,
                     round(100.0 * originated / applications, 1) AS pullThroughPct
              ORDER BY applications DESC
            parameters: []
            category: query
            teaches: 'Covers every application ever recorded; add a filter on applicationDate to compare periods. Pull-through is operational, not a credit-quality measure: withdrawals and incomplete files lower it as much as denials do.'
            returns: 'One row per product: product, applications, originated (disposition loan originated), denied (application denied or preapproval request denied), withdrawn, otherOutcomes (approved but not accepted, file closed for incompleteness, and the rest) and pullThroughPct (originated as a percentage of applications), ordered by applications descending.'
            prerequisites: None beyond the imported reference ontology.
            tags:
              - application
              - disposition
              - pipeline
              - product
            upstream:
              file: QUERIES.md
              heading: Application outcomes by product
              sample: 'Bundled sample data only: returns 7 rows, led by 30-year fixed-rate mortgage (421 applications, 330 originated, 54 denied, 78.4% pull-through).'
          - type: canonicalQuery
            name: denial-reasons-and-applicant-profile
            question: Denial reasons and applicant profile
            description: 'Ranks the primary denial reasons on denied applications and profiles the applicants behind each: average credit score at application, average debt-to-income ratio, and the products involved.'
            cypher: |-
              MATCH (a:LoanApplication)-[:FOR_PRODUCT]->(prod:LoanProduct)
              WHERE a.disposition IN ['application denied', 'preapproval request denied']
              WITH coalesce(a.denialReason, 'not recorded') AS denialReason, a, prod
              RETURN denialReason, count(a) AS denials,
                     round(avg(a.creditScore)) AS avgCreditScore, round(avg(a.dtiRatio), 1) AS avgDtiRatio,
                     collect(DISTINCT prod.name) AS products
              ORDER BY denials DESC
            parameters: []
            category: query
            teaches: 'Denied means disposition application denied or preapproval request denied. Only the primary reason is held, so a denial with several reasons counts once, under the first. Read the averages as a check that each reason is applied consistently (a debt-to-income denial should carry a high dtiRatio). This is an operational view only: fair-lending analysis needs demographic data and controls this reference ontology does not hold.'
            returns: 'One row per denialReason (''not recorded'' where a denial has none): denials, avgCreditScore, avgDtiRatio (percent) and products, ordered by denials descending.'
            prerequisites: None beyond the imported reference ontology.
            tags:
              - application
              - denial
              - underwriting
            upstream:
              file: QUERIES.md
              heading: Denial reasons and applicant profile
              sample: 'Bundled sample data only: returns 9 rows, led by debt-to-income ratio (66 denials, average dtiRatio 51.1) and insufficient credit history (41).'
    description: A request by one or more applicants to a lender to borrow money, carrying the information used to decide it and the outcome. Every originated loan comes from exactly one application; applications that are denied, withdrawn or closed lead to no loan.
    aliases:
      - Credit application
      - Mortgage application
    reference: https://spec.edmcouncil.org/fibo/ontology/LOAN/LoansGeneral/LoanApplications/LoanApplication
  LoanProduct:
    label: LoanProduct
    properties:
      productId:
        type: STRING
        key: true
        description: Unique identifier for the product. e.g. `LP-02`.
      name:
        type: STRING
        description: The product's name as marketed. e.g. `15-year fixed-rate mortgage`.
      marketCategory:
        type: STRING
        description: Market in which the product is offered, using FIBO's loan market categories. Home equity products secured on a home are `mortgage loan`. e.g. `mortgage loan`.
        one_of:
          - auto loan
          - commercial loan
          - construction loan
          - education loan
          - mortgage loan
          - personal loan
          - small business loan
      creditType:
        type: STRING
        description: Whether the principal is fixed once the loan closes (`closed-end`) or can be drawn and repaid up to a credit limit (`open-end`, as in a home equity line of credit). e.g. `closed-end`.
        one_of:
          - closed-end
          - open-end
      amortizationType:
        type: STRING
        description: How the interest rate and repayments behave over the term, using FIBO's amortization types. e.g. `fixed rate`.
        one_of:
          - fixed rate
          - adjustable rate
          - graduated payment
          - graduated payment adjustable
          - growing equity
          - rate improvement
          - step
      termMonths:
        type: INTEGER
        description: Contractual term in months from the first scheduled payment to maturity. e.g. `180`.
      isSecured:
        type: BOOLEAN
        description: True when loans under the product are secured by collateral; here that collateral is always real property. e.g. `true`.
    extensions:
      display:
        x: -210
        'y': -75
        colour: '#0891b2'
      custom:
        relate-examples:
          ask: a loan product a lender offers, named by its product name, such as fixed-rate home equity loan, home equity line of credit or 30-year fixed-rate mortgage; the product, not one loan made under it
        tools:
          - type: canonicalQuery
            name: portfolio-by-product
            question: Portfolio by product
            description: 'Summarises open loans by the product they were written under, reached through the application each loan resulted from: count, outstanding balance, average note rate, and the share that is delinquent or in default.'
            cypher: |-
              MATCH (prod:LoanProduct)<-[:FOR_PRODUCT]-(:LoanApplication)-[:RESULTED_IN]->(l:Loan)
              WHERE l.status <> 'paid in full'
              WITH prod, count(l) AS openLoans, sum(l.currentBalance) AS outstandingBalance,
                   avg(l.interestRate) AS avgRate,
                   sum(CASE WHEN l.status IN ['delinquent', 'in default'] THEN 1 ELSE 0 END) AS troubledLoans
              RETURN prod.name AS product, prod.marketCategory AS marketCategory, openLoans,
                     round(outstandingBalance, 2) AS outstandingBalance, round(avgRate, 2) AS avgInterestRate,
                     troubledLoans, round(100.0 * troubledLoans / openLoans, 1) AS troubledPct
              ORDER BY outstandingBalance DESC
            parameters: []
            category: query
            teaches: Open means any status other than paid in full. The average rate is a simple mean, not balance-weighted; weight by currentBalance for a portfolio yield. Products with few open loans give volatile percentages.
            returns: 'One row per product with at least one open loan: product, marketCategory, openLoans, outstandingBalance (sum of currentBalance, US dollars), avgInterestRate (unweighted mean of interestRate, percent), troubledLoans (status delinquent or in default) and troubledPct, ordered by outstandingBalance descending.'
            prerequisites: None beyond the imported reference ontology.
            tags:
              - portfolio
              - product
              - balance
              - delinquency
            upstream:
              file: QUERIES.md
              heading: Portfolio by product
              sample: 'Bundled sample data only: returns 7 rows, led by 30-year fixed-rate mortgage (250 open loans, 12 troubled); Fixed-rate home equity loan has the highest troubledPct (25.0).'
    description: 'A loan product a lender offers, with fixed characteristics and terms that every loan written under it shares: market, open- or closed-end credit, amortization, term and whether it is secured.'
    aliases:
      - Credit product
      - Loan program
    reference: https://spec.edmcouncil.org/fibo/ontology/LOAN/LoansSpecific/LoanProducts/LoanProduct
  Loan:
    label: Loan
    properties:
      loanId:
        type: STRING
        key: true
        description: Unique identifier for the loan. e.g. `L-00002`.
        pattern: ^L-[0-9]{5}$
      principalAmount:
        type: FLOAT
        must_exist: true
        extensions:
          custom:
            relate-examples:
              extract: true
              parse: MONEY
              ask: the original principal advanced when the loan closed, a sum such as $132,400, not a balance, an installment or a property value
        description: Original principal advanced at origination, in US dollars. For an open-end line, the amount drawn at origination. e.g. `311800.00`.
      interestRate:
        type: FLOAT
        description: Annual note interest rate at origination, as a percentage, so 6.25 means 6.25% a year. For adjustable-rate products, the initial rate. e.g. `6.750`.
      originationDate:
        type: ZONED DATETIME
        must_exist: true
        description: Calendar date the loan closed and funds were advanced, as an ISO 8601 zoned datetime at midnight UTC; only the calendar date carries meaning. The first payment is due on the first day of the second month after it. e.g. `2024-12-05T00:00:00Z`.
      maturityDate:
        type: ZONED DATETIME
        description: Calendar date the final scheduled payment is due, as an ISO 8601 zoned datetime at midnight UTC; only the calendar date carries meaning. e.g. `2055-01-01T00:00:00Z`.
      lienPosition:
        type: STRING
        description: 'The lender''s claim on the securing property relative to other liens, using FIBO''s lender lien positions: first claim (`primary lien position`) or behind another lien (`subordinate lien position`). Empty for unsecured loans. e.g. `primary lien position`.'
        reference: https://spec.edmcouncil.org/fibo/ontology/LOAN/LoansGeneral/Loans/LenderLienPosition
        one_of:
          - primary lien position
          - subordinate lien position
      ltvAtOrigination:
        type: FLOAT
        description: 'Loan-to-value (LTV) ratio at origination: this loan''s principal as a percentage of the appraised value relied on at origination, so 80 means 80%. This loan alone, not combined with other liens. Empty for unsecured loans. e.g. `64.02`.'
        aliases:
          - Loan-to-value ratio
          - LTV
        reference: https://spec.edmcouncil.org/fibo/ontology/LOAN/LoansGeneral/Loans/LoanToValueRatio
      currentBalance:
        type: FLOAT
        must_exist: true
        description: Outstanding principal in US dollars as of balanceAsOfDate; zero once paid in full. Unpaid interest and fees are not included. e.g. `306134.09`.
      balanceAsOfDate:
        type: ZONED DATETIME
        description: Calendar date the servicer snapshot (currentBalance and status) was taken, as an ISO 8601 zoned datetime at midnight UTC; only the calendar date carries meaning. e.g. `2026-09-30T00:00:00Z`.
      status:
        type: STRING
        must_exist: true
        extensions:
          custom:
            relate-examples:
              extract: true
              ask: the servicer's status of the loan, one of current, delinquent, in default or paid in full
        description: 'Servicer-reported status as of balanceAsOfDate, from the oldest unpaid scheduled payment: `current` (none, or under 30 days past due), `delinquent` (30-89 days past due), `in default` (90 days or more), or `paid in full`. e.g. `current`.'
        one_of:
          - current
          - delinquent
          - in default
          - paid in full
    extensions:
      display:
        x: 45
        'y': -30
        colour: '#dc2626'
      custom:
        relate-examples:
          ask: a funded loan or mortgage, named only by its loan number, such as L-00712; the credit agreement itself, never a product name and not the application it came from
          proper: true
          propose: true
        tools:
          - type: canonicalQuery
            name: loan-overview
            question: Loan overview
            description: 'Gathers everything the reference ontology holds about one loan into a single row: terms and servicer snapshot, the product and officer from its application, lender and servicer, the securing property, every borrower with their role, guarantors, and a payment-history summary.'
            cypher: |-
              MATCH (l:Loan {loanId: $loanId})
              MATCH (app:LoanApplication)-[:RESULTED_IN]->(l)
              MATCH (app)-[:FOR_PRODUCT]->(prod:LoanProduct)
              MATCH (l)-[:LENT_BY]->(lender:FinancialInstitution)
              MATCH (l)-[:SERVICED_BY]->(servicer:FinancialInstitution)
              OPTIONAL MATCH (app)-[:HANDLED_BY]->(officer:LoanOfficer)
              OPTIONAL MATCH (l)-[:SECURED_BY]->(prop:Property)
              RETURN l.loanId AS loanId, prod.name AS product, l.status AS status,
                     l.principalAmount AS principalAmount, l.currentBalance AS currentBalance,
                     date(l.balanceAsOfDate) AS balanceAsOfDate, l.interestRate AS interestRate,
                     date(l.originationDate) AS originationDate, date(l.maturityDate) AS maturityDate,
                     l.lienPosition AS lienPosition, l.ltvAtOrigination AS ltvAtOrigination,
                     lender.name AS lender, servicer.name AS servicer, officer.name AS loanOfficer,
                     prop.address + ', ' + prop.city + ', ' + prop.state AS property,
                     COLLECT { MATCH (b:Person)-[r:BORROWER_ON]->(l) RETURN b.name + ' (' + r.borrowerRole + ')' } AS borrowers,
                     COLLECT { MATCH (g:Person)-[:GUARANTEES]->(l) RETURN g.name } AS guarantors,
                     COUNT { (l)-[:HAS_PAYMENT]->(:Payment) } AS paymentsRecorded,
                     COUNT { (l)-[:HAS_PAYMENT]->(p:Payment) WHERE p.amountPaid < p.amountDue } AS paymentsMissed
            parameters:
              - name: loanId
                type: STRING
                description: Loan.loanId of the loan to describe.
                example: L-00712
            category: query
            teaches: The starting point for any question about a single loan, and a quick check that an import connected every part of it. ltvAtOrigination is this loan alone; use Stacked liens with high combined LTV for the property-level view.
            returns: 'One row: loan terms and status, product, lender, servicer, loanOfficer, property (null when unsecured), borrowers as "name (borrowerRole)", guarantors, paymentsRecorded and paymentsMissed (installments with amountPaid below amountDue). No row when the loanId does not exist.'
            prerequisites: None beyond the imported reference ontology.
            tags:
              - loan
              - lookup
              - overview
            upstream:
              file: QUERIES.md
              heading: Loan overview
              sample: 'Bundled sample data only: $loanId = ''L-00712'' returns 1 row — a Fixed-rate home equity loan in subordinate lien position, status in default, lent by Lakeshore Mortgage Company, serviced by Meridian Servicing Group, officer Carolyn Jensen, borrower Brandon Wagner (primary borrower), no guarantors, 10 payments recorded, 9 missed.'
          - type: canonicalQuery
            name: loans-with-missed-payments
            question: Loans with missed payments
            description: Lists loans with at least a given number of missed installments in their payment history — a Payment whose amountPaid is below amountDue — with the oldest missed due date, the servicer, and the primary borrower.
            cypher: |-
              MATCH (l:Loan)-[:HAS_PAYMENT]->(p:Payment)
              WHERE p.amountPaid < p.amountDue
              WITH l, count(p) AS missedPayments, date(min(p.dueDate)) AS oldestMissedDue
              WHERE missedPayments >= $minMissed
              MATCH (l)-[:SERVICED_BY]->(servicer:FinancialInstitution)
              OPTIONAL MATCH (b:Person)-[:BORROWER_ON {borrowerRole: 'primary borrower'}]->(l)
              RETURN l.loanId AS loanId, l.status AS status, missedPayments, oldestMissedDue,
                     l.currentBalance AS currentBalance, b.name AS primaryBorrower, servicer.name AS servicer
              ORDER BY missedPayments DESC, oldestMissedDue
            parameters:
              - name: minMissed
                type: INTEGER
                description: 'Minimum missed installments for a loan to be listed. Integer. Start at 2: two unpaid monthly installments is the conventional 30-plus-days delinquency mark, where a single one is often a timing slip.'
                example: 2
            category: query
            teaches: 'Counts missed installments in the recorded history, so a loan whose history starts recently can only show recent misses. Partial payments count as missed. Compare missedPayments with status: a loan with misses but status current, or the reverse, points at a timing difference or a servicing data problem.'
            returns: 'One row per qualifying loan: loanId, status (the servicer''s Loan.status), missedPayments, oldestMissedDue, currentBalance, primaryBorrower and servicer, ordered by missedPayments descending then oldestMissedDue.'
            prerequisites: None beyond the imported reference ontology.
            tags:
              - delinquency
              - payment
              - servicing
            upstream:
              file: QUERIES.md
              heading: Loans with missed payments
              sample: 'Bundled sample data only: $minMissed = 2 returns 44 rows — 31 loans in default and 13 delinquent; $minMissed = 1 adds 3 current loans with a single missed installment.'
          - type: canonicalQuery
            name: delinquency-by-servicer
            question: Delinquency by servicer
            description: Compares servicers by the share of the open loans they service that are delinquent or in default.
            cypher: |-
              MATCH (l:Loan)-[:SERVICED_BY]->(s:FinancialInstitution)
              WHERE l.status <> 'paid in full'
              WITH s, count(l) AS openLoans,
                   sum(CASE WHEN l.status = 'delinquent' THEN 1 ELSE 0 END) AS delinquent,
                   sum(CASE WHEN l.status = 'in default' THEN 1 ELSE 0 END) AS inDefault
              RETURN s.name AS servicer, openLoans, delinquent, inDefault,
                     round(100.0 * (delinquent + inDefault) / openLoans, 1) AS troubledPct
              ORDER BY troubledPct DESC
            parameters: []
            category: query
            teaches: A servicer inherits the credit quality of the lenders whose loans it services, so a high rate is a lead to follow back through SERVICED_BY and LENT_BY to who originated those loans, not a verdict on the servicer.
            returns: 'One row per servicing institution with open loans: servicer, openLoans, delinquent, inDefault and troubledPct ((delinquent + inDefault) as a percentage of openLoans), ordered by troubledPct descending.'
            prerequisites: None beyond the imported reference ontology.
            tags:
              - servicing
              - delinquency
              - portfolio
            upstream:
              file: QUERIES.md
              heading: Delinquency by servicer
              sample: 'Bundled sample data only: returns 4 rows, led by Meridian Servicing Group (169 open loans, 4 delinquent, 16 in default, 11.8%).'
          - type: canonicalQuery
            name: default-contagion-through-borrowers-and-guarantors
            question: Default contagion through borrowers and guarantors
            description: Finds people who borrow on a troubled loan and are also a borrower, co-borrower or guarantor on another loan that is still performing — the loans a default is most likely to spread to.
            cypher: |-
              MATCH (p:Person)-[:BORROWER_ON]->(troubled:Loan)
              WHERE troubled.status IN $statuses
              WITH p, collect(troubled.loanId) AS troubledLoans
              MATCH (p)-[r:BORROWER_ON|GUARANTEES]->(other:Loan)
              WHERE NOT other.status IN $statuses AND other.status <> 'paid in full'
              RETURN p.personId AS personId, p.name AS name, troubledLoans,
                     other.loanId AS exposedLoan,
                     CASE type(r) WHEN 'GUARANTEES' THEN 'guarantor' ELSE r.borrowerRole END AS role,
                     other.status AS exposedStatus, other.currentBalance AS exposedBalance
              ORDER BY personId, exposedLoan
            parameters:
              - name: statuses
                type: STRING
                description: List of Loan.status values that mark a loan as troubled. Start at ['in default']; widen to ['delinquent', 'in default'] for an earlier warning.
                example:
                  - in default
            category: query
            teaches: 'An exposed loan is any loan in neither the given statuses nor paid in full. Includes a borrower''s other loans as well as loans reached through guarantees: a borrower in default on a second lien is a risk to their first mortgage too. Exposure is not loss — the exposed borrower may be paying perfectly well — so treat each row as a loan to review, not a loss estimate.'
            returns: 'One row per person and exposed loan: personId, name, troubledLoans (their loans in the given statuses), exposedLoan, role (primary borrower, co-borrower or guarantor), exposedStatus and exposedBalance, ordered by personId then exposedLoan.'
            prerequisites: None beyond the imported reference ontology.
            tags:
              - contagion
              - connected-party
              - guarantor
              - default
            upstream:
              file: QUERIES.md
              heading: Default contagion through borrowers and guarantors
              sample: 'Bundled sample data only: $statuses = [''in default''] returns 13 rows for 11 people, including Michael Lee (P-0739) on L-00737 (co-borrower) and L-00738 (guarantor); [''delinquent'', ''in default''] returns 15.'
    description: 'A funded loan: the credit agreement and its servicing account folded into one node. It carries the contractual terms set at origination and a servicer snapshot of balance and status as of one date. A loan is a mortgage when it is secured by a property.'
    aliases:
      - Credit agreement
      - Loan account
    reference: https://spec.edmcouncil.org/fibo/ontology/LOAN/LoansGeneral/Loans/Loan
  Property:
    label: Property
    properties:
      propertyId:
        type: STRING
        key: true
        description: Unique identifier for the property. e.g. `PR-0002`.
        pattern: ^PR-[0-9]{4}$
      address:
        type: STRING
        description: Street address of the property. e.g. `4533 Garfield Dr`.
      city:
        type: STRING
        description: City in which the property lies. e.g. `Madison`.
      state:
        type: STRING
        description: US state, as its two-letter USPS code. e.g. `WI`.
        pattern: ^[A-Z]{2}$
      postalCode:
        type: STRING
        description: Five-digit US ZIP code, held as text to keep leading zeros. e.g. `53720`.
        aliases:
          - ZIP code
        pattern: ^[0-9]{5}$
      constructionType:
        type: STRING
        description: How the dwelling was built, using FIBO's HMDA construction types. e.g. `site built`.
        one_of:
          - site built
          - manufactured
          - modular
          - on frame modular
          - mobile home
      dwellingUnits:
        type: INTEGER
        description: Number of separate dwelling units in the property; 1 for a single-family home, 2-4 for small multi-family. e.g. `1`.
    extensions:
      display:
        x: 45
        'y': 90
        colour: '#059669'
      custom:
        relate-examples:
          ask: a house or other residential property pledged as collateral, named by its street address, such as 4594 Lexington Blvd, or by its property number, such as PR-0404; never a city alone
          proper: true
          propose: true
        tools:
          - type: canonicalQuery
            name: stacked-liens-with-high-combined-ltv
            question: Stacked liens with high combined LTV
            description: 'Finds properties securing two or more open loans and computes combined loan-to-value: the summed currentBalance of every open loan secured on the property, as a percentage of its most recent appraisedValue. Returns the properties above a ceiling.'
            cypher: |-
              MATCH (prop:Property)<-[:SECURED_BY]-(l:Loan)
              WHERE l.status <> 'paid in full'
              WITH prop, count(l) AS lienCount, sum(l.currentBalance) AS combinedBalance,
                   collect(l.loanId + ' (' + coalesce(l.lienPosition, 'lien position not recorded') + ')') AS openLiens
              WHERE lienCount >= 2
              MATCH (prop)<-[:VALUES]-(a:Appraisal)
              WITH prop, openLiens, combinedBalance, a
              ORDER BY a.appraisalDate DESC
              WITH prop, openLiens, combinedBalance, head(collect(a)) AS latest
              WITH prop, openLiens, combinedBalance, latest,
                   round(100.0 * combinedBalance / latest.appraisedValue, 2) AS combinedLtv
              WHERE combinedLtv > $maxCltv
              RETURN prop.propertyId AS propertyId,
                     prop.address + ', ' + prop.city + ', ' + prop.state AS property,
                     openLiens, round(combinedBalance, 2) AS combinedBalance,
                     latest.appraisedValue AS latestAppraisedValue,
                     date(latest.appraisalDate) AS latestAppraisalDate, combinedLtv
              ORDER BY combinedLtv DESC
            parameters:
              - name: maxCltv
                type: INTEGER
                description: 'Combined LTV, in percent, above which a property is returned. Float. Start at 90: lenders commonly cap combined LTV for home-equity lending between 80 and 90%, so a property above 90 is outside typical policy.'
                example: 85
            category: query
            teaches: The liens are often held by different lenders, which is why no single lender's view shows the combined figure. The most recent appraisal is used whatever its purpose, so a lower valuation taken for a declined application still counts; read the appraisal date. A high figure against a recent, sharply higher appraisal is a different problem — see Rapid appraisal increases on the same property. Lower maxCltv towards 80 for a wider watch list.
            returns: 'One row per property: propertyId, property address, openLiens (each loanId with its lienPosition), combinedBalance (US dollars), latestAppraisedValue, latestAppraisalDate and combinedLtv (percent), ordered by combinedLtv descending.'
            prerequisites: None beyond the imported reference ontology.
            tags:
              - collateral
              - combined-ltv
              - lien
              - property
            upstream:
              file: QUERIES.md
              heading: Stacked liens with high combined LTV
              sample: 'Bundled sample data only: $maxCltv = 90 returns 8 rows, led by PR-0402 (combinedLtv 105.33) and PR-0403 (102.48); $maxCltv = 85 returns 14.'
          - type: canonicalQuery
            name: rapid-appraisal-increases-on-the-same-property
            question: Rapid appraisal increases on the same property
            description: Finds pairs of appraisals of the same property where the later value exceeds the earlier by at least a given percentage within a given number of months, and lists the loans secured on the property since the later appraisal, with their status and originating officer.
            cypher: |-
              MATCH (prop:Property)<-[:VALUES]-(earlier:Appraisal), (prop)<-[:VALUES]-(later:Appraisal)
              WHERE earlier.appraisalDate < later.appraisalDate
                AND later.appraisalDate <= earlier.appraisalDate + duration({months: $maxMonths})
                AND later.appraisedValue >= earlier.appraisedValue * (1 + $minIncreasePct / 100.0)
              RETURN prop.propertyId AS propertyId,
                     prop.address + ', ' + prop.city + ', ' + prop.state AS property,
                     date(earlier.appraisalDate) AS earlierDate, earlier.appraisedValue AS earlierValue,
                     date(later.appraisalDate) AS laterDate, later.appraisedValue AS laterValue,
                     round(100.0 * (later.appraisedValue / earlier.appraisedValue - 1), 1) AS increasePct,
                     COLLECT {
                       MATCH (prop)<-[:SECURED_BY]-(l:Loan)
                       WHERE l.originationDate >= later.appraisalDate
                       OPTIONAL MATCH (l)<-[:RESULTED_IN]-(:LoanApplication)-[:HANDLED_BY]->(o:LoanOfficer)
                       RETURN l.loanId + ' (' + l.status + ', ' + coalesce(o.name, 'no officer') + ')'
                     } AS loansAfterIncrease
              ORDER BY increasePct DESC
            parameters:
              - name: minIncreasePct
                type: INTEGER
                description: 'Minimum rise in appraisedValue, in percent of the earlier value. Float. Start at 20: residential prices rarely rise 20% in a year outside exceptional local markets.'
                example: 20
              - name: maxMonths
                type: INTEGER
                description: Longest gap, in months, between the two appraisal dates. Integer. Start at 12, so ordinary appreciation over several years is not mistaken for a jump.
                example: 12
            category: query
            teaches: A sharp rise just before new borrowing against the property is a classic sign of an inflated valuation supporting a second lien. Renovation, a stale earlier appraisal or a hot local market are innocent explanations, so compare against the local house-price index before treating a hit as more than a lead. Widen maxMonths to 36 or lower minIncreasePct to 15 to see the slower rises around the cut-off.
            returns: 'One row per qualifying pair: propertyId, property, earlierDate, earlierValue, laterDate, laterValue, increasePct and loansAfterIncrease (each as "loanId (status, officer name)"), ordered by increasePct descending.'
            prerequisites: None beyond the imported reference ontology.
            tags:
              - appraisal
              - collateral
              - valuation
              - fraud-signal
            upstream:
              file: QUERIES.md
              heading: Rapid appraisal increases on the same property
              sample: 'Bundled sample data only: $minIncreasePct = 20, $maxMonths = 12 returns 6 rows, PR-0404 (54.4%) to PR-0408 (32.9%); each lists one loan in default originated by Carolyn Jensen or Adam Schmidt.'
    description: A parcel of residential real property pledged as collateral for one or more loans. Several loans, from different lenders and of different lien positions, can be secured on the same property.
    aliases:
      - Real property
      - Collateral
      - Subject property
  Appraisal:
    label: Appraisal
    properties:
      appraisalId:
        type: STRING
        key: true
        description: Unique identifier for the appraisal. e.g. `AP-00003`.
        pattern: ^AP-[0-9]{5}$
      appraisalDate:
        type: ZONED DATETIME
        must_exist: true
        description: Calendar date the value was established (the effective date of the appraisal), as an ISO 8601 zoned datetime at midnight UTC; only the calendar date carries meaning. e.g. `2017-09-14T00:00:00Z`.
      appraisedValue:
        type: FLOAT
        must_exist: true
        extensions:
          custom:
            relate-examples:
              extract: true
              parse: MONEY
              ask: the sum in dollars the appraisal set as the property's value, such as $420,000, never the property's address
        description: Market value of the whole property on appraisalDate, in US dollars. e.g. `186500.00`.
    extensions:
      display:
        x: 180
        'y': 90
        colour: '#7c3aed'
      custom:
        relate-examples:
          ask: an appraisal of a property, named by its appraisal number, such as AP-00551; the valuation report, not the property it values
          proper: true
          propose: true
    description: A valuation of a property on one date, made when a loan or an application needed the property's value. A property gathers appraisals over time, and they need not agree; the most recent is the usual basis for combined loan-to-value.
    aliases:
      - Collateral valuation
      - Valuation
    reference: https://spec.edmcouncil.org/fibo/ontology/LOAN/LoansGeneral/LoanEvents/CollateralValuation
  Payment:
    label: Payment
    properties:
      paymentId:
        type: STRING
        key: true
        description: Unique identifier for the scheduled payment. e.g. `PM-000001`.
        pattern: ^PM-[0-9]{6}$
      dueDate:
        type: ZONED DATETIME
        must_exist: true
        description: Calendar date the installment was due, as an ISO 8601 zoned datetime at midnight UTC; only the calendar date carries meaning. e.g. `2025-10-01T00:00:00Z`.
      amountDue:
        type: FLOAT
        must_exist: true
        description: Scheduled installment of principal and interest, in US dollars. e.g. `2022.33`.
      amountPaid:
        type: FLOAT
        must_exist: true
        description: Amount actually paid against this installment, in US dollars. Zero for a missed installment; less than amountDue for a partial payment. e.g. `2022.33`.
      paidDate:
        type: ZONED DATETIME
        description: Calendar date the payment was received, as an ISO 8601 zoned datetime at midnight UTC; only the calendar date carries meaning. Empty when nothing has been paid. e.g. `2025-10-06T00:00:00Z`.
      daysLate:
        type: INTEGER
        description: Days from dueDate to paidDate; 0 when paid on or before the due date, empty when nothing has been paid. e.g. `5`.
    extensions:
      display:
        x: 180
        'y': -30
        colour: '#db2777'
      custom:
        relate-examples:
          ask: one scheduled monthly installment on a loan, named by its payment number, such as PM-002252
          proper: true
          propose: true
    description: One scheduled monthly installment on a loan and what was actually paid against it. Together a loan's payments form its payment history; a missed installment is still a payment record, with nothing paid.
    aliases:
      - Installment
      - Loan payment
    reference: https://spec.edmcouncil.org/fibo/ontology/LOAN/LoansGeneral/Loans/IndividualPaymentTransaction
  FinancialInstitution:
    label: FinancialInstitution
    properties:
      institutionId:
        type: STRING
        key: true
        description: Unique identifier for the institution. e.g. `FI-02`.
      name:
        type: STRING
        description: The institution's legal or trading name. e.g. `Prairie State Credit Union`.
      lei:
        type: STRING
        description: 'ISO 17442 Legal Entity Identifier: 18 alphanumeric characters and two check digits. e.g. `NDDV00FNCFM5D8WJJJ14`.'
        aliases:
          - Legal Entity Identifier
        pattern: ^[A-Z0-9]{18}[0-9]{2}$
    extensions:
      display:
        x: 105
        'y': -150
        colour: '#334155'
      custom:
        relate-examples:
          ask: a bank, credit union, mortgage company or loan servicer, named by its name, such as Lakeshore Mortgage Company or Meridian Servicing Group; the institution that lends or services, never a person
          proper: true
    description: 'A lending institution or loan servicer. Lender and servicer are roles carried by relationships: one institution can lend, service, or both, and a lender''s loans may be serviced elsewhere.'
    aliases:
      - Lender
      - Servicer
      - Financial service provider
  LoanOfficer:
    label: LoanOfficer
    properties:
      officerId:
        type: STRING
        key: true
        description: Unique identifier for the loan officer within the portfolio. e.g. `LO-005`.
      name:
        type: STRING
        description: The loan officer's full name. e.g. `Matthew Kim`.
      nmlsId:
        type: STRING
        description: Identifier permanently assigned to the individual by the Nationwide Mortgage Licensing System and Registry (NMLSR ID). Numeric, held as text. e.g. `1778379`.
        aliases:
          - NMLSR ID
          - NMLS ID
        reference: https://spec.edmcouncil.org/fibo/ontology/LOAN/RealEstateLoans/MortgageOrigination/NMLSR-ID
    extensions:
      display:
        x: -90
        'y': -150
        colour: '#65a30d'
      custom:
        relate-examples:
          ask: a lender's employee who took and handled loan applications, named by full name and often called a loan officer, such as loan officer Carolyn Jensen or Timothy Collins; never a borrower or guarantor
          proper: true
        tools:
          - type: canonicalQuery
            name: early-payment-defaults-by-loan-officer
            question: Early payment defaults by loan officer
            description: Measures early payment default (EPD) — an installment missed, or paid 30 or more days late, within the first months after origination — per originating loan officer, and returns officers whose EPD rate is a multiple of the rate across all officers' loans in the same cohort.
            cypher: |-
              MATCH (o:LoanOfficer)<-[:HANDLED_BY]-(:LoanApplication)-[:RESULTED_IN]->(l:Loan)
              WHERE l.originationDate >= datetime($fromDate)
              WITH o, l, COUNT {
                (l)-[:HAS_PAYMENT]->(p:Payment)
                WHERE p.dueDate < l.originationDate + duration({months: $months})
                  AND (p.amountPaid < p.amountDue OR p.daysLate >= 30)
              } > 0 AS earlyDefault
              WITH collect({officer: o, earlyDefault: earlyDefault}) AS cohort
              WITH cohort, toFloat(size([c IN cohort WHERE c.earlyDefault])) / size(cohort) AS portfolioRate
              UNWIND cohort AS c
              WITH c.officer AS o, portfolioRate, count(*) AS loans,
                   sum(CASE WHEN c.earlyDefault THEN 1 ELSE 0 END) AS earlyDefaults
              WITH o, portfolioRate, loans, earlyDefaults, toFloat(earlyDefaults) / loans AS epdRate
              WHERE loans >= $minLoans AND epdRate >= $minRatio * portfolioRate
              MATCH (o)-[:EMPLOYED_BY]->(fi:FinancialInstitution)
              RETURN o.officerId AS officerId, o.name AS loanOfficer, fi.name AS institution,
                     loans, earlyDefaults, round(100.0 * epdRate, 1) AS epdRatePct,
                     round(100.0 * portfolioRate, 1) AS portfolioRatePct
              ORDER BY epdRate DESC, loans DESC
            parameters:
              - name: fromDate
                type: STRING
                description: Earliest originationDate in the cohort, as an ISO date string, read as midnight UTC. Set it one month before the earliest Payment.dueDate in the database, so every loan counted has its first payments recorded.
                example: '2025-09-01'
              - name: months
                type: INTEGER
                description: Length of the early window after origination. Integer. Start at 6; early payment default is conventionally measured over the first three to twelve months.
                example: 6
              - name: minLoans
                type: INTEGER
                description: Minimum loans an officer must have in the cohort to be rated. Integer. Start at 5, so a single bad loan cannot make a rate; no strong prior.
                example: 5
              - name: minRatio
                type: INTEGER
                description: How many times the cohort-wide EPD rate an officer's rate must reach. Float. Start at 2.0; no strong prior, so read the full list with 1.0 first.
                example: 2
            category: query
            teaches: A concentration of early defaults on one originator is a standard origination-quality and broker-fraud signal, but also follows from the borrowers an officer serves; read the loans before concluding anything. Loans originated near the end of the history have had less time to default, which understates every rate equally.
            returns: 'One row per flagged officer: officerId, loanOfficer, institution, loans, earlyDefaults, epdRatePct and portfolioRatePct, ordered by EPD rate then loans.'
            prerequisites: None beyond the imported reference ontology. Loans whose application has no HANDLED_BY officer are left out of the cohort.
            tags:
              - origination
              - early-payment-default
              - loan-officer
              - quality
            upstream:
              file: QUERIES.md
              heading: Early payment defaults by loan officer
              sample: 'Bundled sample data only: $fromDate = ''2025-09-01'', $months = 6, $minLoans = 5, $minRatio = 2.0 returns 2 rows — Carolyn Jensen (LO-020) and Adam Schmidt (LO-021) of Lakeshore Mortgage Company, 7 early defaults in 18 loans each (38.9% against 15.8%).'
    description: An individual loan originator who takes and handles applications on behalf of the institution employing them.
    aliases:
      - Mortgage loan originator
      - Loan originator
relationships:
  appliedFor:
    type: APPLIED_FOR
    from:
      node: Person
    to:
      node: LoanApplication
      min_count: 1
    properties:
      applicantRole:
        type: STRING
        description: 'The person''s role on the application, as in HMDA reporting: the main `applicant` or a `co-applicant`. Expected to be exactly one `applicant` per application. e.g. `applicant`.'
        one_of:
          - applicant
          - co-applicant
    extensions:
      custom:
        relate-examples:
          phrase: submitted
    description: Records that the person is a party to the application. Every application has at least one applicant; a person may make many applications, or none.
  forProduct:
    type: FOR_PRODUCT
    from:
      node: LoanApplication
      count: 1
    to:
      node: LoanProduct
    extensions:
      custom:
        relate-examples:
          phrase: is for
    description: Records the product the application is for. Exactly one product per application; a product may have many applications, or none. The loan an application results in is written under this product.
  handledBy:
    type: HANDLED_BY
    from:
      node: LoanApplication
      max_count: 1
    to:
      node: LoanOfficer
    extensions:
      custom:
        relate-examples:
          phrase: was handled by
    description: Records the loan officer who took and handled the application, and so originated any loan it results in. At most one officer per application; an officer may handle many applications, or none.
    aliases:
      - Originated by
  resultedIn:
    type: RESULTED_IN
    from:
      node: LoanApplication
      max_count: 1
    to:
      node: Loan
      count: 1
    extensions:
      custom:
        relate-examples:
          phrase: resulted in
    description: Links an application to the loan originated from it. Every loan results from exactly one application; an application results in at most one loan, and only when its disposition is `loan originated`.
  borrowerOn:
    type: BORROWER_ON
    from:
      node: Person
    to:
      node: Loan
      min_count: 1
    properties:
      borrowerRole:
        type: STRING
        description: 'The person''s role on the loan: the `primary borrower` or a `co-borrower`. Expected to be exactly one `primary borrower` per loan. e.g. `co-borrower`.'
        one_of:
          - primary borrower
          - co-borrower
    extensions:
      custom:
        relate-examples:
          phrase: borrows on
    description: Records that the person is a borrower on the loan and liable for repaying it. Every loan has at least one borrower; a person may borrow on many loans, or none. Co-borrowers are treated as jointly and severally liable, so each is exposed to the full balance.
    aliases:
      - Obligor on
  guarantees:
    type: GUARANTEES
    from:
      node: Person
    to:
      node: Loan
    extensions:
      custom:
        relate-examples:
          phrase: guarantees
    description: Records that the person guarantees repayment of the loan if its borrowers do not pay. Taken as a guarantee of the full outstanding balance; partial or capped guarantees are not distinguished. A loan may have several guarantors, or none; a person may guarantee many loans, or none.
    aliases:
      - Guaranty
      - Surety
  lentBy:
    type: LENT_BY
    from:
      node: Loan
      count: 1
    to:
      node: FinancialInstitution
    extensions:
      custom:
        relate-examples:
          phrase: was made by
    description: Records the institution that made the loan and holds the credit agreement. Exactly one lender per loan; an institution may lend on many loans, or none.
  servicedBy:
    type: SERVICED_BY
    from:
      node: Loan
      count: 1
    to:
      node: FinancialInstitution
    extensions:
      custom:
        relate-examples:
          phrase: is serviced by
    description: Records the institution that services the loan, collecting payments and managing delinquency on the lender's behalf. Exactly one servicer per loan, which may be the lender itself; an institution may service many loans, or none.
  employedBy:
    type: EMPLOYED_BY
    from:
      node: LoanOfficer
      count: 1
    to:
      node: FinancialInstitution
    extensions:
      custom:
        relate-examples:
          phrase: works for
    description: Records the institution the loan officer currently originates for. Exactly one institution per officer; an institution may employ many officers, or none. Represents current employment, not a history.
  securedBy:
    type: SECURED_BY
    from:
      node: Loan
      max_count: 1
    to:
      node: Property
    extensions:
      custom:
        relate-examples:
          phrase: is secured on
    description: Records that the loan is secured by a lien on the property, in the position given by the loan's lienPosition. At most one property per loan, and none for an unsecured loan; a property may secure several loans at once, which is what makes combined loan-to-value a property-level measure.
    aliases:
      - Collateralized by
      - Lien on
    reference: https://spec.edmcouncil.org/fibo/ontology/LOAN/RealEstateLoans/Mortgages/LoanSecuredByRealEstate
  values:
    type: VALUES
    from:
      node: Appraisal
      count: 1
    to:
      node: Property
    extensions:
      custom:
        relate-examples:
          phrase: valued
    description: Records that the appraisal established a value for the property. Exactly one property per appraisal; a property may have many appraisals over time, or none.
  hasPayment:
    type: HAS_PAYMENT
    from:
      node: Loan
    to:
      node: Payment
      count: 1
    extensions:
      custom:
        relate-examples:
          phrase: has the installment
    description: Links a loan to one of its scheduled payments, forming its payment history. Every payment belongs to exactly one loan; a loan has one payment per scheduled installment in the period covered, and none before its first due date.
