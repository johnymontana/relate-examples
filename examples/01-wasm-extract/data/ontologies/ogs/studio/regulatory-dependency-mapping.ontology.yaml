schema: https://neo4j.com/docs/ontology-graph-spec/1.1.0/schema.json
version: '1'
id: regulatory-dependency-mapping
name: Regulatory Dependency Mapping
description: 'Models a regulator''s handbook as a graph: standards, the hierarchy of sections beneath them, and the cross-references sections make to one another. Answers which parts of a rulebook a proposed change reaches, which text is most expensive to change, and where one standard depends on another.'
nodes:
  Standard:
    label: Standard
    properties:
      id:
        type: STRING
        key: true
        description: Short identifier for the standard as the regulator publishes it, typically the sourcebook code. Expected to be the prefix from which section identifiers in this standard are built. e.g. `MIFIDPRU`.
        pattern: ^[A-Z]{2,10}$
    extensions:
      display:
        x: -110
        'y': 0
        colour: '#1d4ed8'
      custom:
        relate-examples:
          ask: the code of a whole sourcebook on its own, a capitalised word with no number after it, such as MIFIDPRU, SYSC or COBS; never a code followed by a number, and never a team, an office or a regulator
          proper: true
        tools:
          - type: canonicalQuery
            name: explore-a-standard-s-section-hierarchy
            question: Explore a standard's section hierarchy
            description: Returns every section beneath a standard, with the depth at which it sits, by following DEPENDS_ON from the standard down through top-level sections to their child sections.
            cypher: |-
              MATCH path = (std:Standard {id: $standardId})<-[:DEPENDS_ON*1..4]-(section:Section)
              RETURN std.id             AS standard,
                     section.id          AS sectionId,
                     section.title       AS title,
                     section.lastUpdated AS lastUpdated,
                     length(path)        AS depth
              ORDER BY depth, sectionId
            parameters:
              - name: standardId
                type: STRING
                description: Identifier of the standard to expand, as the regulator publishes it and as Standard.id records it.
                example: MIFIDPRU
            category: query
            teaches: 'The orientation query — run it first to see how deep and how wide a handbook is before analysing it. The traversal is bounded at four hops, a literal in the Cypher: sections nested deeper than four levels are omitted with no indication, so compare the row count against the number of Section nodes in the standard before relying on it. A section of the standard that does not appear is either nested below the bound or detached from its hierarchy altogether — the second is an import or data-quality finding, and the two look identical here.'
            returns: 'One row per section: the standard, section identifier, title, the in-force date of its current text, and its depth below the standard.'
            prerequisites: None beyond the imported reference ontology.
            tags:
              - hierarchy
              - standard
              - section
              - orientation
            upstream:
              file: QUERIES.md
              heading: Explore a standard's section hierarchy
              sample: 'Bundled sample data only: $standardId = ''MIFIDPRU'' returns 48 rows — 9 at depth 1, 28 at depth 2 and 11 at depth 3.'
          - type: canonicalQuery
            name: gds-project-the-section-cross-reference-graph
            question: GDS — Project the section cross-reference graph
            description: Creates the in-memory GDS projection of Section nodes and RELATED relationships that the PageRank and community queries below run against.
            cypher: |-
              CALL gds.graph.project('regulatorySections', 'Section', 'RELATED')
              YIELD graphName, nodeCount, relationshipCount
              RETURN graphName, nodeCount, relationshipCount
            parameters: []
            category: graph data science
            teaches: 'Run once before either analytic below, and drop the projection afterwards — it is not released on disconnect. The projection deliberately excludes the DEPENDS_ON hierarchy: including it would let influence flow along parent-child structure, which says only that a handbook has chapters. Every Section node is projected, including those nothing cross-references, so they appear as isolated nodes with a floor PageRank score and as single-member communities. Check the reported counts against the Section and RELATED totals before trusting either analytic.'
            returns: The projection name with its node and relationship counts.
            prerequisites: GDS plugin 2.x. Fails if a projection of the same name already exists in the graph catalog for this database and user, which outlives the client session.
            tags:
              - gds
              - projection
              - setup
            requires:
              - gds
            upstream:
              file: QUERIES.md
              heading: GDS — Project the section cross-reference graph
              sample: 'Bundled sample data only: returns graphName ''regulatorySections'', nodeCount 137, relationshipCount 85.'
          - type: canonicalQuery
            name: gds-rank-section-influence-with-pagerank
            question: GDS — Rank section influence with PageRank
            description: Scores each section by PageRank over the citation graph, so that a citation from a heavily-cited section counts for more than one from an isolated section, and joins the scores back to standards and raw citation counts.
            cypher: |-
              CALL gds.pageRank.stream('regulatorySections')
              YIELD nodeId, score
              WITH gds.util.asNode(nodeId) AS section, score
              MATCH (section)-[:DEPENDS_ON*1..4]->(std:Standard)
              OPTIONAL MATCH (citing:Section)-[:RELATED]->(section)
              RETURN std.id          AS standard,
                     section.id      AS sectionId,
                     section.title    AS title,
                     round(score, 4)  AS pageRankScore,
                     count(DISTINCT citing) AS inboundCitations
              ORDER BY pageRankScore DESC, sectionId
              LIMIT $limit
            parameters:
              - name: limit
                type: INTEGER
                description: Maximum sections to return. Start at 20, roughly a screen a reader can take in at once, and raise it only once the top of the ranking has been dealt with.
                example: 20
            category: graph data science
            teaches: 'Use it to decide where regulatory-change effort is best spent: a high score means a change here propagates through the citation graph rather than staying local. The point of running it alongside the inbound-count query is the disagreement between them — a section that ranks high here but low on raw count is cited by few sections that are themselves heavily cited, which raw counting cannot see and which is exactly the quietly structural text worth finding. Scores are relative within one run and not comparable across handbooks or across runs on different data, so read the ranking, not the number. Ties are normal and the rounding creates more of them. The walk up to the standard is bounded at four literal hops: a section nested deeper is scored by GDS but omitted from this result.'
            returns: 'One row per section: standard, identifier, title, PageRank score rounded to four decimals, and inbound citation count. Highest score first.'
            prerequisites: GDS plugin 2.x, and the 'regulatorySections' projection created by the projection query above.
            tags:
              - gds
              - pagerank
              - centrality
              - section
              - change-cost
            requires:
              - gds
            upstream:
              file: QUERIES.md
              heading: GDS — Rank section influence with PageRank
              sample: 'Bundled sample data only: $limit = 20 ranks MIFIDPRU 4.12 first, then SYSC 8.3 (4 inbound) above SYSC 15A.1 (5 inbound), with MIFIDPRU 1.2 fourth on a single inbound citation.'
          - type: canonicalQuery
            name: gds-group-cross-referencing-sections-into-communities
            question: GDS — Group cross-referencing sections into communities
            description: Runs Weakly Connected Components over the citation graph to find clusters of sections that reference one another, and reports each cluster's size and the standards it spans.
            cypher: |-
              CALL gds.wcc.stream('regulatorySections')
              YIELD nodeId, componentId
              WITH componentId, gds.util.asNode(nodeId) AS section
              MATCH (section)-[:DEPENDS_ON*1..4]->(std:Standard)
              WITH componentId,
                   collect(DISTINCT section.id)  AS sectionIds,
                   collect(DISTINCT std.id) AS standardsSpanned
              WITH componentId, sectionIds, standardsSpanned, size(sectionIds) AS communitySize
              WHERE communitySize >= $minCommunitySize
              RETURN componentId,
                     communitySize,
                     size(standardsSpanned) AS standardCount,
                     standardsSpanned,
                     sectionIds[0..10] AS sampleSections
              ORDER BY communitySize DESC, componentId
            parameters:
              - name: minCommunitySize
                type: INTEGER
                description: 'Smallest cluster to report. Start at 2: a component of one is a section with no cross-reference in either direction, which says nothing about clustering. How many of those a handbook has depends entirely on how completely its cross-references were captured. Raise it to concentrate on the larger clusters.'
                example: 2
            category: graph data science
            teaches: 'Finds the natural units of regulatory change — clusters that have to be assessed together because their text is mutually referential. A component spanning more than one standard is the finding to pursue: a change in one rulebook propagates into another, which is the dependency a per-sourcebook review cannot see. Weakly connected components ignore citation direction, so a single citation is enough to merge two clusters, and one bridging reference can collapse most of a handbook into a single component. Treat a very large component as a prompt to find the bridging citation rather than as one coherent group — and where that happens, prefer the PageRank ranking, which degrades more gracefully. The walk up to the standard is bounded at four literal hops, so a member nested deeper contributes no standard and the member count understates the true component size.'
            returns: 'One row per component: component identifier, member count, the number of standards it spans and their identifiers, and up to ten member section identifiers. Largest first.'
            prerequisites: GDS plugin 2.x, and the 'regulatorySections' projection created by the projection query above.
            tags:
              - gds
              - wcc
              - community
              - cross-reference
              - section
            requires:
              - gds
            upstream:
              file: QUERIES.md
              heading: GDS — Group cross-referencing sections into communities
              sample: 'Bundled sample data only: $minCommunitySize = 2 returns 10 components sized 49, 6, 4, 4, 2, 2, 2, 2, 2, 2; the 49-member component spans COBS, MIFIDPRU and SYSC.'
          - type: canonicalQuery
            name: gds-drop-the-section-projection
            question: GDS — Drop the section projection
            description: Releases the in-memory 'regulatorySections' projection.
            cypher: |-
              CALL gds.graph.drop('regulatorySections')
              YIELD graphName, nodeCount
              RETURN graphName, nodeCount
            parameters: []
            category: graph data science
            teaches: Run after finishing with the GDS queries. Leaving a projection in place holds memory on the instance and makes the projection query fail on its next run with a name conflict. Dropping it does not touch the stored graph. Dropping a projection that does not exist raises an error rather than passing silently, which is deliberate — a mistyped projection name should be noticed.
            returns: The dropped projection's name and node count.
            prerequisites: GDS plugin 2.x, and an existing projection of that name.
            tags:
              - gds
              - projection
              - cleanup
            requires:
              - gds
            upstream:
              file: QUERIES.md
              heading: GDS — Drop the section projection
              sample: 'Bundled sample data only: returns graphName ''regulatorySections'' and nodeCount 137.'
          - type: canonicalQuery
            name: node-key-constraints
            question: Node-key constraints
            cypher: |-
              CREATE CONSTRAINT standard_id IF NOT EXISTS
              FOR (n:Standard) REQUIRE n.id IS NODE KEY;

              CREATE CONSTRAINT section_id IF NOT EXISTS
              FOR (n:Section) REQUIRE n.id IS NODE KEY;
            parameters: []
            category: setup
            requires:
              - write
            upstream:
              file: QUERIES.md
              heading: Node-key constraints
              sample: ''
    description: A named regulatory standard, handbook or sourcebook published by a supervisory authority — the highest level of the regulatory hierarchy. Sections hang beneath it.
    aliases:
      - Sourcebook
      - Handbook
  Section:
    label: Section
    properties:
      id:
        type: STRING
        key: true
        description: Section identifier exactly as the regulator cites it, including the standard prefix — a sourcebook code followed by chapter and section numbers. Expected to be unique across every standard, not merely within one. e.g. `COBS 4.2`.
        pattern: ^[A-Z]{2,10} [0-9]+[A-Z]?(?:\.[0-9]+)*$
      title:
        type: STRING
        must_exist: true
        extensions:
          custom:
            relate-examples:
              extract: true
              ask: the heading of the section as the handbook publishes it, the words after its number, such as K-DTF daily trading flow requirement or Reporting timetable
        description: Long heading of the section as published, conventionally repeating the section identifier before the heading text. e.g. `COBS 4.2 Reporting timetable`.
      lastUpdated:
        type: ZONED DATETIME
        must_exist: true
        description: Date on which the section's current text took effect in the handbook — the in-force date of the most recent amendment, not the date that amendment was announced or published. ISO 8601 zoned datetime; the time and zone carry no meaning beyond the calendar date, kept only because local imports require a zoned datetime rather than a bare date. This is the property regulatory-change analysis filters on. e.g. `2025-02-01T00:00:00Z`.
    extensions:
      display:
        x: 80
        'y': 0
        colour: '#d97706'
      custom:
        relate-examples:
          ask: a numbered part of a sourcebook, its code followed by a chapter or section number, such as MIFIDPRU 4, MIFIDPRU 4.12, SYSC 7.3 or COBS 11.4
          proper: true
        tools:
          - type: canonicalQuery
            name: cross-references-into-and-out-of-a-section
            question: Cross-references into and out of a section
            description: Returns every section a given section cites and every section that cites it, each with the specific rule inside the cited section that the reference points at.
            cypher: |-
              MATCH (section:Section {id: $sectionId})-[ref:RELATED]-(related:Section)
              RETURN CASE WHEN startNode(ref) = section THEN 'cites' ELSE 'cited by' END
                                         AS direction,
                     related.id          AS relatedSectionId,
                     related.title       AS relatedTitle,
                     related.lastUpdated AS relatedLastUpdated,
                     ref.subsection      AS ruleReference
              ORDER BY direction, relatedSectionId
            parameters:
              - name: sectionId
                type: STRING
                description: Identifier of the section to examine, as Section.id records it.
                example: MIFIDPRU 4.12
            category: query
            teaches: 'Run this before assessing a proposed change to a section: the ''cited by'' rows are the text that silently changes meaning when this section moves. Direction is what matters — a section with many outbound citations is dependent on others, one with many inbound citations is load-bearing, and only the second makes a change expensive. One hop only; for text reached indirectly use the blast-radius query. Returns no rows both when a section has no cross-references and when the identifier does not exist, so confirm the identifier before concluding a section is unreferenced.'
            returns: 'One row per cross-reference: direction (''cites'' or ''cited by''), the section at the other end with its title and in-force date, and the rule reference carried on the relationship. Two sections that cite each other produce one row in each direction.'
            prerequisites: None beyond the imported reference ontology.
            tags:
              - cross-reference
              - change-assessment
              - section
            upstream:
              file: QUERIES.md
              heading: Cross-references into and out of a section
              sample: 'Bundled sample data only: $sectionId = ''MIFIDPRU 4.12'' returns 7 rows, all ''cited by'' — COBS 11.2, MIFIDPRU 1.2.1, MIFIDPRU 4.1, MIFIDPRU 6.2, MIFIDPRU 7.1, MIFIDPRU 9.2 and SYSC 7.3.'
          - type: canonicalQuery
            name: sections-changed-since-a-date
            question: Sections changed since a date
            description: Returns sections whose current text took effect on or after a given date, with the standard they belong to and how many other sections cite them.
            cypher: |-
              MATCH (section:Section)
              WHERE section.lastUpdated >= datetime($changedSince)
              OPTIONAL MATCH (section)-[:DEPENDS_ON*1..4]->(std:Standard)
              OPTIONAL MATCH (citing:Section)-[:RELATED]->(section)
              RETURN coalesce(std.id, '(unresolved)') AS standard,
                     section.id          AS sectionId,
                     section.title       AS title,
                     section.lastUpdated AS lastUpdated,
                     count(DISTINCT citing) AS inboundCitations
              ORDER BY lastUpdated DESC, sectionId
            parameters:
              - name: changedSince
                type: STRING
                description: Earliest in-force date to include, as an ISO 8601 date or zoned-datetime string (YYYY-MM-DD or YYYY-MM-DDTHH:MM:SSZ). Set it to the start of the regulatory-change review cycle in hand, so the result is exactly what has not yet been assessed. Where no fixed cycle exists, widen from the date of the last assessment until the result stops being reviewable.
                example: '2026-06-01'
            category: query
            teaches: 'The standing regulatory-change sweep, and the entry point to the other change queries: this finds what moved, the blast-radius query follows one of them outwards. The walk up to the standard is bounded at four hops and deliberately optional — missing a change is this query''s one unacceptable failure, so a section nested deeper than the bound, or detached from any hierarchy, is still returned, with ''(unresolved)'' in the standard column rather than being dropped. Treat those rows as a data-quality finding in their own right.'
            returns: 'One row per changed section: standard, section identifier and title, in-force date, and inbound citation count. Newest change first. The standard reads ''(unresolved)'' where the section does not reach one.'
            prerequisites: None beyond the imported reference ontology.
            tags:
              - regulatory-change
              - section
              - change-sweep
            upstream:
              file: QUERIES.md
              heading: Sections changed since a date
              sample: 'Bundled sample data only: $changedSince = ''2026-06-01'' returns 2 rows — MIFIDPRU 4.12 (2026-07-15, 7 inbound citations) and MIFIDPRU 4.12.1 (2026-06-30, 0).'
          - type: canonicalQuery
            name: change-blast-radius-for-a-section
            question: Change blast radius for a section
            description: 'Takes one section and returns everything a change to it reaches: the section itself, the subsections beneath it, and every section that cites any of those directly or through a chain of citations.'
            cypher: |-
              MATCH (changed:Section {id: $sectionId})
              OPTIONAL MATCH (descendant:Section)-[:DEPENDS_ON*1..3]->(changed)
              WITH changed, collect(DISTINCT descendant) AS descendants
              WITH [changed] + descendants AS core
              UNWIND core AS coreSection
              OPTIONAL MATCH (citing:Section)-[:RELATED*1..3]->(coreSection)
              WITH core, collect(DISTINCT citing) AS citers
              UNWIND core + citers AS affected
              WITH core, collect(DISTINCT affected) AS affectedSections
              UNWIND affectedSections AS affected
              OPTIONAL MATCH (affected)-[:DEPENDS_ON*1..4]->(std:Standard)
              RETURN CASE WHEN affected IN core THEN 'changed text'
                          ELSE 'cites changed text' END AS reachedVia,
                     coalesce(std.id, '(unresolved)') AS standard,
                     affected.id          AS sectionId,
                     affected.title       AS title,
                     affected.lastUpdated AS lastUpdated
              ORDER BY reachedVia, standard, sectionId
            parameters:
              - name: sectionId
                type: STRING
                description: Identifier of the section being changed, as Section.id records it.
                example: MIFIDPRU 4.12
            category: query
            teaches: 'The impact-assessment query, and the reason the reference ontology is a graph rather than a table — a citation chain three deep is invisible to any per-section review. Three literal bounds sit in the Cypher and none can be parameterised: three hops down the subsection hierarchy, three hops of citation, and four hops up to the standard — a section nested deeper than four levels is still returned, but shows ''(unresolved)'' in place of its standard. The citation bound is the one that changes the answer, and it is a genuine trade-off rather than a safe default — each extra hop reaches text with a progressively weaker claim to being affected, and the result stops being an impact assessment once it stops being reviewable. Run it at one hop first, then widen, and watch how fast the count grows; anything omitted beyond the bound is omitted silently.'
            returns: 'One row per affected section: how it was reached (''changed text'' for the section and its subsections, ''cites changed text'' for everything downstream), the standard it belongs to, its identifier, title and in-force date. The standard reads ''(unresolved)'' where the section does not reach one.'
            prerequisites: None beyond the imported reference ontology.
            tags:
              - impact-analysis
              - regulatory-change
              - citation-chain
            upstream:
              file: QUERIES.md
              heading: Change blast radius for a section
              sample: 'Bundled sample data only: $sectionId = ''MIFIDPRU 4.12'' returns 15 rows — 2 ''changed text'' (MIFIDPRU 4.12 and MIFIDPRU 4.12.1) and 13 ''cites changed text'', spanning COBS, MIFIDPRU and SYSC.'
          - type: canonicalQuery
            name: most-cited-sections-by-inbound-citation-count
            question: Most-cited sections by inbound citation count
            description: Ranks sections by how many other sections cite them, with their outbound citation count alongside for contrast.
            cypher: |-
              MATCH (citing:Section)-[:RELATED]->(cited:Section)
              WITH cited, count(DISTINCT citing) AS inboundCitations
              OPTIONAL MATCH (cited)-[:DEPENDS_ON*1..4]->(std:Standard)
              OPTIONAL MATCH (cited)-[:RELATED]->(outbound:Section)
              RETURN coalesce(std.id, '(unresolved)') AS standard,
                     cited.id          AS sectionId,
                     cited.title       AS title,
                     cited.lastUpdated AS lastUpdated,
                     inboundCitations,
                     count(DISTINCT outbound) AS outboundCitations
              ORDER BY inboundCitations DESC, sectionId
              LIMIT $limit
            parameters:
              - name: limit
                type: INTEGER
                description: Maximum sections to return. Start at 20, roughly a screen a reader can take in at once, and raise it only once the top of the ranking has been dealt with.
                example: 20
            category: query
            teaches: 'The plain-Cypher measure of which text is expensive to change, and the one to use when GDS is unavailable. It counts direct citations only, so it credits a section cited by many peripheral sections the same as one cited by a few load-bearing ones; the PageRank query separates those, and comparing the two rankings is more informative than either alone. Read the two columns together: high inbound with low outbound is foundational text that other rules rest on, and the most expensive thing in a handbook to amend. Sections that nothing cites are absent rather than returned with a zero. The walk up to the standard is a literal four hops and optional, so a section nested deeper is still ranked but shows ''(unresolved)'' in place of its standard.'
            returns: 'One row per cited section: standard, identifier, title, in-force date, inbound citation count and outbound citation count. Most cited first. The standard reads ''(unresolved)'' where the section does not reach one.'
            prerequisites: None beyond the imported reference ontology.
            tags:
              - centrality
              - cross-reference
              - section
              - change-cost
            upstream:
              file: QUERIES.md
              heading: Most-cited sections by inbound citation count
              sample: 'Bundled sample data only: $limit = 20 returns 20 rows, led by MIFIDPRU 4.12 (7 inbound, 0 outbound), then SYSC 15A.1 (5 inbound, 4 outbound).'
          - type: canonicalQuery
            name: citations-that-cross-standards
            question: Citations that cross standards
            description: Returns every cross-reference whose citing and cited sections resolve to different standards, with the rule referenced at the far end.
            cypher: |-
              MATCH (citing:Section)-[ref:RELATED]->(cited:Section)
              MATCH (citing)-[:DEPENDS_ON*1..4]->(citingStd:Standard)
              MATCH (cited)-[:DEPENDS_ON*1..4]->(citedStd:Standard)
              WHERE citingStd <> citedStd
              RETURN citingStd.id      AS citingStandard,
                     citing.id         AS citingSectionId,
                     citedStd.id       AS citedStandard,
                     cited.id          AS citedSectionId,
                     ref.subsection    AS ruleReference,
                     cited.lastUpdated AS citedLastUpdated
              ORDER BY citingStandard, citedStandard, citingSectionId
            parameters: []
            category: query
            teaches: 'Finds where one rulebook leans on another — the dependencies a standard-by-standard review process is structurally blind to, because each review sees only its own sourcebook. These are the citations worth confirming by hand: a change programme scoped to one standard will not notice that it has moved text another standard relies on. Both walks up to a standard are bounded at four literal hops, so a citation whose either end nests deeper is omitted silently; on a deeply nested handbook raise both bounds together, since raising one alone biases the result. Read the direction: citing to cited is the direction of dependency, and the cited standard is the one whose changes propagate outward.'
            returns: 'One row per cross-standard citation: citing standard and section, cited standard and section, the rule reference, and the in-force date of the cited text. Ordered by the pair of standards involved.'
            prerequisites: None beyond the imported reference ontology.
            tags:
              - cross-standard
              - dependency
              - overlap
              - cross-reference
            upstream:
              file: QUERIES.md
              heading: Citations that cross standards
              sample: 'Bundled sample data only: returns 12 rows, covering all six ordered pairs of the three standards COBS, MIFIDPRU and SYSC.'
          - type: canonicalQuery
            name: recently-changed-sections-that-are-heavily-cited
            question: Recently changed sections that are heavily cited
            description: Returns sections whose text took effect on or after a given date and which at least a stated number of other sections cite, with the standards those citing sections belong to.
            cypher: |-
              MATCH (cited:Section)
              WHERE cited.lastUpdated >= datetime($changedSince)
              MATCH (citing:Section)-[:RELATED]->(cited)
              OPTIONAL MATCH (cited)-[:DEPENDS_ON*1..4]->(std:Standard)
              OPTIONAL MATCH (citing)-[:DEPENDS_ON*1..4]->(citingStd:Standard)
              WITH cited, std,
                   count(DISTINCT citing) AS inboundCitations,
                   collect(DISTINCT citingStd.id) AS citingStandards
              WHERE inboundCitations >= $minInboundCitations
              RETURN coalesce(std.id, '(unresolved)') AS standard,
                     cited.id          AS sectionId,
                     cited.title       AS title,
                     cited.lastUpdated AS lastUpdated,
                     inboundCitations,
                     size(citingStandards) AS citingStandardCount,
                     citingStandards
              ORDER BY inboundCitations DESC, lastUpdated DESC, sectionId
            parameters:
              - name: changedSince
                type: STRING
                description: Earliest in-force date to include, as an ISO 8601 date or zoned-datetime string (YYYY-MM-DD or YYYY-MM-DDTHH:MM:SSZ). Set it to the start of the review cycle in hand, as for the change sweep.
                example: '2025-09-09'
              - name: minInboundCitations
                type: INTEGER
                description: 'Minimum number of sections that must cite the changed section. Start at 2: a threshold of 1 admits any changed section that anything cites at all, while 2 is the first value that means more than one part of the book leans on this text. Raise it until the list is short enough to work through by hand.'
                example: 2
            category: query
            teaches: 'The prioritisation query — where change and cost intersect, and the shortlist to work through first when a handbook update lands. A row whose citing standards include a standard other than its own is the strongest signal here: the change has already propagated outside the rulebook that made it, so scoping the assessment to the amending standard will miss it. The walks up to a standard are bounded at four literal hops; a citing section nested deeper still counts toward the citation total but contributes no standard, so the standard count is a floor, not an exact figure.'
            returns: 'One row per section: standard, identifier, title, in-force date, inbound citation count, the number of distinct standards citing it, and those standards. Most cited first. The standard reads ''(unresolved)'' where the section does not reach one.'
            prerequisites: None beyond the imported reference ontology.
            tags:
              - regulatory-change
              - prioritisation
              - centrality
              - cross-standard
            upstream:
              file: QUERIES.md
              heading: Recently changed sections that are heavily cited
              sample: 'Bundled sample data only: $changedSince = ''2025-09-09'', $minInboundCitations = 2 returns 4 rows — MIFIDPRU 4.12 (7 citations from 3 standards), SYSC 15A.3 (4), COBS 11.4 (3) and MIFIDPRU 8.1 (2).'
    description: A single addressable unit of regulatory text — a chapter, section or subsection of a standard. Sections form the hierarchy of a handbook, cross-reference one another, and are the level at which regulatory change is tracked.
relationships:
  sectionInStandard:
    type: DEPENDS_ON
    from:
      node: Section
      max_count: 1
    to:
      node: Standard
    extensions:
      custom:
        relate-examples:
          phrase: sits within
    description: Places a top-level section directly beneath the standard that publishes it. Only sections at the top of a handbook's hierarchy carry this; deeper sections reach their standard through their parent section instead. A section sits directly beneath at most one standard, and carries either this or a DEPENDS_ON to a parent section, never both; a standard may have many top-level sections.
  sectionInSection:
    type: DEPENDS_ON
    from:
      node: Section
      max_count: 1
    to:
      node: Section
    extensions:
      custom:
        relate-examples:
          phrase: sits within
    description: Places a section beneath its immediate parent section in the handbook hierarchy, read child to parent. Chaining these from a top-level section reconstructs the full depth of a handbook. A section has at most one parent section, and carries either this or a DEPENDS_ON to a standard, never both; a section may have many child sections, or none.
  sectionRelated:
    type: RELATED
    from:
      node: Section
    to:
      node: Section
    properties:
      subsection:
        type: STRING
        must_exist: true
        description: The specific rule within the cited (to) section that the citing section refers to, in the regulator's own rule notation. Where a section is cited as a whole this is expected to be the cited section's own identifier. e.g. `COBS 3.1.1.5R`.
    extensions:
      custom:
        relate-examples:
          phrase: cites
    description: Records a cross-reference made by the citing (from) section to the cited (to) section, so that a change to the cited text is known to reach the citing text. Direction is the direction of the citation, not of influence; two sections that cite each other carry one of these each way. A section may cite many others, or none, and be cited by many, or by none.
    aliases:
      - Cross-reference
      - Citation
