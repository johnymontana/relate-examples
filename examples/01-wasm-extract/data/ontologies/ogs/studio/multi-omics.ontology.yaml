schema: https://neo4j.com/docs/ontology-graph-spec/1.1.0/schema.json
version: '1'
id: multi-omics
name: Multi-Omics Data Integration
description: Relates research samples, the transcriptomics and proteomics experiments that assay them and the case-control comparisons that analyse them to the genes and proteins those comparisons find changed, and to diseases, phenotypes, Gene Ontology terms, pathways and protein interactions, so transcript and protein evidence can be read side by side for target discovery and pathway analysis.
nodes:
  Project:
    label: Project
    properties:
      projectId:
        type: STRING
        key: true
        description: Identifier of the project, unique within the database. e.g. `PRJ-ADIPOSE`.
        pattern: ^PRJ-[A-Z]+$
      name:
        type: STRING
        description: Human-readable title of the project.
    extensions:
      display:
        x: -215
        'y': -130
        colour: '#0891b2'
      custom:
        relate-examples:
          ask: a research cohort or study programme that collected the samples, named by a project code beginning PRJ-, such as PRJ-ADIPOSE
          proper: true
          propose: true
        tools:
          - type: canonicalQuery
            name: node-keys
            question: Node keys
            cypher: |-
              CREATE CONSTRAINT project_key IF NOT EXISTS FOR (n:Project) REQUIRE n.projectId IS NODE KEY;
              CREATE CONSTRAINT sample_key IF NOT EXISTS FOR (n:Sample) REQUIRE n.sampleId IS NODE KEY;
              CREATE CONSTRAINT tissue_key IF NOT EXISTS FOR (n:Tissue) REQUIRE n.uberonId IS NODE KEY;
              CREATE CONSTRAINT phenotype_key IF NOT EXISTS FOR (n:Phenotype) REQUIRE n.phenotypeId IS NODE KEY;
              CREATE CONSTRAINT experiment_key IF NOT EXISTS FOR (n:Experiment) REQUIRE n.experimentId IS NODE KEY;
              CREATE CONSTRAINT comparison_key IF NOT EXISTS FOR (n:Comparison) REQUIRE n.comparisonId IS NODE KEY;
              CREATE CONSTRAINT gene_key IF NOT EXISTS FOR (n:Gene) REQUIRE n.ensemblId IS NODE KEY;
              CREATE CONSTRAINT protein_key IF NOT EXISTS FOR (n:Protein) REQUIRE n.uniprotId IS NODE KEY;
              CREATE CONSTRAINT disease_key IF NOT EXISTS FOR (n:Disease) REQUIRE n.mondoId IS NODE KEY;
              CREATE CONSTRAINT goterm_key IF NOT EXISTS FOR (n:GOTerm) REQUIRE n.goId IS NODE KEY;
              CREATE CONSTRAINT pathway_key IF NOT EXISTS FOR (n:Pathway) REQUIRE n.pathwayId IS NODE KEY;
            parameters: []
            category: setup
            requires:
              - write
            upstream:
              file: QUERIES.md
              heading: Node keys
              sample: ''
    description: A research study or programme that groups the samples collected under one protocol, such as a biopsy cohort or an organ-donor islet collection.
    aliases:
      - Study
      - Cohort
  Sample:
    label: Sample
    properties:
      sampleId:
        type: STRING
        key: true
        description: Identifier of the sample, unique within the database. e.g. `S-ADI-020`.
        pattern: ^S-[A-Z]{3}-[0-9]{3}$
      donorId:
        type: STRING
        description: Pseudonymous identifier of the donor (patient, volunteer or organ donor) the sample came from. One donor may give samples from several tissues, which share this value. Never a name or medical record number. e.g. `D040`.
    extensions:
      display:
        x: -115
        'y': -130
        colour: '#2563eb'
      custom:
        relate-examples:
          ask: a biological specimen from one donor, named by a sample code beginning S-, such as S-ADI-020
          proper: true
          propose: true
    description: A biological specimen taken from one donor, at one time, from one tissue. One or more omics experiments assay it, and comparisons place it in a case or control group.
    aliases:
      - Specimen
      - Biosample
  Tissue:
    label: Tissue
    properties:
      uberonId:
        type: STRING
        key: true
        description: 'UBERON term CURIE for the tissue: `UBERON:` followed by seven digits. e.g. `UBERON:0002107`.'
        pattern: ^UBERON:[0-9]{7}$
      name:
        type: STRING
        description: UBERON label of the tissue.
    extensions:
      display:
        x: -115
        'y': -215
        colour: '#a16207'
      custom:
        relate-examples:
          ask: the anatomical tissue a sample was taken from, such as visceral adipose tissue, or its UBERON term
    description: The anatomical tissue or structure a sample is taken from, identified by its UBERON (Uber-anatomy Ontology) term.
    aliases:
      - Anatomical site
  Phenotype:
    label: Phenotype
    properties:
      phenotypeId:
        type: STRING
        key: true
        description: 'CURIE of the phenotype term: an EFO, HP or MONDO prefix, a colon and seven digits. e.g. `HP:0001513`.'
        pattern: ^(EFO|HP|MONDO):[0-9]{7}$
      name:
        type: STRING
        description: Label of the phenotype term.
    extensions:
      display:
        x: -215
        'y': -215
        colour: '#db2777'
      custom:
        relate-examples:
          ask: a clinical trait recorded in a sample's donor, such as insulin resistance, or its HP term such as HP:0000855; a trait of the donor, not a disease a comparison studies
        tools:
          - type: canonicalQuery
            name: comparisons-whose-cases-carry-a-phenotype
            question: Comparisons whose cases carry a phenotype
            description: For a phenotype, finds every comparison whose case group includes samples from donors with that phenotype, and the share of cases and of controls that carry it.
            cypher: |-
              MATCH (ph:Phenotype {phenotypeId: $phenotypeId})
              MATCH (c:Comparison)-[i:INCLUDES]->(s:Sample)
              WITH ph, c, i.group AS grp, EXISTS { (s)-[:HAS_PHENOTYPE]->(ph) } AS has
              WITH ph, c,
                   sum(CASE WHEN grp = 'case' THEN 1 ELSE 0 END) AS cases,
                   sum(CASE WHEN grp = 'case' AND has THEN 1 ELSE 0 END) AS casesWith,
                   sum(CASE WHEN grp = 'control' THEN 1 ELSE 0 END) AS controls,
                   sum(CASE WHEN grp = 'control' AND has THEN 1 ELSE 0 END) AS controlsWith
              WHERE casesWith > 0
              RETURN ph.name AS phenotype, c.comparisonId AS comparisonId, c.name AS comparison,
                     casesWith, cases, round(toFloat(casesWith) / cases, 3) AS caseFraction,
                     controlsWith, controls, round(toFloat(controlsWith) / controls, 3) AS controlFraction
              ORDER BY caseFraction DESC, comparisonId
            parameters:
              - name: phenotypeId
                type: STRING
                description: CURIE of the phenotype term (EFO, HP or MONDO), e.g. 'HP:0000855' for insulin resistance.
                example: HP:0001395
            category: query
            teaches: Use to find which contrasts speak to a clinical trait before reading their results. A high case fraction with a low control fraction means the comparison separates the trait; similar fractions in both groups mean the trait is not what distinguishes cases from controls, and the comparison's results say little about it.
            returns: 'One row per comparison with at least one case carrying the phenotype: phenotype, comparisonId, comparison, casesWith, cases, caseFraction, controlsWith, controls, controlFraction. Ordered by caseFraction, highest first.'
            prerequisites: None beyond the imported reference ontology.
            tags:
              - phenotype
              - trait
              - cohort
              - comparison
              - EFO
              - HPO
            upstream:
              file: QUERIES.md
              heading: Comparisons whose cases carry a phenotype
              sample: 'Bundled sample data only: $phenotypeId = ''HP:0000855'' returns 6 rows, led by CMP-ADI-IR (12 of 12 cases, 0 of 14 controls); CMP-LIV-MASH carries it in 7 of 10 cases and 9 of 12 controls.'
    description: A clinical trait or phenotypic abnormality observed in a sample's donor, as a term from the Experimental Factor Ontology (EFO) or from the ontologies EFO draws its traits from (the Human Phenotype Ontology, HP, and MONDO).
    aliases:
      - Trait
      - Clinical feature
      - EFO trait
  Experiment:
    label: Experiment
    properties:
      experimentId:
        type: STRING
        key: true
        description: Identifier of the experiment, unique within the database. e.g. `EXP-ADI-RNA`.
        pattern: ^EXP-[A-Z]{3}-[A-Z]{3}$
      name:
        type: STRING
        description: Human-readable title of the experiment.
      omicsLayer:
        type: STRING
        must_exist: true
        extensions:
          custom:
            relate-examples:
              extract: true
              ask: the molecular layer the experiment measures, transcriptomics or proteomics
        description: 'Molecular layer the experiment measures: `transcriptomics` (mRNA abundance, recorded on genes) or `proteomics` (protein abundance, recorded on proteins). e.g. `transcriptomics`.'
        one_of:
          - transcriptomics
          - proteomics
      platform:
        type: STRING
        extensions:
          custom:
            relate-examples:
              extract: true
              ask: the instrument model the experiment ran on, such as Orbitrap Exploris 480 or Q Exactive HF
        description: Instrument the experiment ran on, as the manufacturer's model name. e.g. `Illumina NovaSeq 6000`.
      method:
        type: STRING
        description: Library preparation or acquisition method, such as poly(A) RNA-seq, TMT labelling, label-free data-dependent acquisition (DDA) or DIA-PASEF. Quantities from different methods are not directly comparable. e.g. `poly(A) RNA-seq`.
    extensions:
      display:
        x: 30
        'y': -130
        colour: '#7c3aed'
      custom:
        relate-examples:
          ask: one omics profiling run, RNA-seq or proteomics, named by an experiment code beginning EXP-, such as EXP-ADI-RNA
          proper: true
          propose: true
    description: 'One omics profiling run: a set of samples assayed together on one platform with one method, producing a quantity for every gene (transcriptomics) or protein (proteomics) it detects.'
    aliases:
      - Assay
      - Omics dataset
  Comparison:
    label: Comparison
    properties:
      comparisonId:
        type: STRING
        key: true
        description: Identifier of the comparison, unique within the database. e.g. `CMP-ADI-METS`.
        pattern: ^CMP-[A-Z]{3}-[A-Z0-9]+$
      name:
        type: STRING
        description: Human-readable description of the contrast, cases first.
      comparisonType:
        type: STRING
        description: 'Design of the contrast, in snake case: for example `disease_vs_control`, `disease_severity` (more against less severe disease) or `phenotype_stratified` (donors with against without a phenotype). e.g. `disease_vs_control`.'
    extensions:
      display:
        x: -45
        'y': -45
        colour: '#d97706'
      custom:
        relate-examples:
          ask: a case-control differential analysis, named by a comparison code beginning CMP-, such as CMP-ADI-METS
          proper: true
          propose: true
        tools:
          - type: canonicalQuery
            name: comparison-overview
            question: Comparison overview
            description: Lists every comparison with its design, tissue, studied disease, the experiments it analysed, the size of its case and control groups, and how many genes and proteins it found changed beyond the cutoffs.
            cypher: |-
              MATCH (c:Comparison)
              RETURN c.comparisonId AS comparisonId, c.name AS comparison, c.comparisonType AS design,
                     COLLECT { MATCH (c)-[:INCLUDES]->(:Sample)-[:TAKEN_FROM]->(t:Tissue) RETURN DISTINCT t.name AS tissue ORDER BY tissue } AS tissues,
                     COLLECT { MATCH (c)-[:STUDIES_DISEASE]->(d:Disease) RETURN d.name AS disease ORDER BY disease } AS diseases,
                     COLLECT { MATCH (c)-[:COMPARES]->(e:Experiment)
                               RETURN e.omicsLayer + ': ' + e.platform + ' (' + e.method + ')' AS experiment ORDER BY experiment } AS experiments,
                     COUNT { (c)-[:INCLUDES {group: 'case'}]->(:Sample) } AS cases,
                     COUNT { (c)-[:INCLUDES {group: 'control'}]->(:Sample) } AS controls,
                     COUNT { (c)-[r:FOUND_DIFFERENTIAL]->(:Gene) WHERE r.adjPValue <= $maxAdjP AND abs(r.logFC) >= $minAbsLogFC } AS changedGenes,
                     COUNT { (c)-[r:FOUND_DIFFERENTIAL]->(:Protein) WHERE r.adjPValue <= $maxAdjP AND abs(r.logFC) >= $minAbsLogFC } AS changedProteins
              ORDER BY comparisonId
            parameters:
              - name: maxAdjP
                type: FLOAT
                description: Largest Benjamini-Hochberg adjusted p-value (false discovery rate) counted as changed. Start at 0.05, the conventional false discovery rate.
                example: 0.05
              - name: minAbsLogFC
                type: INTEGER
                description: Smallest absolute log2 fold change counted as changed. Start at 1, a twofold change.
                example: 1
            category: query
            teaches: 'The entry point: run it first to choose a comparisonId for the other queries and to see which comparisons have both omics layers. A comparison with no transcriptomics experiment can never return concordant changes. Changed counts are transcript and protein results separately, not genes changed in both.'
            returns: 'One row per comparison: comparisonId, comparison, design, tissues, diseases, experiments (layer, platform and method), cases, controls, changedGenes, changedProteins.'
            prerequisites: None beyond the imported reference ontology.
            tags:
              - overview
              - comparison
              - study design
              - differential expression
            upstream:
              file: QUERIES.md
              heading: Comparison overview
              sample: 'Bundled sample data only: $maxAdjP = 0.05, $minAbsLogFC = 1 returns 6 rows; CMP-LIV-MASLD has 22 cases, 8 controls, 22 changed genes and 23 changed proteins, and CMP-LIV-DIA has no transcriptomics experiment and 0 changed genes.'
          - type: canonicalQuery
            name: concordant-transcript-and-protein-changes
            question: Concordant transcript and protein changes
            description: 'Finds genes whose transcript and protein both changed beyond the cutoffs in the same direction in one comparison: the highest-confidence multi-omics signal.'
            cypher: |-
              MATCH (c:Comparison {comparisonId: $comparisonId})-[rna:FOUND_DIFFERENTIAL]->(g:Gene)-[:CODES]->(p:Protein)<-[prot:FOUND_DIFFERENTIAL]-(c)
              WHERE rna.adjPValue <= $maxAdjP AND prot.adjPValue <= $maxAdjP
                AND abs(rna.logFC) >= $minAbsLogFC AND abs(prot.logFC) >= $minAbsLogFC
                AND sign(rna.logFC) = sign(prot.logFC)
              RETURN g.symbol AS gene, p.uniprotId AS protein, CASE WHEN rna.logFC > 0 THEN 'up' ELSE 'down' END AS direction,
                     rna.logFC AS transcriptLogFC, prot.logFC AS proteinLogFC,
                     rna.adjPValue AS transcriptAdjP, prot.adjPValue AS proteinAdjP
              ORDER BY abs(transcriptLogFC + proteinLogFC) DESC, gene
            parameters:
              - name: comparisonId
                type: STRING
                description: The comparison to read, from the Comparison overview query.
                example: CMP-LIV-MASLD
              - name: maxAdjP
                type: FLOAT
                description: Largest adjusted p-value accepted in each layer. Start at 0.05.
                example: 0.05
              - name: minAbsLogFC
                type: INTEGER
                description: Smallest absolute log2 fold change accepted in each layer. Start at 1.
                example: 1
            category: query
            teaches: The headline multi-omics question. Both layers share one relationship type, so one pattern from the comparison reaches the gene, follows CODES to its protein and returns to the comparison. Agreement between layers raises confidence that a change is real and functional, but it is not evidence of causation. Loosen minAbsLogFC towards 0.58 (1.5-fold) for a longer list.
            returns: 'One row per gene: gene, protein (UniProt accession), direction (''up'' or ''down'', cases over controls), transcriptLogFC, proteinLogFC, transcriptAdjP, proteinAdjP. Ordered by the mean of the two fold changes, largest absolute first.'
            prerequisites: The comparison must compare a transcriptomics and a proteomics experiment.
            tags:
              - concordance
              - multi-omics
              - transcriptomics
              - proteomics
              - signature
            upstream:
              file: QUERIES.md
              heading: Concordant transcript and protein changes
              sample: 'Bundled sample data only: $comparisonId = ''CMP-LIV-MASLD'' returns 15 rows: 11 up, led by PLIN2 (2.6 transcript, 2.9 protein) and CD36, and 4 down (ADH4, ACADL, PPARA, CPT1A).'
          - type: canonicalQuery
            name: post-transcriptional-candidates
            question: Post-transcriptional candidates
            description: 'Finds proteins that changed beyond the cutoffs in a comparison while their gene''s transcript, measured in the same comparison, did not change or changed the opposite way: candidates for regulation after transcription, such as altered translation or protein turnover.'
            cypher: |-
              MATCH (c:Comparison {comparisonId: $comparisonId})-[prot:FOUND_DIFFERENTIAL]->(p:Protein)<-[:CODES]-(g:Gene)
              WHERE prot.adjPValue <= $maxAdjP AND abs(prot.logFC) >= $minAbsLogFC
              MATCH (c)-[:COMPARES]->(:Experiment {omicsLayer: 'transcriptomics'})-[hv:HAS_VALUE]->(g)
              OPTIONAL MATCH (c)-[rna:FOUND_DIFFERENTIAL]->(g)
              WITH g, p, prot, hv, rna,
                   CASE WHEN rna IS NULL OR rna.adjPValue > $maxAdjP THEN 'transcript unchanged'
                        WHEN sign(rna.logFC) <> sign(prot.logFC) THEN 'opposite direction' END AS pattern
              WHERE pattern IS NOT NULL
              RETURN g.symbol AS gene, p.uniprotId AS protein, pattern,
                     prot.logFC AS proteinLogFC, prot.adjPValue AS proteinAdjP,
                     rna.logFC AS transcriptLogFC, rna.adjPValue AS transcriptAdjP, hv.baseMean AS transcriptBaseMean
              ORDER BY abs(proteinLogFC) DESC, gene
            parameters:
              - name: comparisonId
                type: STRING
                description: The comparison to read.
                example: CMP-LIV-MASLD
              - name: maxAdjP
                type: FLOAT
                description: Largest adjusted p-value for a significant change, in either layer. Start at 0.05.
                example: 0.05
              - name: minAbsLogFC
                type: INTEGER
                description: Smallest absolute protein log2 fold change. Start at 1.
                example: 1
            category: query
            teaches: 'The HAS_VALUE match is the point of the query: without it a protein whose transcript was never measured, such as a circulating protein carried into the tissue by blood, would look post-transcriptional. A transcript that moved in the same direction at any significant size is excluded, however small. Treat each row as a lead for follow-up, since measurement noise and timing differences between layers also produce discordance.'
            returns: 'One row per protein: gene, protein, pattern (''transcript unchanged'' or ''opposite direction''), proteinLogFC, proteinAdjP, transcriptLogFC and transcriptAdjP (null where the transcript did not reach the nominal cutoff), and transcriptBaseMean, proof the transcript was measured.'
            prerequisites: The comparison must compare a transcriptomics and a proteomics experiment.
            tags:
              - post-transcriptional
              - discordance
              - proteomics
              - translation
              - turnover
            upstream:
              file: QUERIES.md
              heading: Post-transcriptional candidates
              sample: 'Bundled sample data only: $comparisonId = ''CMP-LIV-MASLD'' returns 6 rows: SQSTM1 (protein 1.8), FABP1, APOB, PTEN and SOD2 with the transcript unchanged, and LPL in the opposite direction (transcript 1.2, protein -1.1).'
          - type: canonicalQuery
            name: novel-targets-among-concordant-changes
            question: Novel targets among concordant changes
            description: 'Finds genes concordantly changed in a comparison, in both transcript and protein, that have no association with the comparison''s studied disease at or above a score: changes the existing disease knowledge does not explain.'
            cypher: |-
              MATCH (c:Comparison {comparisonId: $comparisonId})-[:STUDIES_DISEASE]->(d:Disease)
              MATCH (c)-[rna:FOUND_DIFFERENTIAL]->(g:Gene)-[:CODES]->(p:Protein)<-[prot:FOUND_DIFFERENTIAL]-(c)
              WHERE rna.adjPValue <= $maxAdjP AND prot.adjPValue <= $maxAdjP
                AND abs(rna.logFC) >= $minAbsLogFC AND abs(prot.logFC) >= $minAbsLogFC
                AND sign(rna.logFC) = sign(prot.logFC)
              OPTIONAL MATCH (g)-[r:RELATED_TO]->(d)
              WITH g, d, rna, prot, r
              WHERE r IS NULL OR r.score < $minScore
              RETURN g.symbol AS gene, d.name AS disease, rna.logFC AS transcriptLogFC, prot.logFC AS proteinLogFC,
                     r.score AS existingScore,
                     COLLECT { MATCH (g)-[o:RELATED_TO]->(od:Disease) WHERE o.score >= $minScore RETURN od.name AS name ORDER BY name } AS otherDiseases
              ORDER BY abs(transcriptLogFC + proteinLogFC) DESC, gene
            parameters:
              - name: comparisonId
                type: STRING
                description: The comparison to read. It must study a disease.
                example: CMP-LIV-MASLD
              - name: maxAdjP
                type: FLOAT
                description: Largest adjusted p-value accepted in each layer. Start at 0.05.
                example: 0.05
              - name: minAbsLogFC
                type: INTEGER
                description: Smallest absolute log2 fold change accepted in each layer. Start at 1.
                example: 1
              - name: minScore
                type: FLOAT
                description: Association score at or above which a gene counts as already known for the disease. Start at 0.3, a starting point with no strong prior; raise it to treat weakly supported associations as novel too.
                example: 0.3
            category: query
            teaches: 'A target-discovery shortlist. otherDiseases is context: a gene already linked to a related disease is a less surprising lead than one with no associations. No row means every concordant gene is already known for the disease, or the comparison studies no disease.'
            returns: 'One row per gene and studied disease: gene, disease, transcriptLogFC, proteinLogFC, existingScore (null when there is no association at all), and otherDiseases the gene is associated with at or above minScore.'
            prerequisites: The comparison must compare a transcriptomics and a proteomics experiment, and study at least one disease.
            tags:
              - target discovery
              - novelty
              - disease association
              - concordance
            upstream:
              file: QUERIES.md
              heading: Novel targets among concordant changes
              sample: 'Bundled sample data only: $comparisonId = ''CMP-LIV-MASLD'', $minScore = 0.3 returns 6 rows: CXCL10, ACADL, ADH4, PIK3CG, TIMP1 with no MASLD association, and CPT1A with a weak one (0.22).'
          - type: canonicalQuery
            name: concordant-changes-shared-across-tissues
            question: Concordant changes shared across tissues
            description: 'Finds genes concordantly changed, in both transcript and protein, in comparisons drawn from at least a given number of different tissues: a candidate systemic signature.'
            cypher: |-
              MATCH (c:Comparison)-[rna:FOUND_DIFFERENTIAL]->(g:Gene)-[:CODES]->(p:Protein)<-[prot:FOUND_DIFFERENTIAL]-(c)
              WHERE rna.adjPValue <= $maxAdjP AND prot.adjPValue <= $maxAdjP
                AND abs(rna.logFC) >= $minAbsLogFC AND abs(prot.logFC) >= $minAbsLogFC
                AND sign(rna.logFC) = sign(prot.logFC)
              MATCH (c)-[:INCLUDES]->(:Sample)-[:TAKEN_FROM]->(t:Tissue)
              WITH g, collect(DISTINCT t.name) AS tissues,
                   collect(DISTINCT c.comparisonId + CASE WHEN rna.logFC > 0 THEN ' (up)' ELSE ' (down)' END) AS comparisons
              WHERE size(tissues) >= $minTissues
              RETURN g.symbol AS gene, size(tissues) AS tissueCount, tissues, comparisons
              ORDER BY tissueCount DESC, size(comparisons) DESC, gene
            parameters:
              - name: maxAdjP
                type: FLOAT
                description: Largest adjusted p-value accepted in each layer. Start at 0.05.
                example: 0.05
              - name: minAbsLogFC
                type: INTEGER
                description: Smallest absolute log2 fold change accepted in each layer. Start at 1.
                example: 1
              - name: minTissues
                type: INTEGER
                description: Fewest distinct tissues. Start at 2, the least that makes a change cross-tissue.
                example: 2
            category: query
            teaches: 'A comparison''s tissue is read from the samples it includes. Several comparisons from one tissue count once, so a gene changed in two liver comparisons does not qualify. Check the directions: the same gene changed in opposite directions in different tissues is a tissue-specific response, not a shared signature. The two lists are collected without an order.'
            returns: 'One row per gene: gene, tissueCount, tissues, and comparisons, each as "comparisonId (up|down)". Ordered by tissueCount, then number of comparisons.'
            prerequisites: None beyond the imported reference ontology.
            tags:
              - cross-tissue
              - systemic
              - signature
              - concordance
              - replication
            upstream:
              file: QUERIES.md
              heading: Concordant changes shared across tissues
              sample: 'Bundled sample data only: $minTissues = 2 returns 4 rows: PIK3CG in 3 tissues (liver, islet, visceral adipose), then CCL2, SPP1 and CD36 in liver and visceral adipose.'
          - type: canonicalQuery
            name: pathways-with-concordant-changes
            question: Pathways with concordant changes
            description: Counts, for each pathway, the participating proteins whose gene changed concordantly in transcript and protein in a comparison, as a share of the pathway's participants, and flags pathways curated knowledge links to the comparison's studied disease.
            cypher: |-
              MATCH (c:Comparison {comparisonId: $comparisonId})-[rna:FOUND_DIFFERENTIAL]->(g:Gene)-[:CODES]->(p:Protein)<-[prot:FOUND_DIFFERENTIAL]-(c)
              WHERE rna.adjPValue <= $maxAdjP AND prot.adjPValue <= $maxAdjP
                AND abs(rna.logFC) >= $minAbsLogFC AND abs(prot.logFC) >= $minAbsLogFC
                AND sign(rna.logFC) = sign(prot.logFC)
              MATCH (p)-[:PARTICIPATES_IN]->(pw:Pathway)
              WITH c, pw, collect(DISTINCT g.symbol) AS genes
              WHERE size(genes) >= $minGenes
              WITH c, pw, genes, COUNT { (pw)<-[:PARTICIPATES_IN]-(:Protein) } AS members
              RETURN pw.name AS pathway, pw.pathwayId AS pathwayId, size(genes) AS hits, members,
                     round(toFloat(size(genes)) / members, 3) AS hitFraction, genes,
                     EXISTS { (c)-[:STUDIES_DISEASE]->(:Disease)-[:INVOLVES_PATHWAY]->(pw) } AS linkedToStudiedDisease
              ORDER BY hitFraction DESC, hits DESC, pathway
            parameters:
              - name: comparisonId
                type: STRING
                description: The comparison to read.
                example: CMP-LIV-MASLD
              - name: maxAdjP
                type: FLOAT
                description: Largest adjusted p-value accepted in each layer. Start at 0.05.
                example: 0.05
              - name: minAbsLogFC
                type: INTEGER
                description: Smallest absolute log2 fold change accepted in each layer. Start at 1.
                example: 1
              - name: minGenes
                type: INTEGER
                description: Fewest concordant genes in a pathway. Start at 2; a single hit is not a pathway-level signal.
                example: 2
            category: query
            teaches: 'An overlap ranking, not a statistical enrichment test: it has no p-value and no background correction. For a formal test, take hits, members, the number of concordant genes and the number of genes measured to a hypergeometric or gene-set test outside the graph. Small pathways reach high fractions easily; read hits alongside the fraction.'
            returns: 'One row per pathway: pathway, pathwayId, hits, members, hitFraction, genes, linkedToStudiedDisease (true when the comparison''s disease INVOLVES_PATHWAY it). Ordered by hitFraction, then hits.'
            prerequisites: The comparison must compare a transcriptomics and a proteomics experiment.
            tags:
              - pathway
              - enrichment
              - Reactome
              - concordance
              - mechanism
            upstream:
              file: QUERIES.md
              heading: Pathways with concordant changes
              sample: 'Bundled sample data only: $comparisonId = ''CMP-LIV-MASLD'' returns 6 rows, led by PPARA activates gene expression (4 of 10 members) and Regulation of lipid metabolism by PPARalpha (5 of 14), both linked to MASLD.'
    description: 'A statistical contrast between case and control samples: a differential expression or differential abundance analysis, whose results are the genes and proteins it finds changed.'
    aliases:
      - Contrast
      - Differential analysis
  Gene:
    label: Gene
    properties:
      ensemblId:
        type: STRING
        key: true
        description: Ensembl stable gene ID for the human gene, without a version suffix. e.g. `ENSG00000075624`.
        pattern: ^ENSG[0-9]{11}$
      symbol:
        type: STRING
        must_exist: true
        description: HGNC-approved gene symbol. e.g. `ACTB`.
      name:
        type: STRING
        description: HGNC-approved gene name.
      hgncId:
        type: STRING
        description: 'HGNC identifier: `HGNC:` followed by digits. e.g. `HGNC:132`.'
        pattern: ^HGNC:[0-9]+$
      ncbiGeneId:
        type: STRING
        description: NCBI Gene (Entrez Gene) identifier, digits only. Held as text, since it is an identifier rather than a number. e.g. `60`.
        pattern: ^[0-9]+$
    extensions:
      display:
        x: -45
        'y': 55
        colour: '#059669'
      custom:
        relate-examples:
          ask: a gene or its transcript, named by its HGNC symbol of capitals and digits, such as ACTB, INSR or IRS1
          proper: true
        tools:
          - type: canonicalQuery
            name: disease-associations-of-a-gene
            question: Disease associations of a gene
            description: Lists every disease a gene is associated with, with the association score and evidence type, and the comparisons studying that disease in which the gene's transcript or protein changed beyond the cutoffs.
            cypher: |-
              MATCH (g:Gene {symbol: $symbol})-[r:RELATED_TO]->(d:Disease)
              RETURN g.symbol AS gene, d.mondoId AS mondoId, d.name AS disease, r.score AS score, r.evidenceType AS evidenceType,
                     COLLECT {
                       MATCH (d)<-[:STUDIES_DISEASE]-(c:Comparison)-[fd:FOUND_DIFFERENTIAL]->(f)
                       WHERE (f = g OR (g)-[:CODES]->(f)) AND fd.adjPValue <= $maxAdjP AND abs(fd.logFC) >= $minAbsLogFC
                       RETURN c.comparisonId + CASE WHEN f:Gene THEN ' transcript ' ELSE ' protein ' END + toString(fd.logFC) AS change
                       ORDER BY change
                     } AS changes
              ORDER BY score DESC, disease
            parameters:
              - name: symbol
                type: STRING
                description: HGNC gene symbol, e.g. 'PPARG'.
                example: PPARG
              - name: maxAdjP
                type: FLOAT
                description: Largest adjusted p-value counted as changed. Start at 0.05.
                example: 0.05
              - name: minAbsLogFC
                type: INTEGER
                description: Smallest absolute log2 fold change counted as changed. Start at 1.
                example: 1
            category: query
            teaches: 'A safety and indication check before choosing a target: associations outside the disease of interest are possible off-target liabilities or repurposing leads. Scores from different resources are not on one scale; compare them within a source only. An empty changes list means no comparison of that disease showed the gene changed, or none studies it.'
            returns: 'One row per associated disease: gene, mondoId, disease, score (0-1), evidenceType, and changes, a list of "comparisonId layer logFC" entries for comparisons that study the disease. Ordered by score, highest first.'
            prerequisites: None beyond the imported reference ontology.
            tags:
              - gene
              - disease association
              - safety
              - off-target
              - indication
            upstream:
              file: QUERIES.md
              heading: Disease associations of a gene
              sample: 'Bundled sample data only: $symbol = ''PPARG'' returns 6 rows, from type 2 diabetes mellitus (0.89) to breast cancer (0.3); only the MASLD row has changes, transcript 1.6 and protein 1.3 in CMP-LIV-MASLD.'
          - type: canonicalQuery
            name: evidence-trail-for-a-gene-in-a-comparison
            question: Evidence trail for a gene in a comparison
            description: 'Shows, layer by layer, the evidence behind a gene''s result in one comparison: each experiment the comparison analysed, its platform and method, how many of the comparison''s cases and controls it assayed, whether it detected the gene or protein and at what abundance, and the differential result.'
            cypher: |-
              MATCH (c:Comparison {comparisonId: $comparisonId})-[:COMPARES]->(e:Experiment)
              MATCH (g:Gene {symbol: $symbol})-[:CODES]->(p:Protein)
              WITH c, e, CASE WHEN e.omicsLayer = 'transcriptomics' THEN g ELSE p END AS f
              OPTIONAL MATCH (e)-[hv:HAS_VALUE]->(f)
              OPTIONAL MATCH (c)-[fd:FOUND_DIFFERENTIAL]->(f)
              RETURN DISTINCT c.comparisonId AS comparisonId, e.experimentId AS experimentId, e.omicsLayer AS omicsLayer,
                     e.platform AS platform, e.method AS method,
                     COUNT { (c)-[:INCLUDES {group: 'case'}]->(:Sample)-[:HAS_EXPERIMENT]->(e) } AS casesAssayed,
                     COUNT { (c)-[:INCLUDES {group: 'control'}]->(:Sample)-[:HAS_EXPERIMENT]->(e) } AS controlsAssayed,
                     hv IS NOT NULL AS measured, hv.baseMean AS baseMean, hv.intensity AS intensity, hv.peptides AS peptides,
                     hv.coverage AS coverage, fd.logFC AS logFC, fd.pValue AS pValue, fd.adjPValue AS adjPValue
              ORDER BY omicsLayer DESC, experimentId
            parameters:
              - name: symbol
                type: STRING
                description: HGNC gene symbol, e.g. 'PIK3CG'.
                example: PIK3CG
              - name: comparisonId
                type: STRING
                description: The comparison to read.
                example: CMP-LIV-MASLD
            category: query
            teaches: Use before reporting any finding, to show what it rests on. Low peptide counts or low coverage make a protein result fragile; an experiment that assayed only part of the comparison's samples has less power than the group sizes suggest.
            returns: 'One row per experiment the comparison analysed (and per protein, for a gene with several): comparisonId, experimentId, omicsLayer, platform, method, casesAssayed, controlsAssayed, measured (true or false), baseMean (transcriptomics), intensity, peptides and coverage (proteomics), logFC, pValue, adjPValue. A null logFC with measured true means tested but below the nominal cutoff.'
            prerequisites: None beyond the imported reference ontology.
            tags:
              - provenance
              - evidence
              - experiment
              - platform
              - quality
            upstream:
              file: QUERIES.md
              heading: Evidence trail for a gene in a comparison
              sample: 'Bundled sample data only: $symbol = ''PIK3CG'', $comparisonId = ''CMP-LIV-MASLD'' returns 2 rows: EXP-LIV-RNA (22 cases, 8 controls, logFC 1.4) and EXP-LIV-TMT (5 peptides, coverage 13.1, logFC 1.2).'
          - type: canonicalQuery
            name: interaction-partners-of-a-gene
            question: Interaction partners of a gene
            description: Lists the interaction partners of the protein a gene encodes, above a confidence score, with each partner's protein result in a comparison.
            cypher: |-
              MATCH (g:Gene {symbol: $symbol})-[:CODES]->(p:Protein)-[i:INTERACTS_WITH]-(n:Protein)<-[:CODES]-(ng:Gene)
              WHERE i.score >= $minScore
              OPTIONAL MATCH (:Comparison {comparisonId: $comparisonId})-[fd:FOUND_DIFFERENTIAL]->(n)
              RETURN g.symbol AS gene, ng.symbol AS partner, n.uniprotId AS partnerProtein, i.score AS score,
                     fd.logFC AS partnerProteinLogFC, fd.adjPValue AS partnerProteinAdjP
              ORDER BY score DESC, partner
            parameters:
              - name: symbol
                type: STRING
                description: HGNC gene symbol, e.g. 'PIK3CG'.
                example: PIK3CG
              - name: minScore
                type: FLOAT
                description: Smallest interaction score, 0-1. Start at 0.7, STRING's high-confidence band; 0.4 is its medium band.
                example: 0.7
              - name: comparisonId
                type: STRING
                description: The comparison whose protein results to show alongside each partner.
                example: CMP-LIV-MASLD
            category: query
            teaches: 'The first step from a single hit to its network: a target whose partners also change is more likely to sit in an affected pathway. The partner result is shown at the nominal cutoff, with no adjusted p-value filter, so read partnerProteinAdjP before calling a partner changed.'
            returns: 'One row per partner: gene, partner, partnerProtein, score, partnerProteinLogFC and partnerProteinAdjP (null when the partner protein had no result in the comparison). Ordered by score, highest first.'
            prerequisites: None beyond the imported reference ontology.
            tags:
              - protein interaction
              - PPI
              - STRING
              - network
              - neighbourhood
            upstream:
              file: QUERIES.md
              heading: Interaction partners of a gene
              sample: 'Bundled sample data only: $symbol = ''PIK3CG'', $minScore = 0.7, $comparisonId = ''CMP-LIV-MASLD'' returns 6 rows, PIK3R1 (0.95) to RAC1 (0.73); PTEN carries a protein logFC of -1.2.'
          - type: canonicalQuery
            name: changed-proteins-within-two-interaction-hops
            question: Changed proteins within two interaction hops
            description: 'From the protein a gene encodes, walks the interaction network up to two hops through interactions at or above a score, and returns the proteins reached that changed beyond the cutoffs in a comparison: a candidate module of co-changed proteins around a target.'
            cypher: |-
              MATCH (g:Gene {symbol: $symbol})-[:CODES]->(p:Protein)
              MATCH path = (p)-[:INTERACTS_WITH*1..2]-(n:Protein)
              WHERE n <> p AND all(r IN relationships(path) WHERE r.score >= $minScore)
              MATCH (:Comparison {comparisonId: $comparisonId})-[fd:FOUND_DIFFERENTIAL]->(n)
              WHERE fd.adjPValue <= $maxAdjP AND abs(fd.logFC) >= $minAbsLogFC
              WITH g, n, fd, min(length(path)) AS hops
              MATCH (ng:Gene)-[:CODES]->(n)
              RETURN g.symbol AS gene, ng.symbol AS changedPartner, n.uniprotId AS partnerProtein, hops,
                     fd.logFC AS proteinLogFC, fd.adjPValue AS proteinAdjP
              ORDER BY hops, abs(proteinLogFC) DESC, changedPartner
            parameters:
              - name: symbol
                type: STRING
                description: HGNC gene symbol of the starting gene, e.g. 'CD36'.
                example: CD36
              - name: comparisonId
                type: STRING
                description: The comparison whose protein results to use.
                example: CMP-LIV-MASLD
              - name: minScore
                type: FLOAT
                description: Smallest score accepted on every hop. Start at 0.7, STRING's high-confidence band.
                example: 0.7
              - name: maxAdjP
                type: FLOAT
                description: Largest adjusted p-value accepted. Start at 0.05.
                example: 0.05
              - name: minAbsLogFC
                type: INTEGER
                description: Smallest absolute protein log2 fold change. Start at 1.
                example: 1
            category: query
            teaches: 'Every hop must meet minScore, so a protein reachable only through a weak interaction is left out. Two hops is the bound: interaction networks are small-world, and a third hop reaches much of the network and stops meaning anything. Lowering minScore widens the result fast; change it in small steps.'
            returns: 'One row per changed protein reached: gene, changedPartner, partnerProtein, hops (1 or 2, the shortest qualifying walk), proteinLogFC, proteinAdjP. Never the starting protein. Ordered by hops, then size of change.'
            prerequisites: None beyond the imported reference ontology.
            tags:
              - protein interaction
              - network expansion
              - module
              - co-target
            upstream:
              file: QUERIES.md
              heading: Changed proteins within two interaction hops
              sample: 'Bundled sample data only: $symbol = ''CD36'', $comparisonId = ''CMP-LIV-MASLD'' returns 6 rows: PLIN2 and LPL at 1 hop, then SCD, FABP1, APOB and PPARG at 2.'
    description: 'A protein-coding gene, identified by its Ensembl stable gene ID: the unit transcriptomics measures and the unit disease associations attach to.'
  Protein:
    label: Protein
    properties:
      uniprotId:
        type: STRING
        key: true
        description: UniProtKB accession, without an isoform suffix. e.g. `P60709`.
        pattern: ^([OPQ][0-9][A-Z0-9]{3}[0-9]|[A-NR-Z][0-9]([A-Z][A-Z0-9]{2}[0-9]){1,2})$
      name:
        type: STRING
        description: UniProt recommended protein name.
    extensions:
      display:
        x: 85
        'y': 55
        colour: '#dc2626'
      custom:
        relate-examples:
          ask: a protein named by its UniProt accession, such as P60709, or by its protein name, such as Actin; never a gene symbol
          proper: true
          propose: true
    description: 'A protein, identified by its UniProtKB accession for the reviewed, canonical entry of the gene that encodes it: the unit proteomics measures, annotates and connects in interaction networks.'
    aliases:
      - Gene product
      - Protein group
  Disease:
    label: Disease
    properties:
      mondoId:
        type: STRING
        key: true
        description: 'MONDO term CURIE: `MONDO:` followed by seven digits. e.g. `MONDO:0005311`.'
        pattern: ^MONDO:[0-9]{7}$
      name:
        type: STRING
        description: 'MONDO label of the disease. MONDO follows current nomenclature: metabolic dysfunction-associated steatotic liver disease (MASLD) is the term for what was called non-alcoholic fatty liver disease (NAFLD), and MASH for non-alcoholic steatohepatitis (NASH).'
    extensions:
      display:
        x: -170
        'y': 55
        colour: '#9333ea'
      custom:
        relate-examples:
          ask: a disease, often written as a capitalised acronym such as MASH or T2D, or in full such as type 1 diabetes mellitus
        tools:
          - type: canonicalQuery
            name: protein-changes-replicated-across-platforms
            question: Protein changes replicated across platforms
            description: For a disease, finds proteins that changed beyond the cutoffs in the same direction in comparisons whose proteomics ran on different instrument platforms.
            cypher: |-
              MATCH (d:Disease {mondoId: $mondoId})<-[:STUDIES_DISEASE]-(c:Comparison)-[fd:FOUND_DIFFERENTIAL]->(p:Protein)
              WHERE fd.adjPValue <= $maxAdjP AND abs(fd.logFC) >= $minAbsLogFC
              MATCH (c)-[:COMPARES]->(e:Experiment {omicsLayer: 'proteomics'})
              MATCH (g:Gene)-[:CODES]->(p)
              WITH g, p, CASE WHEN fd.logFC > 0 THEN 'up' ELSE 'down' END AS direction,
                   collect(DISTINCT e.platform) AS platforms, collect(DISTINCT c.comparisonId + ': ' + toString(fd.logFC)) AS results
              WHERE size(platforms) >= $minPlatforms
              RETURN g.symbol AS gene, p.uniprotId AS protein, direction, platforms, results
              ORDER BY gene, direction
            parameters:
              - name: mondoId
                type: STRING
                description: MONDO CURIE of the disease, e.g. 'MONDO:0013209'.
                example: MONDO:0013209
              - name: maxAdjP
                type: FLOAT
                description: Largest adjusted p-value accepted. Start at 0.05.
                example: 0.05
              - name: minAbsLogFC
                type: INTEGER
                description: Smallest absolute log2 fold change accepted. Start at 1.
                example: 1
              - name: minPlatforms
                type: INTEGER
                description: Fewest distinct platforms. Start at 2, the least that makes a change replicated.
                example: 2
            category: query
            teaches: Proteomics platforms and methods (TMT labelling, label-free, data-independent acquisition) differ in depth and bias; a change seen on two of them is less likely to be a platform artefact. Compare fold changes, never the raw HAS_VALUE intensities, across platforms. The platform is read from the comparison's proteomics experiment, so a comparison that combines several proteomics experiments counts each of their platforms.
            returns: 'One row per protein and direction: gene, protein, direction, platforms, and results, each as "comparisonId: logFC". Ordered by gene.'
            prerequisites: None beyond the imported reference ontology.
            tags:
              - replication
              - proteomics
              - platform
              - batch effect
              - robustness
            upstream:
              file: QUERIES.md
              heading: Protein changes replicated across platforms
              sample: 'Bundled sample data only: $mondoId = ''MONDO:0013209'' returns 7 rows, each seen on Orbitrap Fusion Lumos and timsTOF Pro: ACADL, CD36, CPT1A, FASN, PLIN2, SCD, SQSTM1.'
          - type: canonicalQuery
            name: candidate-genes-sharing-processes-with-disease-genes
            question: Candidate genes sharing processes with disease genes
            description: 'Finds genes not associated with a disease whose proteins share Gene Ontology biological processes with the disease''s known genes, and that changed beyond the cutoffs in a comparison studying the disease: guilt by association, backed by the data.'
            cypher: |-
              MATCH (d:Disease {mondoId: $mondoId})<-[r:RELATED_TO]-(known:Gene)-[:CODES]->(:Protein)-[:ASSOCIATED_WITH]->(t:GOTerm {aspect: 'biological_process'})<-[:ASSOCIATED_WITH]-(:Protein)<-[:CODES]-(cand:Gene)
              WHERE r.score >= $minScore AND cand <> known AND NOT (cand)-[:RELATED_TO]->(d)
              WITH d, cand, collect(DISTINCT t.name) AS sharedProcesses, collect(DISTINCT known.symbol) AS knownGenes
              WHERE size(sharedProcesses) >= $minSharedTerms
              MATCH (d)<-[:STUDIES_DISEASE]-(c:Comparison)-[fd:FOUND_DIFFERENTIAL]->(f)
              WHERE (f = cand OR (cand)-[:CODES]->(f)) AND fd.adjPValue <= $maxAdjP AND abs(fd.logFC) >= $minAbsLogFC
              WITH cand, sharedProcesses, knownGenes,
                   collect(c.comparisonId + CASE WHEN f:Gene THEN ' transcript ' ELSE ' protein ' END + toString(fd.logFC)) AS changes
              RETURN cand.symbol AS candidate, size(sharedProcesses) AS sharedProcessCount, sharedProcesses, knownGenes, changes
              ORDER BY sharedProcessCount DESC, candidate
            parameters:
              - name: mondoId
                type: STRING
                description: MONDO CURIE of the disease, e.g. 'MONDO:0005148'.
                example: MONDO:0013209
              - name: minScore
                type: FLOAT
                description: Association score at or above which a gene counts as known for the disease. Start at 0.5, so "known" means moderately supported; no strong prior.
                example: 0.5
              - name: minSharedTerms
                type: INTEGER
                description: 'Fewest shared biological processes. Start at 2: broad processes link many unrelated genes, and one shared term is weak evidence.'
                example: 2
              - name: maxAdjP
                type: FLOAT
                description: Largest adjusted p-value for the change. Start at 0.05.
                example: 0.05
              - name: minAbsLogFC
                type: INTEGER
                description: Smallest absolute log2 fold change. Start at 1.
                example: 1
            category: query
            teaches: 'Only biological_process terms count; molecular functions and cellular components say little about disease mechanism. A candidate excluded because it has any association with the disease, however weak, is already known. Hypothesis-generating: follow up with literature and orthogonal data before calling any candidate a target.'
            returns: 'One row per candidate: candidate, sharedProcessCount, sharedProcesses, knownGenes it shares them with, and changes ("comparisonId layer logFC"). Ordered by sharedProcessCount, highest first.'
            prerequisites: None beyond the imported reference ontology.
            tags:
              - target discovery
              - Gene Ontology
              - guilt by association
              - candidate
            upstream:
              file: QUERIES.md
              heading: Candidate genes sharing processes with disease genes
              sample: 'Bundled sample data only: $mondoId = ''MONDO:0005148'' returns 1 row: GCG, sharing glucose homeostasis and insulin secretion with known genes, changed in CMP-ISL-T2D (transcript 1.3, protein 1.2).'
    description: A disease or disorder, identified by its MONDO (Mondo Disease Ontology) term, that comparisons study and genes are associated with.
    aliases:
      - Condition
      - Indication
  GOTerm:
    label: GOTerm
    properties:
      goId:
        type: STRING
        key: true
        description: 'GO term CURIE: `GO:` followed by seven digits. e.g. `GO:0006412`.'
        pattern: ^GO:[0-9]{7}$
      name:
        type: STRING
        description: GO label of the term.
      aspect:
        type: STRING
        must_exist: true
        description: The GO aspect, or sub-ontology, the term belongs to. e.g. `biological_process`.
        one_of:
          - biological_process
          - molecular_function
          - cellular_component
    extensions:
      display:
        x: 185
        'y': 130
        colour: '#65a30d'
      custom:
        relate-examples:
          ask: a Gene Ontology term a protein is annotated with, a biological process, function or cellular component, such as translation or GO:0006412
    description: 'A Gene Ontology (GO) term: a biological process, molecular function or cellular component that proteins are annotated with.'
    aliases:
      - GO term
      - Gene Ontology term
  Pathway:
    label: Pathway
    properties:
      pathwayId:
        type: STRING
        key: true
        description: Stable identifier of the pathway in its source database, such as a Reactome stable ID (`R-HSA-` and digits for a human pathway). e.g. `R-HSA-70171`.
        pattern: ^R-HSA-[0-9]+$
      name:
        type: STRING
        description: Name of the pathway in its source database.
      source:
        type: STRING
        description: Pathway database the pathway comes from, such as Reactome, WikiPathways or KEGG. e.g. `Reactome`.
    extensions:
      display:
        x: -45
        'y': 155
        colour: '#ea580c'
      custom:
        relate-examples:
          ask: a Reactome pathway, named by a stable ID beginning R-HSA-, such as R-HSA-70171, or by its title
          proper: true
          propose: true
    description: A curated biological pathway, a connected set of reactions and interactions, that proteins participate in.
relationships:
  projectHasSample:
    type: HAS_SAMPLE
    from:
      node: Project
      min_count: 1
    to:
      node: Sample
      count: 1
    extensions:
      custom:
        relate-examples:
          phrase: collected
    description: The project collected the sample. Every sample belongs to exactly one project; a project has one or more samples.
  sampleTakenFrom:
    type: TAKEN_FROM
    from:
      node: Sample
      count: 1
    to:
      node: Tissue
    extensions:
      custom:
        relate-examples:
          phrase: was taken from
    description: The sample was taken from the tissue. Every sample comes from exactly one tissue; a tissue may be the source of many samples, or of none.
  sampleHasPhenotype:
    type: HAS_PHENOTYPE
    from:
      node: Sample
    to:
      node: Phenotype
    extensions:
      custom:
        relate-examples:
          phrase: shows
    description: The sample's donor showed the phenotype when the sample was taken. A sample may carry several phenotypes or none; a phenotype may be carried by many samples, or by none.
  sampleHasExperiment:
    type: HAS_EXPERIMENT
    from:
      node: Sample
    to:
      node: Experiment
      min_count: 1
    extensions:
      custom:
        relate-examples:
          phrase: was assayed in
    description: The sample was assayed in the experiment. A sample may be assayed in several experiments, typically one per omics layer or platform, or in none; every experiment assays at least one sample.
    aliases:
      - Assayed in
  comparisonCompares:
    type: COMPARES
    from:
      node: Comparison
      min_count: 1
    to:
      node: Experiment
    extensions:
      custom:
        relate-examples:
          phrase: analyzes
    description: 'The comparison analysed data from the experiment: its gene results come from its transcriptomics experiment and its protein results from its proteomics experiment, normally one experiment per omics layer. Every comparison compares at least one experiment; an experiment may feed several comparisons.'
  comparisonIncludes:
    type: INCLUDES
    from:
      node: Comparison
      min_count: 2
    to:
      node: Sample
    properties:
      group:
        type: STRING
        must_exist: true
        description: 'The group the sample belongs to in this comparison: `case` (the condition of interest) or `control` (the reference). Fold changes are cases over controls. e.g. `control`.'
        one_of:
          - case
          - control
    extensions:
      custom:
        relate-examples:
          phrase: includes
    description: The comparison included the sample, in its case or its control group. Every comparison includes at least two samples, at least one in each group; a sample may be included in several comparisons, in a different group in each, or in none.
  comparisonStudiesDisease:
    type: STUDIES_DISEASE
    from:
      node: Comparison
    to:
      node: Disease
    extensions:
      custom:
        relate-examples:
          phrase: studies
    description: 'The comparison studies the disease: its cases have the disease, or a more severe form of it, and its controls do not. A comparison usually studies one disease and may study none (one stratified by a phenotype instead); a disease may be studied by many comparisons, or by none.'
  experimentMeasuresGene:
    type: HAS_VALUE
    from:
      node: Experiment
    to:
      node: Gene
    properties:
      baseMean:
        type: FLOAT
        description: 'Mean of the normalised read counts (DESeq2 size-factor normalised) for the gene across all of the experiment''s samples: how strongly the gene is expressed, not how much it changed. Only on transcriptomics measurements. e.g. `13719.8`.'
    extensions:
      custom:
        relate-examples:
          phrase: detected
    description: The transcriptomics experiment detected and quantified the gene's transcripts. It exists only for genes the experiment detected, so its absence means not measured rather than unchanged. An experiment measures many genes; a gene may be measured by many experiments. The same type links proteomics experiments to proteins, with different properties.
    aliases:
      - Measurement
      - Expression value
  experimentMeasuresProtein:
    type: HAS_VALUE
    from:
      node: Experiment
    to:
      node: Protein
    properties:
      intensity:
        type: FLOAT
        description: Mean normalised protein intensity across the experiment's samples, on a linear scale in arbitrary units. Comparable within one experiment only, not across platforms or methods. Only on proteomics measurements. e.g. `4798627`.
      peptides:
        type: INTEGER
        description: Number of unique peptides identified for the protein in the experiment. Only on proteomics measurements. e.g. `15`.
      coverage:
        type: FLOAT
        description: Percentage of the protein's sequence covered by the identified peptides, from 0 to 100. Only on proteomics measurements. e.g. `45.4`.
    extensions:
      custom:
        relate-examples:
          phrase: detected
    description: The proteomics experiment detected and quantified the protein. It exists only for proteins the experiment detected, so its absence means not measured rather than unchanged. An experiment measures many proteins; a protein may be measured by many experiments. The same type links transcriptomics experiments to genes, with different properties.
    aliases:
      - Measurement
      - Abundance value
  comparisonFoundGene:
    type: FOUND_DIFFERENTIAL
    from:
      node: Comparison
    to:
      node: Gene
    properties:
      logFC:
        type: FLOAT
        must_exist: true
        description: 'Log2 fold change in abundance, cases over controls: positive means higher in cases, and 1 means twofold. e.g. `-0.855`.'
      pValue:
        type: FLOAT
        must_exist: true
        description: Nominal p-value of the comparison's test for this feature; below 0.05 on every stored result. e.g. `4.18e-07`.
      adjPValue:
        type: FLOAT
        must_exist: true
        description: Benjamini-Hochberg adjusted p-value (false discovery rate), corrected across every feature the comparison tested in this omics layer. e.g. `1.95e-05`.
    extensions:
      custom:
        relate-examples:
          phrase: found a change in
    description: The comparison found the gene's transcript abundance different between cases and controls at a nominal p-value below 0.05. Absence of the relationship means the gene was not tested (no HAS_VALUE from the comparison's transcriptomics experiment) or did not reach that cutoff; stricter cutoffs on adjPValue and logFC are the reader's to apply. A comparison may find many genes and a gene may be found by many comparisons, at most once each. The same type links comparisons to proteins, for the proteomics layer, with the same properties.
    aliases:
      - Differential expression result
      - DE result
  comparisonFoundProtein:
    type: FOUND_DIFFERENTIAL
    from:
      node: Comparison
    to:
      node: Protein
    properties:
      logFC:
        type: FLOAT
        description: 'Log2 fold change in abundance, cases over controls: positive means higher in cases, and 1 means twofold. Expected on every FOUND_DIFFERENTIAL relationship. e.g. `-0.524`.'
      pValue:
        type: FLOAT
        description: Nominal p-value of the comparison's test for this feature; below 0.05 on every stored result. Expected on every FOUND_DIFFERENTIAL relationship. e.g. `0.0263`.
      adjPValue:
        type: FLOAT
        description: Benjamini-Hochberg adjusted p-value (false discovery rate), corrected across every feature the comparison tested in this omics layer. Expected on every FOUND_DIFFERENTIAL relationship. e.g. `0.204`.
    extensions:
      custom:
        relate-examples:
          phrase: found a change in
    description: The comparison found the protein's abundance different between cases and controls at a nominal p-value below 0.05. Absence of the relationship means the protein was not tested (no HAS_VALUE from the comparison's proteomics experiment) or did not reach that cutoff; stricter cutoffs on adjPValue and logFC are the reader's to apply. A comparison may find many proteins and a protein may be found by many comparisons, at most once each. The same type links comparisons to genes, for the transcriptomics layer, with the same properties.
    aliases:
      - Differential abundance result
      - DA result
  geneCodesProtein:
    type: CODES
    from:
      node: Gene
    to:
      node: Protein
      count: 1
    extensions:
      custom:
        relate-examples:
          phrase: encodes
    description: The gene encodes the protein. Every protein is encoded by exactly one gene; a gene encodes one or more proteins, or none in the database.
    aliases:
      - Encodes
  geneRelatedToDisease:
    type: RELATED_TO
    from:
      node: Gene
    to:
      node: Disease
    properties:
      score:
        type: FLOAT
        must_exist: true
        description: Overall association score from 0 to 1; higher means stronger evidence. Scores from different resources are not on one scale. e.g. `0.80`.
      evidenceType:
        type: STRING
        description: 'Strongest type of evidence behind the association, in Open Targets'' data-type names: for example `genetic_association`, `known_drug`, `literature`, `animal_model`, `rna_expression`, `affected_pathway` or `somatic_mutation`. e.g. `genetic_association`.'
    extensions:
      custom:
        relate-examples:
          phrase: is associated with
    description: The gene is associated with the disease in curated knowledge (genetic association, a drug target, animal models, the literature), as integrated by resources such as Open Targets or DisGeNET. A gene may be associated with many diseases and a disease with many genes, at most once per pair. No relationship means no recorded association, not evidence against one.
    aliases:
      - Gene-disease association
  proteinAssociatedWithGO:
    type: ASSOCIATED_WITH
    from:
      node: Protein
    to:
      node: GOTerm
    extensions:
      custom:
        relate-examples:
          phrase: is annotated with
    description: The protein is annotated with the Gene Ontology term. A protein may carry many terms, or none; a term may annotate many proteins.
    aliases:
      - GO annotation
  proteinInteractsWith:
    type: INTERACTS_WITH
    from:
      node: Protein
    to:
      node: Protein
    properties:
      score:
        type: FLOAT
        must_exist: true
        description: Combined confidence score of the interaction from 0 to 1 (STRING's combined score divided by 1000). STRING calls 0.7 and above high confidence and 0.4 and above medium. e.g. `0.763`.
    extensions:
      custom:
        relate-examples:
          phrase: interacts with
    description: 'The two proteins interact, physically or functionally, as a protein-protein interaction network such as STRING records. Interaction is symmetric: each pair is stored once, in an arbitrary direction, so read it in both directions. A protein may have many partners, or none.'
    aliases:
      - Protein-protein interaction
      - PPI
  proteinParticipatesIn:
    type: PARTICIPATES_IN
    from:
      node: Protein
    to:
      node: Pathway
    extensions:
      custom:
        relate-examples:
          phrase: participates in
    description: The protein takes part in the pathway. A protein may take part in many pathways, or none; a pathway has many participants.
    aliases:
      - Pathway membership
  diseaseInvolvesPathway:
    type: INVOLVES_PATHWAY
    from:
      node: Disease
    to:
      node: Pathway
    extensions:
      custom:
        relate-examples:
          phrase: involves
    description: Curated knowledge implicates the pathway in the disease's mechanism. A disease may involve many pathways and a pathway may be implicated in many diseases.
