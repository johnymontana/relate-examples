schema: https://neo4j.com/docs/ontology-graph-spec/1.1.0/schema.json
version: '1'
id: legal
name: Legal
description: Cases, matters, contracts, filings, hearings, and counsel for a legal practice or in-house team
nodes:
  Person:
    label: Person
    properties:
      name:
        type: STRING
        must_exist: true
      email:
        type: STRING
      role:
        type: STRING
      description:
        type: STRING
    extensions:
      display:
        x: 0
        'y': -300
        colour: '#22c55e'
        custom:
          caption: name
      custom:
        createContextGraph:pole:
          pole_type: PERSON
          origin: base
        createContextGraph:display:
          icon: user
          size: 20
    description: person
  Organization:
    label: Organization
    properties:
      name:
        type: STRING
        must_exist: true
      description:
        type: STRING
      industry:
        type: STRING
    extensions:
      display:
        x: 150
        'y': -260
        colour: '#3b82f6'
        custom:
          caption: name
      custom:
        createContextGraph:pole:
          pole_type: ORGANIZATION
          origin: base
        createContextGraph:display:
          icon: building
    description: organization
  Location:
    label: Location
    properties:
      name:
        type: STRING
        must_exist: true
      address:
        type: STRING
      latitude:
        type: FLOAT
      longitude:
        type: FLOAT
    extensions:
      display:
        x: 260
        'y': -150
        colour: '#a855f7'
        custom:
          caption: name
      custom:
        createContextGraph:pole:
          pole_type: LOCATION
          origin: base
        createContextGraph:display:
          icon: map-pin
    description: location
  Event:
    label: Event
    properties:
      name:
        type: STRING
        must_exist: true
      date:
        type: ZONED DATETIME
      description:
        type: STRING
    extensions:
      display:
        x: 300
        'y': 0
        colour: '#f97316'
        custom:
          caption: name
      custom:
        createContextGraph:pole:
          pole_type: EVENT
          origin: base
        createContextGraph:display:
          icon: calendar
    description: event
  Object:
    label: Object
    properties:
      name:
        type: STRING
        must_exist: true
      description:
        type: STRING
    extensions:
      display:
        x: 260
        'y': 150
        colour: '#eab308'
        custom:
          caption: name
      custom:
        createContextGraph:pole:
          pole_type: OBJECT
          origin: base
        createContextGraph:display:
          icon: box
    description: object
  Case:
    label: Case
    properties:
      case_number:
        type: STRING
        must_exist: true
        unique: true
      title:
        type: STRING
        must_exist: true
      status:
        type: STRING
        one_of:
          - open
          - discovery
          - trial
          - settled
          - closed
          - appealed
      practice_area:
        type: STRING
        one_of:
          - litigation
          - corporate
          - intellectual_property
          - employment
          - real_estate
          - regulatory
          - criminal
          - family
      filed_date:
        type: DATE
      description:
        type: STRING
    extensions:
      display:
        x: 150
        'y': 260
        colour: '#7c3aed'
        custom:
          caption: name
      custom:
        createContextGraph:pole:
          pole_type: EVENT
          subtype: LEGAL_CASE
          origin: domain
        createContextGraph:display:
          icon: gavel
          size: 30
        tools:
          - type: canonicalQuery
            name: search_case
            description: Search cases by title, case number, or practice area
            cypher: |
              MATCH (c:Case)
              WHERE toLower(c.title) CONTAINS toLower($query)
                 OR toLower(c.case_number) CONTAINS toLower($query)
                 OR toLower(coalesce(c.practice_area, '')) CONTAINS toLower($query)
              OPTIONAL MATCH (counsel:Counsel)-[:REPRESENTS]->(c)
              RETURN c, collect(DISTINCT counsel) AS counsel
              LIMIT 20
            parameters:
              - name: query
                type: STRING
                description: Case title, number, or practice area
          - type: canonicalQuery
            name: filings_for_case
            description: List filings for a case ordered by recency
            cypher: |
              MATCH (f:Filing)-[:FILED_IN]->(c:Case)
              WHERE c.case_number = $case_number OR c.title = $case_number
              OPTIONAL MATCH (a:Counsel)-[:AUTHORED]->(f)
              RETURN f, a
              ORDER BY f.filed_date DESC
              LIMIT $limit
            parameters:
              - name: case_number
                type: STRING
                description: Case number or title
              - name: limit
                type: INTEGER
                default: 20
          - type: canonicalQuery
            name: list_cases
            description: List Case records with optional limit
            cypher: |
              MATCH (n:Case)
              RETURN n
              ORDER BY n.filed_date DESC
              LIMIT toInteger($limit)
            parameters:
              - name: limit
                type: STRING
                description: 'Maximum number of results to return (default: 10)'
          - type: canonicalQuery
            name: get_case_by_id
            description: Get a specific Case by case number (its unique ID) with full connections
            cypher: |
              MATCH (n:Case {case_number: $case_number})
              OPTIONAL MATCH (n)-[r]-(related)
              RETURN n, type(r) AS relationship, labels(related) AS related_labels, related.name AS related_name
              LIMIT 50
            parameters:
              - name: case_number
                type: STRING
                description: The case number to look up
    description: legal case (event)
  Matter:
    label: Matter
    properties:
      matter_id:
        type: STRING
        must_exist: true
        unique: true
      name:
        type: STRING
        must_exist: true
      matter_type:
        type: STRING
        one_of:
          - advisory
          - transactional
          - dispute
          - compliance
          - investigation
      status:
        type: STRING
        one_of:
          - active
          - on_hold
          - closed
      hourly_rate:
        type: FLOAT
      description:
        type: STRING
    extensions:
      display:
        x: 0
        'y': 300
        colour: '#9333ea'
        custom:
          caption: name
      custom:
        createContextGraph:pole:
          pole_type: EVENT
          subtype: LEGAL_MATTER
          origin: domain
        createContextGraph:display:
          icon: folder
          size: 25
        tools:
          - type: canonicalQuery
            name: get_matter_status
            description: Get matter details with associated cases, contracts, and counsel
            cypher: |
              MATCH (m:Matter {matter_id: $matter_id})
              OPTIONAL MATCH (c:Case)-[:BELONGS_TO]->(m)
              OPTIONAL MATCH (k:Contract)-[:GOVERNS]->(m)
              OPTIONAL MATCH (counsel:Counsel)-[:REPRESENTS]->(c)
              RETURN m, collect(DISTINCT c) AS cases,
                     collect(DISTINCT k) AS contracts,
                     collect(DISTINCT counsel) AS counsel
            parameters:
              - name: matter_id
                type: STRING
                description: Matter ID
    description: legal matter (event)
  Contract:
    label: Contract
    properties:
      contract_id:
        type: STRING
        must_exist: true
        unique: true
      name:
        type: STRING
        must_exist: true
      contract_type:
        type: STRING
        one_of:
          - nda
          - msa
          - sow
          - employment
          - license
          - purchase
          - lease
          - partnership
      status:
        type: STRING
        one_of:
          - draft
          - under_review
          - executed
          - expired
          - terminated
      effective_date:
        type: DATE
      expiration_date:
        type: DATE
      value:
        type: FLOAT
    extensions:
      display:
        x: -150
        'y': 260
        colour: '#2563eb'
        custom:
          caption: name
      custom:
        createContextGraph:pole:
          pole_type: OBJECT
          subtype: CONTRACT
          origin: domain
        createContextGraph:display:
          icon: file-signature
          size: 20
        tools:
          - type: canonicalQuery
            name: expiring_contracts
            description: Find contracts expiring within a window
            cypher: |
              MATCH (k:Contract)
              WHERE k.status = 'executed' AND k.expiration_date IS NOT NULL
              WITH k, date(k.expiration_date) AS expiry
              WHERE expiry >= date() AND expiry <= date() + duration({days: $days})
              OPTIONAL MATCH (o:Organization)-[:PARTY_TO]->(k)
              RETURN k, collect(DISTINCT o) AS parties
              ORDER BY expiry
              LIMIT 50
            parameters:
              - name: days
                type: INTEGER
                default: 90
    description: contract (object)
  Filing:
    label: Filing
    properties:
      filing_id:
        type: STRING
        must_exist: true
        unique: true
      title:
        type: STRING
        must_exist: true
      filing_type:
        type: STRING
        one_of:
          - complaint
          - motion
          - brief
          - response
          - discovery
          - settlement
          - judgment
          - appeal
      filed_date:
        type: ZONED DATETIME
        must_exist: true
      court:
        type: STRING
      description:
        type: STRING
    extensions:
      display:
        x: -260
        'y': 150
        colour: '#dc2626'
        custom:
          caption: name
      custom:
        createContextGraph:pole:
          pole_type: EVENT
          subtype: COURT_FILING
          origin: domain
        createContextGraph:display:
          icon: file-text
          size: 15
    description: court filing (event)
  Hearing:
    label: Hearing
    properties:
      hearing_id:
        type: STRING
        must_exist: true
        unique: true
      name:
        type: STRING
        must_exist: true
      hearing_type:
        type: STRING
        one_of:
          - arraignment
          - motion
          - status
          - trial
          - sentencing
          - deposition
          - mediation
          - arbitration
      scheduled_at:
        type: ZONED DATETIME
      outcome:
        type: STRING
        one_of:
          - pending
          - granted
          - denied
          - continued
          - settled
      location:
        type: STRING
    extensions:
      display:
        x: -300
        'y': 0
        colour: '#f59e0b'
        custom:
          caption: name
      custom:
        createContextGraph:pole:
          pole_type: EVENT
          subtype: HEARING
          origin: domain
        createContextGraph:display:
          icon: calendar
          size: 15
        tools:
          - type: canonicalQuery
            name: upcoming_hearings
            description: List scheduled hearings in upcoming days
            cypher: |
              MATCH (h:Hearing)-[:SCHEDULED_FOR]->(c:Case)
              WHERE h.outcome = 'pending' AND h.scheduled_at IS NOT NULL
                AND datetime(h.scheduled_at) >= datetime()
                AND datetime(h.scheduled_at) <= datetime() + duration({days: $days})
              OPTIONAL MATCH (counsel:Counsel)-[:ATTENDED]->(h)
              RETURN h, c, collect(DISTINCT counsel) AS counsel
              ORDER BY h.scheduled_at
              LIMIT 30
            parameters:
              - name: days
                type: INTEGER
                default: 14
    description: hearing (event)
  Counsel:
    label: Counsel
    properties:
      name:
        type: STRING
        must_exist: true
        unique: true
      bar_number:
        type: STRING
      role:
        type: STRING
        one_of:
          - partner
          - associate
          - of_counsel
          - paralegal
          - in_house
          - opposing
      jurisdiction:
        type: STRING
      email:
        type: STRING
    extensions:
      display:
        x: -260
        'y': -150
        colour: '#0ea5e9'
        custom:
          caption: name
      custom:
        createContextGraph:pole:
          pole_type: PERSON
          subtype: ATTORNEY
          origin: domain
        createContextGraph:display:
          icon: briefcase
          size: 25
        tools:
          - type: canonicalQuery
            name: defaultView
            description: create-context-graph's default visualisation query
            cypher: MATCH (counsel:Counsel)-[r:REPRESENTS]->(c:Case) RETURN counsel, r, c LIMIT 100
    description: attorney (person)
  Statute:
    label: Statute
    properties:
      citation:
        type: STRING
        must_exist: true
        unique: true
      name:
        type: STRING
        must_exist: true
      jurisdiction:
        type: STRING
      description:
        type: STRING
    extensions:
      display:
        x: -150
        'y': -260
        colour: '#10b981'
        custom:
          caption: name
      custom:
        createContextGraph:pole:
          pole_type: OBJECT
          subtype: AUTHORITY
          origin: domain
        createContextGraph:display:
          icon: book-open
          size: 15
    description: authority (object)
relationships:
  WORKS_FOR:
    type: WORKS_FOR
    from:
      node: Person
    to:
      node: Organization
    extensions:
      custom:
        createContextGraph:origin:
          origin: base
  LOCATED_AT:
    type: LOCATED_AT
    from:
      node: Organization
    to:
      node: Location
    extensions:
      custom:
        createContextGraph:origin:
          origin: base
  PARTICIPATED_IN:
    type: PARTICIPATED_IN
    from:
      node: Person
    to:
      node: Event
    extensions:
      custom:
        createContextGraph:origin:
          origin: base
  REPRESENTS:
    type: REPRESENTS
    from:
      node: Counsel
    to:
      node: Case
    extensions:
      custom:
        createContextGraph:origin:
          origin: domain
  OPPOSES:
    type: OPPOSES
    from:
      node: Counsel
    to:
      node: Case
    extensions:
      custom:
        createContextGraph:origin:
          origin: domain
  BELONGS_TO:
    type: BELONGS_TO
    from:
      node: Case
    to:
      node: Matter
    extensions:
      custom:
        createContextGraph:origin:
          origin: domain
  CLIENT_OF:
    type: CLIENT_OF
    from:
      node: Person
    to:
      node: Counsel
    extensions:
      custom:
        createContextGraph:origin:
          origin: domain
  PARTY_TO__Person__Case:
    type: PARTY_TO
    from:
      node: Person
    to:
      node: Case
    extensions:
      custom:
        createContextGraph:origin:
          origin: domain
  PARTY_TO__Organization__Contract:
    type: PARTY_TO
    from:
      node: Organization
    to:
      node: Contract
    extensions:
      custom:
        createContextGraph:origin:
          origin: domain
  GOVERNS:
    type: GOVERNS
    from:
      node: Contract
    to:
      node: Matter
    extensions:
      custom:
        createContextGraph:origin:
          origin: domain
  FILED_IN:
    type: FILED_IN
    from:
      node: Filing
    to:
      node: Case
    extensions:
      custom:
        createContextGraph:origin:
          origin: domain
  AUTHORED:
    type: AUTHORED
    from:
      node: Counsel
    to:
      node: Filing
    extensions:
      custom:
        createContextGraph:origin:
          origin: domain
  SCHEDULED_FOR:
    type: SCHEDULED_FOR
    from:
      node: Hearing
    to:
      node: Case
    extensions:
      custom:
        createContextGraph:origin:
          origin: domain
  ATTENDED:
    type: ATTENDED
    from:
      node: Counsel
    to:
      node: Hearing
    extensions:
      custom:
        createContextGraph:origin:
          origin: domain
  CITES:
    type: CITES
    from:
      node: Filing
    to:
      node: Statute
    extensions:
      custom:
        createContextGraph:origin:
          origin: domain
  APPLIES_TO:
    type: APPLIES_TO
    from:
      node: Statute
    to:
      node: Case
    extensions:
      custom:
        createContextGraph:origin:
          origin: domain
  HELD_AT:
    type: HELD_AT
    from:
      node: Hearing
    to:
      node: Location
    extensions:
      custom:
        createContextGraph:origin:
          origin: domain
  SUPERSEDES:
    type: SUPERSEDES
    from:
      node: Contract
    to:
      node: Contract
    extensions:
      custom:
        createContextGraph:origin:
          origin: domain
extensions:
  custom:
    createContextGraph:domain:
      tagline: AI-powered Legal Intelligence
      emoji: ⚖️
      inherits: _base
    createContextGraph:documentTemplates:
      - id: case_summary
        name: Case Summary
        description: Internal case strategy and status summaries
        count: 6
        prompt_template: |
          Write a case summary for {{case.title}} ({{case.case_number}}) led by {{counsel.name}}.
          Practice area: {{case.practice_area}}. Status: {{case.status}}.
          Include key parties, current posture, upcoming filings, and strategy notes.
        required_entities:
          - Case
          - Counsel
          - Person
      - id: contract_review
        name: Contract Review Memo
        description: Markup and review notes for a contract under negotiation
        count: 6
        prompt_template: |
          Write a contract review memo for {{contract.name}} ({{contract.contract_type}}).
          Reviewer: {{counsel.name}}. Counterparty: {{organization.name}}.
          Cover key terms, risks, redlines, and recommendations.
        required_entities:
          - Contract
          - Counsel
          - Organization
      - id: filing_draft
        name: Filing Draft
        description: Draft of a court filing with internal notes
        count: 5
        prompt_template: |
          Draft {{filing.filing_type}} {{filing.title}} for case {{case.title}}.
          Filed by {{counsel.name}} in {{filing.court}}.
          Include factual background, argument, and relief requested.
        required_entities:
          - Filing
          - Case
          - Counsel
      - id: hearing_prep
        name: Hearing Prep Memo
        description: Preparation memo for an upcoming hearing
        count: 5
        prompt_template: |
          Prepare hearing memo for {{hearing.name}} on {{hearing.scheduled_at}} in case {{case.title}}.
          Attending: {{counsel.name}}. Hearing type: {{hearing.hearing_type}}.
          Include arguments, exhibits, witnesses, and contingencies.
        required_entities:
          - Hearing
          - Case
          - Counsel
      - id: client_email
        name: Client Update Email
        description: Email to client with case or matter status
        count: 8
        prompt_template: |
          Write a client update email from {{counsel.name}} to {{person.name}}
          about matter {{matter.name}}. Cover progress, next steps, and any
          decisions needed from the client.
        required_entities:
          - Counsel
          - Person
          - Matter
    createContextGraph:decisionTraces:
      - id: settlement_evaluation
        task: Evaluate settlement offer for {{case.title}}
        steps:
          - thought: Assess the strength of the case on the merits
            action: Review recent filings, discovery findings, and similar past cases
          - thought: Estimate cost and duration of continued litigation
            action: Sum hours billed, upcoming hearings, and projected expert costs
          - thought: Model client's risk tolerance and business objectives
            action: Review client communications and prior settlement positions
          - thought: Compare settlement value against best/worst-case outcomes
            action: Calculate expected value across trial scenarios
        outcome_template: 'Recommendation: {{recommendation}}. Settlement value: {{value}}. Risk: {{risk}}'
      - id: motion_strategy
        task: Decide whether to file {{filing.filing_type}} in {{case.title}}
        steps:
          - thought: Confirm legal basis and supporting authority
            action: Search statutes and prior filings that cite the same precedent
          - thought: Anticipate opposing counsel's response
            action: Review opposing counsel's filing history in similar cases
          - thought: Consider impact on hearing schedule and broader strategy
            action: Check upcoming hearings and discovery deadlines
        outcome_template: 'Decision: {{decision}}. Filing date: {{date}}. Reviewer: {{reviewer}}'
      - id: contract_negotiation
        task: Decide negotiation position on {{contract.name}}
        steps:
          - thought: Identify highest-risk clauses and acceptable fallbacks
            action: Review contract type defaults and counterparty's prior terms
          - thought: Check internal stakeholder requirements
            action: Review related contracts and matter notes
          - thought: Set BATNA before opening the next round
            action: Compare against terms in related executed contracts
        outcome_template: 'Position: {{position}}. Concessions: {{concessions}}. Walkaway: {{walkaway}}'
      - id: conflict_check
        task: Run conflict check for new matter {{matter.name}}
        steps:
          - thought: Identify all parties and affiliates involved
            action: Map the parties and their related organizations
          - thought: Search active and recent matters for the same parties
            action: Query open matters and counsel assignments
          - thought: Determine if a waiver is feasible or matter must decline
            action: Review conflict policies and prior waiver outcomes
        outcome_template: 'Conflict status: {{status}}. Action: {{action}}. Notes: {{notes}}'
    createContextGraph:demoScenarios:
      - name: Case & Matter Status
        prompts:
          - What cases are currently in discovery?
          - Which matters have hearings scheduled in the next two weeks?
          - Who is the lead counsel on our biggest active matter?
      - name: Contract Lifecycle
        prompts:
          - Show me contracts expiring this quarter
          - Which NDAs are still in draft status?
          - Which clients have the most contracts with us?
      - name: Litigation Intelligence
        prompts:
          - What past cases cite the same statute as our current trade-secret case?
          - Who is opposing counsel on our active employment disputes?
          - Summarize the latest filings on our largest case
    createContextGraph:systemPrompt: |
      You are an AI legal intelligence assistant with access to a comprehensive knowledge
      graph of cases, matters, contracts, court filings, hearings, and counsel. You help
      legal teams manage workload, prepare for filings and hearings, track contract
      lifecycle, and surface relevant precedent and prior filings.

      Your capabilities include:
      - Searching cases by party, practice area, status, or counsel
      - Tracking matter status, hours, and deliverables
      - Surfacing contract risk, expirations, and counterparty relationships
      - Connecting filings to authorities and prior similar filings
      - Coordinating hearing schedules and identifying conflicts

      Always cite the underlying case number, contract ID, or filing ID. Avoid offering
      legal conclusions — provide factual summaries and let the attorney decide.
    createContextGraph:visualization:
      node_colors:
        Person: '#22c55e'
        Organization: '#3b82f6'
        Case: '#7c3aed'
        Matter: '#9333ea'
        Contract: '#2563eb'
        Filing: '#dc2626'
        Hearing: '#f59e0b'
        Counsel: '#0ea5e9'
        Statute: '#10b981'
      node_sizes:
        Case: 30
        Matter: 25
        Counsel: 25
        Contract: 20
        Filing: 15
        Hearing: 15
        Statute: 15
        Person: 20
      default_cypher: MATCH (counsel:Counsel)-[r:REPRESENTS]->(c:Case) RETURN counsel, r, c LIMIT 100
