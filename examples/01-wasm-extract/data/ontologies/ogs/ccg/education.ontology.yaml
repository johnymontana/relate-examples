$schema: https://neo4j.com/ontology-graph-spec/1.0.0/schema.json
id: education
version: 1
name: Education
description: Students, instructors, courses, enrollments, assessments, and outcomes for K-12, higher-ed, or training organizations
nodes:
  Person:
    label: Person
    description: person
    properties:
      name:
        type: STRING
        mustExist: true
      email:
        type: STRING
      role:
        type: STRING
      description:
        type: STRING
    extensions:
      neo4j:display:
        color: '#22c55e'
        caption: name
      custom:
        - type: createContextGraph:pole
          definition:
            pole_type: PERSON
            origin: base
        - type: createContextGraph:display
          definition:
            icon: user
  Organization:
    label: Organization
    description: organization
    properties:
      name:
        type: STRING
        mustExist: true
      description:
        type: STRING
      industry:
        type: STRING
    extensions:
      neo4j:display:
        color: '#3b82f6'
        caption: name
      custom:
        - type: createContextGraph:pole
          definition:
            pole_type: ORGANIZATION
            origin: base
        - type: createContextGraph:display
          definition:
            icon: building
  Location:
    label: Location
    description: location
    properties:
      name:
        type: STRING
        mustExist: true
      address:
        type: STRING
      latitude:
        type: FLOAT
      longitude:
        type: FLOAT
    extensions:
      neo4j:display:
        color: '#a855f7'
        caption: name
      custom:
        - type: createContextGraph:pole
          definition:
            pole_type: LOCATION
            origin: base
        - type: createContextGraph:display
          definition:
            icon: map-pin
  Event:
    label: Event
    description: event
    properties:
      name:
        type: STRING
        mustExist: true
      date:
        type: DATETIME
      description:
        type: STRING
    extensions:
      neo4j:display:
        color: '#f97316'
        caption: name
      custom:
        - type: createContextGraph:pole
          definition:
            pole_type: EVENT
            origin: base
        - type: createContextGraph:display
          definition:
            icon: calendar
  Object:
    label: Object
    description: object
    properties:
      name:
        type: STRING
        mustExist: true
      description:
        type: STRING
    extensions:
      neo4j:display:
        color: '#eab308'
        caption: name
      custom:
        - type: createContextGraph:pole
          definition:
            pole_type: OBJECT
            origin: base
        - type: createContextGraph:display
          definition:
            icon: box
  Student:
    label: Student
    description: learner (person)
    properties:
      name:
        type: STRING
        mustExist: true
        unique: true
      student_id:
        type: STRING
        unique: true
      grade_level:
        type: STRING
        one_of:
          - elementary
          - middle_school
          - high_school
          - undergraduate
          - graduate
          - adult_learner
      enrollment_status:
        type: STRING
        one_of:
          - active
          - on_leave
          - graduated
          - withdrawn
          - deferred
      email:
        type: STRING
    tools:
      - type: canonicalQuery
        name: search_student
        description: Search students by name or ID
        cypher: |
          MATCH (s:Student)
          WHERE toLower(s.name) CONTAINS toLower($query)
             OR toLower(coalesce(s.student_id, '')) CONTAINS toLower($query)
          OPTIONAL MATCH (s)-[:ENROLLED_IN]->(c:Course)
          RETURN s, collect(DISTINCT c) AS courses
          LIMIT 20
        parameters:
          - name: query
            type: STRING
            description: Student name or ID
      - type: canonicalQuery
        name: defaultView
        description: create-context-graph's default visualisation query
        cypher: MATCH (s:Student)-[r:ENROLLED_IN]->(c:Course) RETURN s, r, c LIMIT 100
    extensions:
      neo4j:display:
        color: '#2563eb'
        caption: name
      custom:
        - type: createContextGraph:pole
          definition:
            pole_type: PERSON
            subtype: LEARNER
            origin: domain
        - type: createContextGraph:display
          definition:
            icon: graduation-cap
            size: 20
  Instructor:
    label: Instructor
    description: educator (person)
    properties:
      name:
        type: STRING
        mustExist: true
        unique: true
      role:
        type: STRING
        one_of:
          - professor
          - lecturer
          - teaching_assistant
          - advisor
          - instructor
      department:
        type: STRING
      email:
        type: STRING
    tools:
      - type: canonicalQuery
        name: instructor_load
        description: Get the courses and student count for an instructor
        cypher: |
          MATCH (i:Instructor)
          WHERE i.name = $instructor OR toLower(i.name) CONTAINS toLower($instructor)
          OPTIONAL MATCH (i)-[:TEACHES]->(c:Course)
          OPTIONAL MATCH (e:Enrollment)-[:FOR_COURSE]->(c)
          RETURN i, c, count(DISTINCT e) AS enrolled
        parameters:
          - name: instructor
            type: STRING
            description: Instructor name
    extensions:
      neo4j:display:
        color: '#0ea5e9'
        caption: name
      custom:
        - type: createContextGraph:pole
          definition:
            pole_type: PERSON
            subtype: EDUCATOR
            origin: domain
        - type: createContextGraph:display
          definition:
            icon: user-square
            size: 25
  Course:
    label: Course
    description: course (object)
    properties:
      course_code:
        type: STRING
        mustExist: true
        unique: true
      name:
        type: STRING
        mustExist: true
      subject:
        type: STRING
        one_of:
          - math
          - science
          - history
          - language
          - art
          - computer_science
          - business
          - engineering
          - medicine
          - law
          - social_science
          - other
      credits:
        type: INTEGER
      level:
        type: STRING
        one_of:
          - introductory
          - intermediate
          - advanced
          - graduate
      description:
        type: STRING
    tools:
      - type: canonicalQuery
        name: course_roster
        description: Get the roster for a course in a term
        cypher: |
          MATCH (c:Course {course_code: $course_code})
          OPTIONAL MATCH (e:Enrollment)-[:FOR_COURSE]->(c)
          OPTIONAL MATCH (e)-[:ENROLLMENT_OF]->(s:Student)
          OPTIONAL MATCH (i:Instructor)-[:TEACHES]->(c)
          RETURN c, collect(DISTINCT s) AS students, collect(DISTINCT i) AS instructors
        parameters:
          - name: course_code
            type: STRING
            description: Course code (e.g. CS101)
      - type: canonicalQuery
        name: course_prereq_chain
        description: Walk the prerequisite chain for a course
        cypher: |
          MATCH path = (start:Course {course_code: $course_code})<-[:PREREQUISITE_OF*1..3]-(prereq:Course)
          RETURN path, prereq
          LIMIT 50
        parameters:
          - name: course_code
            type: STRING
            description: Course code
      - type: canonicalQuery
        name: list_courses
        description: List Course records with optional limit
        cypher: |
          MATCH (n:Course)
          RETURN n
          ORDER BY n.course_code
          LIMIT toInteger($limit)
        parameters:
          - name: limit
            type: STRING
            description: 'Maximum number of results to return (default: 10)'
      - type: canonicalQuery
        name: get_course_by_id
        description: Get a specific Course by course code (its unique ID) with connections
        cypher: |
          MATCH (n:Course {course_code: $course_code})
          OPTIONAL MATCH (n)-[r]-(related)
          RETURN n, type(r) AS relationship, labels(related) AS related_labels, related.name AS related_name
          LIMIT 50
        parameters:
          - name: course_code
            type: STRING
            description: The course code (e.g. CS101)
    extensions:
      neo4j:display:
        color: '#7c3aed'
        caption: name
      custom:
        - type: createContextGraph:pole
          definition:
            pole_type: OBJECT
            subtype: COURSE
            origin: domain
        - type: createContextGraph:display
          definition:
            icon: book
            size: 25
  Term:
    label: Term
    description: academic term (event)
    properties:
      term_id:
        type: STRING
        mustExist: true
        unique: true
      name:
        type: STRING
        mustExist: true
      term_type:
        type: STRING
        one_of:
          - fall
          - winter
          - spring
          - summer
          - year_round
      start_date:
        type: DATE
      end_date:
        type: DATE
    extensions:
      neo4j:display:
        color: '#f59e0b'
        caption: name
      custom:
        - type: createContextGraph:pole
          definition:
            pole_type: EVENT
            subtype: ACADEMIC_TERM
            origin: domain
        - type: createContextGraph:display
          definition:
            icon: calendar-days
            size: 15
  Enrollment:
    label: Enrollment
    description: enrollment (event)
    properties:
      enrollment_id:
        type: STRING
        mustExist: true
        unique: true
      name:
        type: STRING
      status:
        type: STRING
        one_of:
          - enrolled
          - dropped
          - completed
          - incomplete
          - audit
      final_grade:
        type: STRING
      enrolled_date:
        type: DATE
    extensions:
      neo4j:display:
        color: '#84cc16'
        caption: name
      custom:
        - type: createContextGraph:pole
          definition:
            pole_type: EVENT
            subtype: ENROLLMENT
            origin: domain
        - type: createContextGraph:display
          definition:
            icon: clipboard-check
            size: 12
  Assessment:
    label: Assessment
    description: assessment (event)
    properties:
      assessment_id:
        type: STRING
        mustExist: true
        unique: true
      name:
        type: STRING
        mustExist: true
      assessment_type:
        type: STRING
        one_of:
          - quiz
          - exam
          - paper
          - project
          - presentation
          - lab
          - homework
          - participation
      due_date:
        type: DATETIME
      max_score:
        type: FLOAT
      weight:
        type: FLOAT
    extensions:
      neo4j:display:
        color: '#ef4444'
        caption: name
      custom:
        - type: createContextGraph:pole
          definition:
            pole_type: EVENT
            subtype: ASSESSMENT
            origin: domain
        - type: createContextGraph:display
          definition:
            icon: file-check
            size: 15
  Submission:
    label: Submission
    description: submission (event)
    properties:
      submission_id:
        type: STRING
        mustExist: true
        unique: true
      name:
        type: STRING
      status:
        type: STRING
        one_of:
          - submitted
          - late
          - missing
          - graded
          - returned
      score:
        type: FLOAT
      submitted_at:
        type: DATETIME
    tools:
      - type: canonicalQuery
        name: at_risk_students
        description: Find students with low recent assessment scores
        cypher: |
          MATCH (sub:Submission)-[:SUBMITTED_BY]->(s:Student)
          MATCH (sub)-[:SUBMITTED_FOR]->(a:Assessment)-[:PART_OF]->(c:Course)
          WHERE sub.score IS NOT NULL AND a.max_score IS NOT NULL
          WITH s, c, avg(toFloat(sub.score) / toFloat(a.max_score)) AS avg_ratio
          WHERE avg_ratio < toFloat($threshold)
          RETURN s, c, avg_ratio
          ORDER BY avg_ratio ASC
          LIMIT 30
        parameters:
          - name: threshold
            type: FLOAT
            default: 0.6
    extensions:
      neo4j:display:
        color: '#14b8a6'
        caption: name
      custom:
        - type: createContextGraph:pole
          definition:
            pole_type: EVENT
            subtype: SUBMISSION
            origin: domain
        - type: createContextGraph:display
          definition:
            icon: send
            size: 12
relationships:
  WORKS_FOR:
    type: WORKS_FOR
    from:
      node: Person
    to:
      node: Organization
    extensions:
      custom:
        - type: createContextGraph:origin
          definition:
            origin: base
  LOCATED_AT:
    type: LOCATED_AT
    from:
      node: Organization
    to:
      node: Location
    extensions:
      custom:
        - type: createContextGraph:origin
          definition:
            origin: base
  PARTICIPATED_IN:
    type: PARTICIPATED_IN
    from:
      node: Person
    to:
      node: Event
    extensions:
      custom:
        - type: createContextGraph:origin
          definition:
            origin: base
  TEACHES:
    type: TEACHES
    from:
      node: Instructor
    to:
      node: Course
    extensions:
      custom:
        - type: createContextGraph:origin
          definition:
            origin: domain
  ADVISES:
    type: ADVISES
    from:
      node: Instructor
    to:
      node: Student
    extensions:
      custom:
        - type: createContextGraph:origin
          definition:
            origin: domain
  ENROLLED_IN:
    type: ENROLLED_IN
    from:
      node: Student
    to:
      node: Course
    extensions:
      custom:
        - type: createContextGraph:origin
          definition:
            origin: domain
  ENROLLMENT_OF:
    type: ENROLLMENT_OF
    from:
      node: Enrollment
    to:
      node: Student
    extensions:
      custom:
        - type: createContextGraph:origin
          definition:
            origin: domain
  FOR_COURSE:
    type: FOR_COURSE
    from:
      node: Enrollment
    to:
      node: Course
    extensions:
      custom:
        - type: createContextGraph:origin
          definition:
            origin: domain
  OFFERED_IN:
    type: OFFERED_IN
    from:
      node: Course
    to:
      node: Term
    extensions:
      custom:
        - type: createContextGraph:origin
          definition:
            origin: domain
  BELONGS_TO:
    type: BELONGS_TO
    from:
      node: Course
    to:
      node: Organization
    extensions:
      custom:
        - type: createContextGraph:origin
          definition:
            origin: domain
  PREREQUISITE_OF:
    type: PREREQUISITE_OF
    from:
      node: Course
    to:
      node: Course
    extensions:
      custom:
        - type: createContextGraph:origin
          definition:
            origin: domain
  PART_OF:
    type: PART_OF
    from:
      node: Assessment
    to:
      node: Course
    extensions:
      custom:
        - type: createContextGraph:origin
          definition:
            origin: domain
  SUBMITTED_BY:
    type: SUBMITTED_BY
    from:
      node: Submission
    to:
      node: Student
    extensions:
      custom:
        - type: createContextGraph:origin
          definition:
            origin: domain
  SUBMITTED_FOR:
    type: SUBMITTED_FOR
    from:
      node: Submission
    to:
      node: Assessment
    extensions:
      custom:
        - type: createContextGraph:origin
          definition:
            origin: domain
  GRADED_BY:
    type: GRADED_BY
    from:
      node: Submission
    to:
      node: Instructor
    extensions:
      custom:
        - type: createContextGraph:origin
          definition:
            origin: domain
  HELD_AT:
    type: HELD_AT
    from:
      node: Course
    to:
      node: Location
    extensions:
      custom:
        - type: createContextGraph:origin
          definition:
            origin: domain
  ATTENDED:
    type: ATTENDED
    from:
      node: Student
    to:
      node: Event
    extensions:
      custom:
        - type: createContextGraph:origin
          definition:
            origin: domain
extensions:
  custom:
    - type: createContextGraph:domain
      definition:
        tagline: AI-powered Learning Intelligence
        emoji: 🎓
        inherits: _base
    - type: createContextGraph:documentTemplates
      definition:
        - id: syllabus
          name: Course Syllabus
          description: Course syllabus with policies and schedule
          count: 6
          prompt_template: |
            Write a syllabus for course {{course.name}} ({{course.course_code}}) taught by
            {{instructor.name}} in {{term.name}}. Include learning objectives, weekly schedule,
            grading policy, and required readings.
          required_entities:
            - Course
            - Instructor
            - Term
        - id: assignment_brief
          name: Assignment Brief
          description: Detailed assignment description with rubric
          count: 8
          prompt_template: |
            Write an assignment brief for {{assessment.name}} ({{assessment.assessment_type}})
            in {{course.name}}. Due: {{assessment.due_date}}. Include instructions,
            learning outcomes, evaluation rubric, and submission requirements.
          required_entities:
            - Assessment
            - Course
            - Instructor
        - id: progress_report
          name: Student Progress Report
          description: Individual student progress summaries
          count: 5
          prompt_template: |
            Write a progress report for {{student.name}} in {{course.name}}.
            Instructor: {{instructor.name}}. Cover grades to date, attendance,
            strengths, areas for improvement, and recommended next steps.
          required_entities:
            - Student
            - Course
            - Instructor
        - id: lesson_plan
          name: Lesson Plan
          description: Detailed lesson plan for a single class session
          count: 6
          prompt_template: |
            Write a lesson plan for {{course.name}} session on {{topic}}.
            Instructor: {{instructor.name}}. Include objectives, activities, materials,
            and assessment for the class period.
          required_entities:
            - Course
            - Instructor
        - id: parent_email
          name: Parent Communication
          description: Email to a parent about student progress or behavior
          count: 6
          prompt_template: |
            Write an email from {{instructor.name}} to the parent of {{student.name}}
            about {{topic}} in {{course.name}}. Be specific, constructive, and
            include any requested next steps.
          required_entities:
            - Instructor
            - Student
            - Course
    - type: createContextGraph:decisionTraces
      definition:
        - id: academic_intervention
          task: Decide on academic intervention for {{student.name}} in {{course.name}}
          steps:
            - thought: Assess the student's current performance trajectory
              action: Review submissions, scores, and attendance patterns this term
            - thought: Identify possible root causes
              action: Compare against the student's performance in other courses and prior terms
            - thought: Consider available support resources
              action: Check tutoring availability, advisor schedule, and prior intervention outcomes
            - thought: Choose the least disruptive effective intervention
              action: Match intervention severity to gap size and time remaining in term
          outcome_template: 'Intervention: {{intervention}}. Owner: {{owner}}. Review date: {{review}}'
        - id: course_scheduling
          task: Schedule a new section of {{course.name}} for {{term.name}}
          steps:
            - thought: Check instructor availability and load
              action: Query instructor course loads and prior teaching of this course
            - thought: Estimate demand from prerequisite enrollments
              action: Count students who completed prerequisite courses
            - thought: Avoid time conflicts with required co-courses
              action: Check the schedule of courses commonly taken together
          outcome_template: 'Section: {{section}}. Instructor: {{instructor}}. Capacity: {{cap}}'
        - id: grade_appeal
          task: Evaluate grade appeal for {{student.name}} on {{assessment.name}}
          steps:
            - thought: Reconstruct the original grading
              action: Pull the submission, rubric, and graded score
            - thought: Compare against peer submissions for consistency
              action: Sample other submissions for the same assessment
            - thought: Check policy compliance
              action: Verify late, attendance, and academic-honesty policies
          outcome_template: 'Decision: {{decision}}. Original: {{original}}. Revised: {{revised}}'
        - id: program_review
          task: Review effectiveness of {{course.name}} curriculum
          steps:
            - thought: Aggregate outcomes from recent terms
              action: Compute completion rate, average final grade, and DFW rate per term
            - thought: Identify assessments where students cluster low
              action: Find assessments with low average scores across cohorts
            - thought: Compare against peer courses or program goals
              action: Find similar courses in the same subject and compare outcomes
          outcome_template: 'Findings: {{findings}}. Recommended changes: {{changes}}'
    - type: createContextGraph:demoScenarios
      definition:
        - name: Roster & Enrollment
          prompts:
            - Show me students enrolled in CS101 this term
            - Which courses have prerequisites that block the most students?
            - Who advises our largest cohort of graduate students?
        - name: Grades & Assessment
          prompts:
            - Which students are at risk of failing this term?
            - Show the grade distribution for the midterm in math 201
            - What's the average final grade for courses taught by Dr. Chen?
        - name: Curriculum Intelligence
          prompts:
            - Which prerequisites have the strongest correlation with course success?
            - Find courses with declining enrollment over the last 3 terms
            - What are the most common course pathways for our CS majors?
    - type: createContextGraph:systemPrompt
      definition: |
        You are an AI education intelligence assistant with access to a comprehensive knowledge
        graph of students, instructors, courses, terms, enrollments, assessments, and submissions.
        You help instructional teams understand learning outcomes, identify at-risk students,
        manage course schedules, and improve curriculum.

        Your capabilities include:
        - Searching students and instructors by name, role, or department
        - Computing grade distributions, completion rates, and risk signals
        - Tracing prerequisite chains and curriculum design choices
        - Surfacing intervention candidates and trending trouble spots
        - Cross-referencing assessments, submissions, and final outcomes

        Always lead with specific, actionable insights backed by data from the graph.
        Respect student privacy: aggregate when discussing cohorts; only name individual
        students when answering a question that names them.
    - type: createContextGraph:visualization
      definition:
        node_colors:
          Person: '#22c55e'
          Organization: '#3b82f6'
          Student: '#2563eb'
          Instructor: '#0ea5e9'
          Course: '#7c3aed'
          Term: '#f59e0b'
          Enrollment: '#84cc16'
          Assessment: '#ef4444'
          Submission: '#14b8a6'
        node_sizes:
          Course: 25
          Student: 20
          Instructor: 25
          Assessment: 15
          Submission: 12
          Enrollment: 12
          Term: 15
        default_cypher: MATCH (s:Student)-[r:ENROLLED_IN]->(c:Course) RETURN s, r, c LIMIT 100
