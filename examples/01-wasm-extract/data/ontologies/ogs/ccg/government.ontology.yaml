schema: https://neo4j.com/docs/ontology-graph-spec/1.1.0/schema.json
version: '1'
id: government
name: Government
description: Agencies, programs, policies, regulations, citizens, services, and budgets for public-sector operations
nodes:
  Person:
    label: Person
    properties:
      name:
        type: STRING
        must_exist: true
      email:
        type: STRING
      role:
        type: STRING
      description:
        type: STRING
    extensions:
      display:
        x: 0
        'y': -300
        colour: '#22c55e'
        custom:
          caption: name
      custom:
        createContextGraph:pole:
          pole_type: PERSON
          origin: base
        createContextGraph:display:
          icon: user
    description: person
  Organization:
    label: Organization
    properties:
      name:
        type: STRING
        must_exist: true
      description:
        type: STRING
      industry:
        type: STRING
    extensions:
      display:
        x: 139
        'y': -266
        colour: '#3b82f6'
        custom:
          caption: name
      custom:
        createContextGraph:pole:
          pole_type: ORGANIZATION
          origin: base
        createContextGraph:display:
          icon: building
    description: organization
  Location:
    label: Location
    properties:
      name:
        type: STRING
        must_exist: true
      address:
        type: STRING
      latitude:
        type: FLOAT
      longitude:
        type: FLOAT
    extensions:
      display:
        x: 247
        'y': -170
        colour: '#a855f7'
        custom:
          caption: name
      custom:
        createContextGraph:pole:
          pole_type: LOCATION
          origin: base
        createContextGraph:display:
          icon: map-pin
    description: location
  Event:
    label: Event
    properties:
      name:
        type: STRING
        must_exist: true
      date:
        type: ZONED DATETIME
      description:
        type: STRING
    extensions:
      display:
        x: 298
        'y': -36
        colour: '#f97316'
        custom:
          caption: name
      custom:
        createContextGraph:pole:
          pole_type: EVENT
          origin: base
        createContextGraph:display:
          icon: calendar
    description: event
  Object:
    label: Object
    properties:
      name:
        type: STRING
        must_exist: true
      description:
        type: STRING
    extensions:
      display:
        x: 281
        'y': 106
        colour: '#eab308'
        custom:
          caption: name
      custom:
        createContextGraph:pole:
          pole_type: OBJECT
          origin: base
        createContextGraph:display:
          icon: box
    description: object
  Agency:
    label: Agency
    properties:
      name:
        type: STRING
        must_exist: true
        unique: true
      agency_type:
        type: STRING
        one_of:
          - federal
          - state
          - county
          - municipal
          - regional
          - tribal
          - special_district
      jurisdiction:
        type: STRING
      budget_authority:
        type: FLOAT
      description:
        type: STRING
    extensions:
      display:
        x: 199
        'y': 225
        colour: '#1d4ed8'
        custom:
          caption: name
      custom:
        createContextGraph:pole:
          pole_type: ORGANIZATION
          subtype: GOVERNMENT_AGENCY
          origin: domain
        createContextGraph:display:
          icon: building
          size: 30
        tools:
          - type: canonicalQuery
            name: agency_portfolio
            description: Get all programs, regulations, and services for an agency
            cypher: |
              MATCH (a:Agency {name: $name})
              OPTIONAL MATCH (a)-[:ADMINISTERS]->(p:Program)
              OPTIONAL MATCH (a)-[:ENFORCES]->(r:Regulation)
              OPTIONAL MATCH (a)-[:PROVIDES]->(s:Service)
              RETURN a, collect(DISTINCT p) AS programs,
                     collect(DISTINCT r) AS regulations,
                     collect(DISTINCT s) AS services
            parameters:
              - name: name
                type: STRING
                description: Agency name
          - type: canonicalQuery
            name: list_agencies
            description: List Agency records with optional limit
            cypher: |
              MATCH (n:Agency)
              RETURN n
              ORDER BY n.name
              LIMIT toInteger($limit)
            parameters:
              - name: limit
                type: STRING
                description: 'Maximum number of results to return (default: 10)'
          - type: canonicalQuery
            name: get_agency_by_name
            description: Get a specific Agency by name with full portfolio
            cypher: |
              MATCH (n:Agency {name: $name})
              OPTIONAL MATCH (n)-[r]-(related)
              RETURN n, type(r) AS relationship, labels(related) AS related_labels, related.name AS related_name
              LIMIT 100
            parameters:
              - name: name
                type: STRING
                description: The agency name
          - type: canonicalQuery
            name: defaultView
            description: create-context-graph's default visualisation query
            cypher: MATCH (a:Agency)-[r:ADMINISTERS]->(p:Program) RETURN a, r, p LIMIT 100
    description: government agency (organization)
  Program:
    label: Program
    properties:
      program_id:
        type: STRING
        must_exist: true
        unique: true
      name:
        type: STRING
        must_exist: true
      program_type:
        type: STRING
        one_of:
          - grant
          - services
          - infrastructure
          - research
          - enforcement
          - education
          - healthcare
          - social
      status:
        type: STRING
        one_of:
          - proposed
          - active
          - paused
          - sunset
          - completed
      budget:
        type: FLOAT
      description:
        type: STRING
    extensions:
      display:
        x: 72
        'y': 291
        colour: '#7c3aed'
        custom:
          caption: name
      custom:
        createContextGraph:pole:
          pole_type: OBJECT
          subtype: PROGRAM
          origin: domain
        createContextGraph:display:
          icon: package
          size: 25
        tools:
          - type: canonicalQuery
            name: search_program
            description: Search programs by name, type, or status
            cypher: |
              MATCH (p:Program)
              WHERE toLower(p.name) CONTAINS toLower($query)
                 OR p.program_type = $query
                 OR p.status = $query
              OPTIONAL MATCH (a:Agency)-[:ADMINISTERS]->(p)
              RETURN p, a
              LIMIT 30
            parameters:
              - name: query
                type: STRING
                description: Program name, type, or status
    description: program (object)
  Policy:
    label: Policy
    properties:
      policy_id:
        type: STRING
        must_exist: true
        unique: true
      name:
        type: STRING
        must_exist: true
      policy_type:
        type: STRING
        one_of:
          - statute
          - regulation
          - ordinance
          - executive_order
          - guideline
          - directive
      status:
        type: STRING
        one_of:
          - draft
          - public_comment
          - adopted
          - in_force
          - repealed
          - superseded
      effective_date:
        type: DATE
      description:
        type: STRING
    extensions:
      display:
        x: -72
        'y': 291
        colour: '#0ea5e9'
        custom:
          caption: name
      custom:
        createContextGraph:pole:
          pole_type: OBJECT
          subtype: POLICY
          origin: domain
        createContextGraph:display:
          icon: scroll
          size: 20
    description: policy (object)
  Regulation:
    label: Regulation
    properties:
      regulation_id:
        type: STRING
        must_exist: true
        unique: true
      name:
        type: STRING
        must_exist: true
      regulatory_area:
        type: STRING
        one_of:
          - environmental
          - financial
          - health
          - safety
          - labor
          - transportation
          - telecommunications
          - energy
          - food_drug
          - other
      status:
        type: STRING
        one_of:
          - proposed
          - public_comment
          - final
          - amended
          - repealed
      published_date:
        type: DATE
    extensions:
      display:
        x: -199
        'y': 225
        colour: '#f59e0b'
        custom:
          caption: name
      custom:
        createContextGraph:pole:
          pole_type: OBJECT
          subtype: REGULATION
          origin: domain
        createContextGraph:display:
          icon: book-marked
          size: 20
        tools:
          - type: canonicalQuery
            name: open_regulations
            description: List regulations in proposed or public-comment status
            cypher: |
              MATCH (r:Regulation)
              WHERE r.status IN ['proposed', 'public_comment']
              OPTIONAL MATCH (a:Agency)-[:ENFORCES]->(r)
              RETURN r, a
              ORDER BY r.published_date DESC
              LIMIT 50
    description: regulation (object)
  Service:
    label: Service
    properties:
      service_id:
        type: STRING
        must_exist: true
        unique: true
      name:
        type: STRING
        must_exist: true
      service_type:
        type: STRING
        one_of:
          - benefits
          - permits
          - licenses
          - inspections
          - registrations
          - complaints
          - information
      delivery_channel:
        type: STRING
        one_of:
          - in_person
          - online
          - phone
          - mail
          - mobile
          - hybrid
      description:
        type: STRING
    extensions:
      display:
        x: -281
        'y': 106
        colour: '#14b8a6'
        custom:
          caption: name
      custom:
        createContextGraph:pole:
          pole_type: OBJECT
          subtype: PUBLIC_SERVICE
          origin: domain
        createContextGraph:display:
          icon: hand-helping
          size: 15
    description: public service (object)
  Citizen:
    label: Citizen
    properties:
      name:
        type: STRING
        must_exist: true
        unique: true
      constituent_id:
        type: STRING
        unique: true
      district:
        type: STRING
      email:
        type: STRING
    extensions:
      display:
        x: -298
        'y': -36
        colour: '#65a30d'
        custom:
          caption: name
      custom:
        createContextGraph:pole:
          pole_type: PERSON
          subtype: CONSTITUENT
          origin: domain
        createContextGraph:display:
          icon: user-circle
          size: 12
    description: constituent (person)
  Official:
    label: Official
    properties:
      name:
        type: STRING
        must_exist: true
        unique: true
      role:
        type: STRING
        one_of:
          - elected
          - appointed
          - civil_service
          - contractor
          - advisory
          - judicial
      title:
        type: STRING
      department:
        type: STRING
      email:
        type: STRING
    extensions:
      display:
        x: -247
        'y': -170
        colour: '#dc2626'
        custom:
          caption: name
      custom:
        createContextGraph:pole:
          pole_type: PERSON
          subtype: PUBLIC_OFFICIAL
          origin: domain
        createContextGraph:display:
          icon: badge
          size: 20
        tools:
          - type: canonicalQuery
            name: official_sponsored_policies
            description: List policies sponsored by an official
            cypher: |
              MATCH (o:Official {name: $name})-[:SPONSORS]->(p:Policy)
              OPTIONAL MATCH (a:Agency)-[:ISSUES]->(p)
              RETURN o, p, a
              ORDER BY p.effective_date DESC
              LIMIT 30
            parameters:
              - name: name
                type: STRING
                description: Official name
    description: public official (person)
  Budget:
    label: Budget
    properties:
      budget_id:
        type: STRING
        must_exist: true
        unique: true
      name:
        type: STRING
        must_exist: true
      fiscal_year:
        type: STRING
      appropriated_amount:
        type: FLOAT
      spent_amount:
        type: FLOAT
      status:
        type: STRING
        one_of:
          - proposed
          - approved
          - executing
          - closed
          - audited
    extensions:
      display:
        x: -139
        'y': -266
        colour: '#10b981'
        custom:
          caption: name
      custom:
        createContextGraph:pole:
          pole_type: OBJECT
          subtype: APPROPRIATION
          origin: domain
        createContextGraph:display:
          icon: dollar-sign
          size: 20
        tools:
          - type: canonicalQuery
            name: budget_variance
            description: Identify programs with significant budget variance
            cypher: |
              MATCH (b:Budget)-[:APPROPRIATED_TO]->(p:Program)
              WHERE b.appropriated_amount IS NOT NULL AND b.spent_amount IS NOT NULL
                AND b.appropriated_amount > 0
              WITH p, b, abs(b.spent_amount - b.appropriated_amount) / b.appropriated_amount AS variance
              WHERE variance > toFloat($threshold)
              RETURN p, b, variance
              ORDER BY variance DESC
              LIMIT 30
            parameters:
              - name: threshold
                type: FLOAT
                default: 0.1
    description: appropriation (object)
relationships:
  WORKS_FOR:
    type: WORKS_FOR
    from:
      node: Person
    to:
      node: Organization
    extensions:
      custom:
        createContextGraph:origin:
          origin: base
  LOCATED_AT:
    type: LOCATED_AT
    from:
      node: Organization
    to:
      node: Location
    extensions:
      custom:
        createContextGraph:origin:
          origin: base
  PARTICIPATED_IN:
    type: PARTICIPATED_IN
    from:
      node: Person
    to:
      node: Event
    extensions:
      custom:
        createContextGraph:origin:
          origin: base
  ADMINISTERS:
    type: ADMINISTERS
    from:
      node: Agency
    to:
      node: Program
    extensions:
      custom:
        createContextGraph:origin:
          origin: domain
  ENFORCES:
