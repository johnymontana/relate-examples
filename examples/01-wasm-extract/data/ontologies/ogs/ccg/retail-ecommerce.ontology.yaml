schema: https://neo4j.com/docs/ontology-graph-spec/1.1.0/schema.json
version: '1'
id: retail-ecommerce
name: Retail & E-Commerce
description: Customer management, product catalog, order fulfillment, and marketing campaigns
nodes:
  Person:
    label: Person
    properties:
      name:
        type: STRING
        must_exist: true
      email:
        type: STRING
      role:
        type: STRING
      description:
        type: STRING
    extensions:
      display:
        x: 0
        'y': -300
        colour: '#22c55e'
        custom:
          caption: name
      custom:
        createContextGraph:pole:
          pole_type: PERSON
          origin: base
        createContextGraph:display:
          icon: user
          size: 20
    description: person
  Organization:
    label: Organization
    properties:
      name:
        type: STRING
        must_exist: true
      description:
        type: STRING
      industry:
        type: STRING
    extensions:
      display:
        x: 162
        'y': -252
        colour: '#3b82f6'
        custom:
          caption: name
      custom:
        createContextGraph:pole:
          pole_type: ORGANIZATION
          origin: base
        createContextGraph:display:
          icon: building
          size: 25
    description: organization
  Location:
    label: Location
    properties:
      name:
        type: STRING
        must_exist: true
      address:
        type: STRING
      latitude:
        type: FLOAT
      longitude:
        type: FLOAT
    extensions:
      display:
        x: 273
        'y': -125
        colour: '#a855f7'
        custom:
          caption: name
      custom:
        createContextGraph:pole:
          pole_type: LOCATION
          origin: base
        createContextGraph:display:
          icon: map-pin
    description: location
  Event:
    label: Event
    properties:
      name:
        type: STRING
        must_exist: true
      date:
        type: ZONED DATETIME
      description:
        type: STRING
    extensions:
      display:
        x: 297
        'y': 43
        colour: '#f97316'
        custom:
          caption: name
      custom:
        createContextGraph:pole:
          pole_type: EVENT
          origin: base
        createContextGraph:display:
          icon: calendar
    description: event
  Object:
    label: Object
    properties:
      name:
        type: STRING
        must_exist: true
      description:
        type: STRING
    extensions:
      display:
        x: 227
        'y': 196
        colour: '#eab308'
        custom:
          caption: name
      custom:
        createContextGraph:pole:
          pole_type: OBJECT
          origin: base
        createContextGraph:display:
          icon: box
    description: object
  Customer:
    label: Customer
    properties:
      customer_id:
        type: STRING
        must_exist: true
        unique: true
      name:
        type: STRING
        must_exist: true
      email:
        type: STRING
        unique: true
      segment:
        type: STRING
        one_of:
          - new
          - returning
          - vip
          - at_risk
          - churned
      lifetime_value:
        type: FLOAT
      join_date:
        type: DATE
      preferred_channel:
        type: STRING
        one_of:
          - web
          - mobile
          - in_store
          - social
    extensions:
      display:
        x: 85
        'y': 288
        colour: '#0891b2'
        custom:
          caption: name
      custom:
        createContextGraph:pole:
          pole_type: OBJECT
          subtype: CONSUMER
          origin: domain
        createContextGraph:display:
          icon: user
          size: 25
        tools:
          - type: canonicalQuery
            name: search_customer
            description: Search for customers by name, email, or segment
            cypher: |
              MATCH (c:Customer)
              WHERE toLower(c.name) CONTAINS toLower($query)
                 OR toLower(coalesce(c.email, '')) CONTAINS toLower($query)
                 OR toLower(coalesce(c.segment, '')) CONTAINS toLower($query)
              OPTIONAL MATCH (c)-[:PURCHASED]->(o:Order)
              RETURN c, count(o) AS total_orders,
                     sum(o.total_amount) AS total_spent
              ORDER BY total_spent DESC
              LIMIT 20
            parameters:
              - name: query
                type: STRING
                description: Customer name, email, or segment to search for
          - type: canonicalQuery
            name: order_history
            description: Get order history for a specific customer
            cypher: |
              MATCH (c:Customer {customer_id: $customer_id})-[:PURCHASED]->(o:Order)
              OPTIONAL MATCH (o)-[:CONTAINS]->(p:Product)
              RETURN o, collect(p.name) AS products, collect(p.price) AS prices
              ORDER BY o.order_date DESC
              LIMIT 50
            parameters:
              - name: customer_id
                type: STRING
                description: Customer ID to look up order history for
          - type: canonicalQuery
            name: product_recommendations
            description: Get product recommendations based on purchase patterns
            cypher: |
              MATCH (c:Customer {customer_id: $customer_id})-[:PURCHASED]->(:Order)-[:CONTAINS]->(p:Product)
              MATCH (p)-[:RECOMMENDED]->(rec:Product)
              WHERE NOT EXISTS {
                MATCH (c)-[:PURCHASED]->(:Order)-[:CONTAINS]->(rec)
              }
              RETURN rec.name AS recommended_product, rec.price, rec.rating,
                     count(*) AS recommendation_strength
              ORDER BY recommendation_strength DESC
              LIMIT 10
            parameters:
              - name: customer_id
                type: STRING
                description: Customer ID to generate recommendations for
          - type: canonicalQuery
            name: list_customers
            description: List customer records with optional limit
            cypher: |
              MATCH (n:Customer)
              RETURN n
              ORDER BY n.name
              LIMIT toInteger($limit)
            parameters:
              - name: limit
                type: STRING
                description: 'Maximum number of results to return (default: 10)'
          - type: canonicalQuery
            name: get_customer_by_id
            description: Get a specific customer by ID with all connections
            cypher: |
              MATCH (n:Customer {customer_id: $id})
              OPTIONAL MATCH (n)-[r]-(related)
              RETURN n, type(r) AS relationship, labels(related) AS related_labels, related.name AS related_name
              LIMIT 50
            parameters:
              - name: id
                type: STRING
                description: The customer_id to look up
          - type: canonicalQuery
            name: defaultView
            description: create-context-graph's default visualisation query
            cypher: MATCH (c:Customer)-[:PURCHASED]->(o:Order)-[:CONTAINS]->(p:Product) RETURN c, o, p LIMIT 100
    description: consumer (object)
  Product:
    label: Product
    properties:
      product_id:
        type: STRING
        must_exist: true
        unique: true
      name:
        type: STRING
        must_exist: true
      price:
        type: FLOAT
        must_exist: true
      sku:
        type: STRING
        unique: true
      brand:
        type: STRING
      stock_quantity:
        type: INTEGER
      rating:
        type: FLOAT
    extensions:
      display:
        x: -85
        'y': 288
        colour: '#7c3aed'
        custom:
          caption: name
      custom:
        createContextGraph:pole:
          pole_type: OBJECT
          subtype: MERCHANDISE
          origin: domain
        createContextGraph:display:
          icon: package
          size: 20
        tools:
          - type: canonicalQuery
            name: review_sentiment
            description: Analyze review sentiment and ratings for products
            cypher: |
              MATCH (r:Review)-[:REVIEW_OF]->(p:Product)
              WHERE toLower(p.name) CONTAINS toLower($query)
                 OR toLower(p.product_id) CONTAINS toLower($query)
              RETURN p.name AS product, p.product_id,
                     avg(r.rating) AS avg_rating,
                     count(r) AS review_count,
                     sum(CASE WHEN r.rating >= 4 THEN 1 ELSE 0 END) AS positive,
                     sum(CASE WHEN r.rating <= 2 THEN 1 ELSE 0 END) AS negative
              ORDER BY review_count DESC
            parameters:
              - name: query
                type: STRING
                description: Product name or ID to analyze reviews for
    description: merchandise (object)
  Order:
    label: Order
    properties:
      order_id:
        type: STRING
        must_exist: true
        unique: true
      order_date:
        type: ZONED DATETIME
        must_exist: true
      total_amount:
        type: FLOAT
        must_exist: true
      status:
        type: STRING
        one_of:
          - pending
          - processing
          - shipped
          - delivered
          - returned
          - cancelled
      payment_method:
        type: STRING
        one_of:
          - credit_card
          - debit_card
          - paypal
          - apple_pay
          - gift_card
      shipping_method:
        type: STRING
        one_of:
          - standard
          - express
          - overnight
          - pickup
    extensions:
      display:
        x: -227
        'y': 196
        colour: '#ea580c'
        custom:
          caption: name
      custom:
        createContextGraph:pole:
          pole_type: EVENT
          subtype: PURCHASE_ORDER
          origin: domain
        createContextGraph:display:
          icon: shopping-bag
          size: 15
    description: purchase order (event)
  Review:
    label: Review
    properties:
      review_id:
        type: STRING
        must_exist: true
        unique: true
      rating:
        type: INTEGER
        must_exist: true
      title:
        type: STRING
      body:
        type: STRING
      date:
        type: ZONED DATETIME
        must_exist: true
      verified_purchase:
        type: BOOLEAN
      helpful_votes:
        type: INTEGER
    extensions:
      display:
        x: -297
        'y': 43
        colour: '#fbbf24'
        custom:
          caption: name
      custom:
        createContextGraph:pole:
          pole_type: EVENT
          subtype: FEEDBACK
          origin: domain
        createContextGraph:display:
          icon: star
          size: 15
    description: feedback (event)
  Campaign:
    label: Campaign
    properties:
      campaign_id:
        type: STRING
        must_exist: true
        unique: true
      name:
        type: STRING
        must_exist: true
      campaign_type:
        type: STRING
        one_of:
          - email
          - social
          - search
          - display
          - influencer
          - loyalty
      start_date:
        type: DATE
      end_date:
        type: DATE
      budget:
        type: FLOAT
      status:
        type: STRING
        one_of:
          - draft
          - active
          - paused
          - completed
    extensions:
      display:
        x: -273
        'y': -125
        colour: '#db2777'
        custom:
          caption: name
      custom:
        createContextGraph:pole:
          pole_type: EVENT
          subtype: MARKETING_CAMPAIGN
          origin: domain
        createContextGraph:display:
          icon: megaphone
          size: 25
        tools:
          - type: canonicalQuery
            name: campaign_performance
            description: Analyze campaign performance metrics
            cypher: |
              MATCH (camp:Campaign)
              WHERE toLower(camp.name) CONTAINS toLower($query) OR $query = 'all'
              OPTIONAL MATCH (c:Customer)-[:TARGETED_BY]->(camp)
              OPTIONAL MATCH (c)-[:PURCHASED]->(o:Order)
              WHERE o.order_date >= camp.start_date AND o.order_date <= coalesce(camp.end_date, date())
              RETURN camp.name AS campaign, camp.campaign_type, camp.budget,
                     count(DISTINCT c) AS customers_targeted,
                     count(DISTINCT o) AS orders_generated,
                     sum(o.total_amount) AS revenue_attributed
              ORDER BY revenue_attributed DESC
            parameters:
              - name: query
                type: STRING
                description: Campaign name or 'all' for all campaigns
    description: marketing campaign (event)
  Category:
    label: Category
    properties:
      category_id:
        type: STRING
        must_exist: true
        unique: true
      name:
        type: STRING
        must_exist: true
      parent_category:
        type: STRING
      product_count:
        type: INTEGER
      description:
        type: STRING
    extensions:
      display:
        x: -162
        'y': -252
        colour: '#16a34a'
        custom:
          caption: name
      custom:
        createContextGraph:pole:
          pole_type: OBJECT
          subtype: PRODUCT_CATEGORY
          origin: domain
        createContextGraph:display:
          icon: tag
          size: 20
    description: product category (object)
relationships:
  WORKS_FOR:
    type: WORKS_FOR
    from:
      node: Person
    to:
      node: Organization
    extensions:
      custom:
        createContextGraph:origin:
          origin: base
  LOCATED_AT:
    type: LOCATED_AT
    from:
      node: Organization
    to:
      node: Location
    extensions:
      custom:
        createContextGraph:origin:
          origin: base
  PARTICIPATED_IN:
    type: PARTICIPATED_IN
    from:
      node: Person
    to:
      node: Event
    extensions:
      custom:
        createContextGraph:origin:
          origin: base
  PURCHASED:
    type: PURCHASED
    from:
      node: Customer
    to:
      node: Order
    extensions:
      custom:
        createContextGraph:origin:
          origin: domain
  CONTAINS:
    type: CONTAINS
    from:
      node: Order
    to:
      node: Product
    extensions:
      custom:
        createContextGraph:origin:
          origin: domain
  REVIEWED:
    type: REVIEWED
    from:
      node: Customer
    to:
      node: Review
    extensions:
      custom:
        createContextGraph:origin:
          origin: domain
  REVIEW_OF:
    type: REVIEW_OF
    from:
      node: Review
    to:
      node: Product
    extensions:
      custom:
        createContextGraph:origin:
          origin: domain
  RECOMMENDED:
    type: RECOMMENDED
    from:
      node: Product
    to:
      node: Product
    extensions:
      custom:
        createContextGraph:origin:
          origin: domain
  BROWSED:
    type: BROWSED
    from:
      node: Customer
    to:
      node: Product
    extensions:
      custom:
        createContextGraph:origin:
          origin: domain
  BELONGS_TO_CATEGORY:
    type: BELONGS_TO_CATEGORY
    from:
      node: Product
    to:
      node: Category
    extensions:
      custom:
        createContextGraph:origin:
          origin: domain
  TARGETED_BY:
    type: TARGETED_BY
    from:
      node: Customer
    to:
      node: Campaign
    extensions:
      custom:
        createContextGraph:origin:
          origin: domain
extensions:
  custom:
    createContextGraph:domain:
      tagline: AI-powered Retail Intelligence
      emoji: 🛒
      inherits: _base
    createContextGraph:documentTemplates:
      - id: order_confirmation
        name: Order Confirmation
        description: Customer order confirmation emails
        count: 12
        prompt_template: |
          Write an order confirmation email for customer {{customer.name}}
          ({{customer.email}}) for order {{order.order_id}} placed on {{order.order_date}}.
          Items: {{product.name}}. Total: ${{order.total_amount}}.
          Shipping: {{order.shipping_method}}. Payment: {{order.payment_method}}.
        required_entities:
          - Customer
          - Order
          - Product
      - id: support_ticket
        name: Support Ticket
        description: Customer support tickets and resolution notes
        count: 10
        prompt_template: |
          Write a customer support ticket for {{customer.name}} regarding
          order {{order.order_id}}. Issue type: {{issue_type}}.
          Product: {{product.name}}. Include customer communication history,
          resolution steps, and outcome.
        required_entities:
          - Customer
          - Order
          - Product
      - id: campaign_brief
        name: Campaign Brief
        description: Marketing campaign planning and execution briefs
        count: 6
        prompt_template: |
          Write a campaign brief for "{{campaign.name}}" ({{campaign.campaign_type}}).
          Budget: ${{campaign.budget}}. Target segment: {{customer.segment}} customers.
          Featured products from {{category.name}}. Include objectives,
          target audience, messaging strategy, and success metrics.
        required_entities:
          - Campaign
          - Customer
          - Category
          - Product
      - id: product_review_summary
        name: Product Review Summary
        description: Aggregated product review analysis reports
        count: 8
        prompt_template: |
          Write a product review summary for {{product.name}} ({{product.sku}}).
          Average rating: {{product.rating}}. Include sentiment analysis,
          common praise and complaints, and recommendations for product improvement.
        required_entities:
          - Product
          - Review
          - Category
      - id: inventory_report
        name: Inventory Report
        description: Stock level and inventory management reports
        count: 6
        prompt_template: |
          Write an inventory report for the {{category.name}} category.
          Include current stock levels, reorder recommendations,
          top-selling products, and slow-moving inventory flagged for markdown.
        required_entities:
          - Product
          - Category
          - Order
    createContextGraph:decisionTraces:
      - id: pricing_strategy
        task: Determine optimal pricing for {{product.name}} based on market data and customer behavior
        steps:
          - thought: Analyze current sales velocity and price sensitivity
            action: Query order history and revenue trends for this product
          - thought: Review competitor pricing and market positioning
            action: Compare with recommended/similar products in the same category
          - thought: Evaluate customer segment willingness to pay
            action: Analyze purchase patterns across customer segments
          - thought: Consider inventory levels and margin requirements
            action: Check stock levels and calculate margin at various price points
        outcome_template: 'Recommended price: ${{price}} based on {{rationale}}'
      - id: campaign_targeting
        task: Select optimal customer segments for {{campaign.name}} campaign
        steps:
          - thought: Identify target audience based on campaign objectives
            action: Query customer segments and their purchase history
          - thought: Analyze past campaign performance by segment
            action: Review conversion rates from similar past campaigns
          - thought: Estimate ROI for each segment combination
            action: Calculate expected revenue vs. campaign cost per segment
        outcome_template: 'Target segments: {{segments}} with projected ROI of {{roi}}'
      - id: product_recommendation
        task: Generate personalized product recommendations for customer {{customer.name}}
        steps:
          - thought: Review customer purchase history and browsing behavior
            action: Query customer's order history and browsed products
          - thought: Identify patterns in category and brand preferences
            action: Analyze product categories and attributes of past purchases
          - thought: Find similar customers and their top purchases
            action: Use collaborative filtering to find products liked by similar customers
        outcome_template: 'Top recommendations: {{products}} based on {{rationale}}'
      - id: inventory_reorder
        task: Determine reorder quantities for products in {{category.name}} category
        steps:
          - thought: Analyze current stock levels and sales velocity
            action: Query products in this category with stock quantities and recent order volumes
          - thought: Forecast demand based on historical sales patterns and seasonality
            action: Review order history trends and identify seasonal demand fluctuations
          - thought: Calculate optimal reorder points and quantities
            action: Model reorder quantities based on lead times, safety stock, and demand forecast
          - thought: Prioritize by stockout risk and revenue impact
            action: Rank products by days-of-stock remaining and contribution to category revenue
        outcome_template: 'Reorder plan: {{plan}}. Total cost: ${{cost}}. Stockout risk items: {{risk_count}}'
      - id: churn_prevention
        task: Design retention intervention for at-risk customer {{customer.name}}
        steps:
          - thought: Analyze declining purchase patterns and engagement signals
            action: Query customer order history and identify frequency and value trends
          - thought: Identify what initially attracted and retained this customer
            action: Review earliest purchases, preferred categories, and browsing patterns
          - thought: Select appropriate retention offer based on customer segment and value
            action: Match intervention type to customer lifetime value and churn risk level
          - thought: Estimate retention probability and cost-effectiveness
            action: Calculate expected revenue recovery vs cost of the retention offer
        outcome_template: 'Intervention: {{offer}}. Win-back probability: {{probability}}%. Expected ROI: {{roi}}'
      - id: category_performance_review
        task: Review performance of {{category.name}} category and recommend strategic actions
        steps:
          - thought: Analyze revenue, margin, and growth trends for the category
            action: Query orders containing products in this category and calculate trends
          - thought: Evaluate product mix and identify winners and losers
            action: Rank products by revenue, rating, and return rates within the category
          - thought: Assess competitive positioning and pricing strategy
            action: Compare category pricing against market benchmarks and review sentiment
          - thought: Recommend assortment changes and promotional priorities
            action: Identify products to promote, markdown, or discontinue based on performance
        outcome_template: 'Category health: {{status}}. Top actions: {{actions}}. Revenue opportunity: ${{opportunity}}'
      - id: return_rate_investigation
        task: Investigate high return rate for product {{product.name}}
        steps:
          - thought: Analyze return volumes and reasons
            action: Query orders with returned status containing this product
          - thought: Review customer reviews for quality and expectation issues
            action: Search reviews for this product with low ratings and extract common complaints
          - thought: Compare against similar products in the category
            action: Benchmark return rate against other products in the same category
          - thought: Recommend corrective actions
            action: Identify whether issue is product quality, listing accuracy, or shipping related
        outcome_template: 'Root cause: {{cause}}. Return rate: {{rate}}%. Recommendation: {{recommendation}}'
      - id: cross_sell_optimization
        task: Optimize cross-sell recommendations for products in {{category.name}}
        steps:
          - thought: Identify frequently co-purchased product pairs
            action: Query orders to find products most often purchased together
          - thought: Evaluate recommendation effectiveness by conversion
            action: Compare recommended product pairs with actual purchase completion rates
          - thought: Test complementary vs aspirational cross-sell strategies
            action: Analyze whether lower-price accessories or higher-price upgrades convert better
        outcome_template: 'Top cross-sell pairs: {{pairs}}. Expected revenue uplift: {{uplift}}%'
      - id: promotion_effectiveness
        task: Evaluate effectiveness of {{campaign.name}} promotion and recommend adjustments
        steps:
          - thought: Measure incremental sales lift during the promotion period
            action: Compare order volume and revenue during vs before the campaign
          - thought: Assess whether the promotion attracted new customers or cannibalized existing demand
            action: Segment campaign orders by customer segment new vs returning
          - thought: Calculate true ROI accounting for margin impact
            action: Factor in discount costs, campaign budget, and incremental margin
          - thought: Identify which products and segments responded best
            action: Break down campaign performance by product category and customer segment
        outcome_template: 'Promotion ROI: {{roi}}%. Incremental revenue: ${{revenue}}. Best segment: {{segment}}'
    createContextGraph:demoScenarios:
      - name: Customer Intelligence
        prompts:
          - Show me the top 10 VIP customers by lifetime value
          - What products has customer Jane Smith purchased in the last 6 months?
          - Which customers are at risk of churning based on declining order frequency?
      - name: Product & Catalog
        prompts:
          - What are the best-selling products in the Electronics category?
          - Show me products with average rating below 3 stars and high return rates
          - Which products are frequently purchased together?
      - name: Marketing & Campaigns
        prompts:
          - How did the Summer Sale campaign perform by customer segment?
          - What is the conversion rate for email vs social campaigns?
          - Recommend products to feature in our next loyalty campaign
    createContextGraph:systemPrompt: |
      You are an AI retail intelligence assistant with access to a comprehensive
      knowledge graph of customer, product, order, and marketing data. You help
      e-commerce managers, marketing teams, and customer service representatives
      optimize sales, improve customer experience, and drive campaign performance.

      Your capabilities include:
      - Searching and analyzing customer profiles and purchase history
      - Generating personalized product recommendations
      - Monitoring order fulfillment and identifying issues
      - Analyzing campaign performance and ROI
      - Reviewing product sentiment and customer feedback trends

      Always provide accurate, data-driven responses. When making recommendations,
      cite specific customer data, sales metrics, and review insights from the
      knowledge graph.
    createContextGraph:visualization:
      node_colors:
        Person: '#22c55e'
        Organization: '#3b82f6'
        Customer: '#0891b2'
        Product: '#7c3aed'
        Order: '#ea580c'
        Review: '#fbbf24'
        Campaign: '#db2777'
        Category: '#16a34a'
      node_sizes:
        Person: 20
        Organization: 25
        Customer: 25
        Product: 20
        Order: 15
        Review: 15
        Campaign: 25
        Category: 20
      default_cypher: MATCH (c:Customer)-[:PURCHASED]->(o:Order)-[:CONTAINS]->(p:Product) RETURN c, o, p LIMIT 100
