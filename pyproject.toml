[project]
name = "relate-examples"
version = "0.1.0"
description = "Runnable examples for Relate, the embedded openCypher graph database"
requires-python = ">=3.11"
dependencies = [
    "relate-db==1.3.0",
    "pytest>=8",
]

[tool.uv]
package = false
# Lock for macOS and Linux (CI) only.
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'"]

[tool.pytest.ini_options]
testpaths = ["examples", "lib/tests"]
