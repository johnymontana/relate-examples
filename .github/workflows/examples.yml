# Runs `uv run pytest -q` and the examples offline on linux/amd64 against the pinned Relate release.
# A push to main and a run started by hand run every example; a pull request runs the examples whose
# inputs it changed (ci/changed-examples.sh, ADR-0018). Why each step exists and the cache layout:
# ci/README.md.
name: examples
on:
  push:
    branches: [main]   # a branch is tested through its pull request, once, not once more per push
  pull_request:
  workflow_dispatch:   # every example, on any branch
permissions:
  contents: read
concurrency:
  group: examples-${{ github.ref }}
  cancel-in-progress: true
env:
  RELATE_VERSION: v1.2.0
  RELATE_TELEMETRY: "off"   # examples run offline; no CLI call phones home from CI
  # Under an agent harness the relate CLI turns agent mode on for piped output (toon, 100-row cap).
  # CI sets none of its variables, so this changes nothing here; it keeps a run started by an agent
  # (act, a self-hosted runner in an agent session) identical to CI. scripts/env.sh sets them too.
  RELATE_MAX_ROWS: "0"
  RELATE_AGENT_MODE: "0"
defaults:
  run:
    shell: bash   # bash --noprofile --norc -eo pipefail {0}
jobs:
  run:
    runs-on: ubuntu-24.04
    # On a cold cache example 01 adds a gliner-rs build (cargo install of wasm-pack and
    # wasm-bindgen, then the crate), 304 MB of weights and Chromium, before its own run.
    timeout-minutes: 60
    env:
      # In this job a missing optional dependency FAILS instead of printing SKIP and passing.
      EXAMPLES_REQUIRE: wasm,gliner,browser   # 01's keys; 02's and 03's (wasm, browser) are among them
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2   # a pull request's checkout is its merge into the base: the base is HEAD^1

      # Which examples this run needs (ADR-0018). For a pull request: those whose inputs it changed,
      # every one of them if it touched anything shared. Otherwise every example. The outputs are
      # ex01, ex02, ex03 (true or false, by the directory's number), any, and list.
      - name: Which examples to run
        id: plan
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [[ "$EVENT" == pull_request ]]; then
            git diff --name-only --no-renames HEAD^1 HEAD > "$RUNNER_TEMP/changed.txt"
            ci/changed-examples.sh < "$RUNNER_TEMP/changed.txt" > "$RUNNER_TEMP/examples.txt"
            echo "This pull request changes $(wc -l < "$RUNNER_TEMP/changed.txt" | tr -d ' ') files." >> "$GITHUB_STEP_SUMMARY"
          else
            ci/changed-examples.sh --all > "$RUNNER_TEMP/examples.txt"
          fi
          for r in examples/*/run.sh; do
            name="$(basename "$(dirname "$r")")"
            if grep -qxF "$name" "$RUNNER_TEMP/examples.txt"; then run=true; else run=false; fi
            echo "ex${name%%-*}=$run" >> "$GITHUB_OUTPUT"
          done
          if [[ -s "$RUNNER_TEMP/examples.txt" ]]; then echo "any=true" >> "$GITHUB_OUTPUT"; else echo "any=false" >> "$GITHUB_OUTPUT"; fi
          echo "list=$(tr '\n' ' ' < "$RUNNER_TEMP/examples.txt")" >> "$GITHUB_OUTPUT"
          echo "Examples to run: $(tr '\n' ' ' < "$RUNNER_TEMP/examples.txt")"

      # The relate CLI, linux-amd64, from the public release, checked against ci/relate-<ver>.sha256
      # (the release's own SHA256SUMS, committed when the pin was bumped).
      - name: Install relate ${{ env.RELATE_VERSION }}
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/relate-linux-amd64" \
            "https://github.com/relatedb/relate/releases/download/${RELATE_VERSION}/relate-linux-amd64"
          (cd "$RUNNER_TEMP" && grep ' relate-linux-amd64$' "$GITHUB_WORKSPACE/ci/relate-${RELATE_VERSION#v}.sha256" | sha256sum -c -)
          install -m 0755 "$RUNNER_TEMP/relate-linux-amd64" "$HOME/.local/bin/relate"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: test "$(relate --version | head -1)" = "Relate ${RELATE_VERSION}"

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.11.29"        # the uv that wrote uv.lock; bump both together
          python-version: "3.12"    # the interpreter expected/ was recorded with
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      - name: The binding and the CLI are the same engine
        run: test "$(uv run python -c 'import relate; print(relate.__version__)')" = "${RELATE_VERSION#v}"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: examples/*/package-lock.json

      # ---- Example 01 (keys wasm, gliner, browser) ------------------------------------------------
      # gliner-rs v0.3.1 (4fa741e, the script's default) built to WASM. On a hit the script only
      # re-checks the build (--check semantics); on a miss Rust 1.97.1 is set up with the
      # wasm32 target, then the script installs wasm-pack 0.15.0 and wasm-bindgen-cli 0.2.128
      # with cargo install --locked into .cache/wasm-tools (cached separately) and builds.
      # The .wasm differs by build host, so it is not byte-pinned: expected/model.txt pins the
      # behaviour instead (scripts/build-gliner-wasm.sh).
      # Only when example 01 runs: nothing else needs gliner-rs or the weights.
      - name: Restore the gliner-rs WASM build
        id: gliner-wasm
        if: steps.plan.outputs.ex01 == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .cache/gliner-wasm
          key: gliner-wasm-${{ runner.os }}-4fa741e-${{ hashFiles('scripts/build-gliner-wasm.sh') }}
      - name: Restore wasm-pack and wasm-bindgen
        id: wasm-tools
        if: steps.plan.outputs.ex01 == 'true' && steps.gliner-wasm.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .cache/wasm-tools
          key: wasm-tools-${{ runner.os }}-4fa741e-${{ hashFiles('scripts/build-gliner-wasm.sh') }}
      # Rust 1.97.1 becomes rustup's default from here on.
      - if: steps.plan.outputs.ex01 == 'true' && steps.gliner-wasm.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@766a42937d994bd78bb4591385445c188ccb3f09  # 1.97.1 branch (toolchain: 1.97.1 in its action.yml)
        with:
          targets: wasm32-unknown-unknown
      - name: Build gliner-rs to WASM
        if: steps.plan.outputs.ex01 == 'true'
        run: scripts/build-gliner-wasm.sh
      - if: steps.plan.outputs.ex01 == 'true' && steps.gliner-wasm.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .cache/gliner-wasm
          key: ${{ steps.gliner-wasm.outputs.cache-primary-key }}
      - if: steps.plan.outputs.ex01 == 'true' && steps.gliner-wasm.outputs.cache-hit != 'true' && steps.wasm-tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .cache/wasm-tools
          key: ${{ steps.wasm-tools.outputs.cache-primary-key }}

      # GLiNER2.5-small-v1 from the Hugging Face Hub at the pinned revision (no auth), every file
      # checked against ci/gliner2.5-small-v1.sha256. Exports GLINER_SMALL_DIR.
      - name: Restore the GLiNER2.5 weights
        id: gliner
        if: steps.plan.outputs.ex01 == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .cache/gliner
          key: gliner-weights-${{ hashFiles('ci/gliner2.5-*.sha256') }}
      - name: Fetch GLiNER2.5-small-v1
        if: steps.plan.outputs.ex01 == 'true'
        run: scripts/fetch-gliner.sh small
      - if: steps.plan.outputs.ex01 == 'true' && steps.gliner.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .cache/gliner
          key: ${{ steps.gliner.outputs.cache-primary-key }}

      # 01's own package-lock.json: @relate/relate-wasm (the Relate WASM bundle, its sha512
      # integrity pinned there), NVL 2.0.0, js-yaml, esbuild, playwright 1.63.0; --omit=peer
      # skips NVL's unused neo4j-driver peer. Then esbuild's NVL vendor bundle. Always installed, whichever
      # examples run: lib/tests reads the Relate WASM bundle from here, and Playwright is run from here.
      - name: Example 01's npm packages and the NVL vendor bundle
        run: |
          npm ci --omit=peer --prefix examples/01-wasm-extract
          npm run --prefix examples/01-wasm-extract vendor
      # Playwright's Chromium (every example's browser section). The browser download is cached; its
      # system libraries are installed on every run that runs an example.
      - name: Restore Playwright's Chromium
        id: playwright
        if: steps.plan.outputs.any == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('examples/01-wasm-extract/package-lock.json') }}
      - name: Install Chromium for Playwright
        if: steps.plan.outputs.any == 'true'
        env:
          HIT: ${{ steps.playwright.outputs.cache-hit }}
        run: |
          if [[ "$HIT" == true ]]; then
            npx --prefix examples/01-wasm-extract playwright install-deps chromium
          else
            npx --prefix examples/01-wasm-extract playwright install --with-deps chromium
          fi
      - if: steps.plan.outputs.any == 'true' && steps.playwright.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright.outputs.cache-primary-key }}

      # ---- Example 02 (keys wasm, browser) ------------------------------------------------------------
      # 02's own package-lock.json: @relate/relate-wasm, @mlc-ai/web-llm, @neo4j/ontology-graph-spec, NVL
      # 2.0.0, js-yaml, esbuild and playwright 1.63.0 (the same Playwright as 01, so the Chromium installed
      # above serves both). The models never run in CI: the browser section drives the page in canned mode.
      - name: Example 02's npm packages
        if: steps.plan.outputs.ex02 == 'true'
        run: npm ci --omit=peer --prefix examples/02-wasm-text2cypher

      # ---- Example 03 (keys wasm, browser) ------------------------------------------------------------
      # 03's own package-lock.json: @relate/relate-wasm, NVL 2.0.0, the Public Sans and IBM Plex Mono font
      # packages, esbuild and playwright 1.63.0 (the same Playwright again, so the Chromium installed above
      # serves it too) and Transformers.js; --omit=peer skips NVL's unused neo4j-driver peer. No model runs here:
      # the scripts' vectors are in data/embeddings.json. Transformers.js depends on onnxruntime-node, which
      # nothing here loads and whose install script would fetch CUDA libraries on linux: skipped.
      - name: Example 03's npm packages
        if: steps.plan.outputs.ex03 == 'true'
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
        run: npm ci --omit=peer --prefix examples/03-wasm-agent-memory

      # No .env in CI: offline runs.
      - run: uv run pytest -q
      - name: The bundled ontologies match their originals
        run: node examples/01-wasm-extract/harness/convert.mjs --check
      - name: Run the examples offline
        run: |
          failed=()
          echo "| example | result | s |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for r in examples/*/run.sh; do
            name="$(basename "$(dirname "$r")")"; log="$RUNNER_TEMP/$name.log"; start=$SECONDS
            if ! grep -qxF "$name" "$RUNNER_TEMP/examples.txt"; then
              echo "$name: not run (this pull request changes none of its inputs)"
              echo "| $name | not run: none of its inputs changed | |" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            echo "::group::$name"
            rc=0; "$r" 2>&1 | tee "$log" || rc=$?
            echo "::endgroup::"
            if (( rc != 0 )); then
              result="FAIL (exit $rc)"; failed+=("$name")
              echo "::error title=$name::run.sh exited $rc"
            elif grep -q '^SKIP' "$log"; then
              result="$(grep -m1 '^SKIP' "$log" | tr '|' '/')"
            else
              result=pass
            fi
            echo "| $name | $result | $((SECONDS - start)) |" >> "$GITHUB_STEP_SUMMARY"
          done
          if (( ${#failed[@]} > 0 )); then echo "failed: ${failed[*]}"; exit 1; fi
